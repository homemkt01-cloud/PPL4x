<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#000000">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>PPL 4x</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600&display=swap">
<style>
/* ══ TOKENS — Apple Fitness Exact ════════════════════════════ */
:root{
  --bg:#000000;--bg2:#1C1C1E;--surf:#1C1C1E;--surf2:#2C2C2E;--surf3:#3A3A3C;
  --bdr:rgba(84,84,88,.65);--bdr-s:rgba(84,84,88,.85);
  /* Apple Fitness lime green — exact from Workout tab active + "Let's Go" button */
  --acc:#C6FF00;--acc-g:rgba(198,255,0,.12);--acc-d:rgba(198,255,0,.08);
  --tx:#FFFFFF;--tx2:rgba(235,235,245,.80);--tx3:rgba(235,235,245,.50);
  /* Apple system colors exact */
  --grn:#30D158;--grn-d:rgba(48,209,88,.14);
  --red:#FF375F;--yel:#FFD60A;--blu:#0A84FF;--pur:#BF5AF2;--cyn:#00C7FF;
  --nav:49px;--r:16px;
  /* Day accent colors */
  --dl:#FF375F;--dp:#0A84FF;--du:#30D158;--df:#BF5AF2;
  /* Apple Fitness Activity ring colors */
  --ring-move:#FA114F;--ring-ex:#C6FF00;--ring-stand:#00C7FF;
}
@media(prefers-color-scheme:light){:root:not([data-theme=dark]){
  --bg:#F2F2F7;--bg2:#FFFFFF;--surf:#FFFFFF;--surf2:#F2F2F7;--surf3:#E5E5EA;
  --bdr:rgba(60,60,67,.29);--bdr-s:rgba(60,60,67,.45);
  --acc:#4CD964;--acc-g:rgba(76,217,100,.1);--acc-d:rgba(76,217,100,.07);
  --tx:#000000;--tx2:rgba(60,60,67,.6);--tx3:rgba(60,60,67,.36);
  --grn:#34C759;--grn-d:rgba(52,199,89,.12);
  --red:#FF3B30;--yel:#FF9F0A;--blu:#007AFF;--pur:#AF52DE;--cyn:#5AC8FA;
  --dl:#FF3B30;--dp:#007AFF;--du:#34C759;--df:#AF52DE;
  --ring-move:#FF3B30;--ring-ex:#34C759;--ring-stand:#5AC8FA;
}}
:root[data-theme=dark]{
  --bg:#000000;--bg2:#1C1C1E;--surf:#1C1C1E;--surf2:#2C2C2E;--surf3:#3A3A3C;
  --bdr:rgba(84,84,88,.65);--bdr-s:rgba(84,84,88,.85);
  --acc:#C6FF00;--acc-g:rgba(198,255,0,.12);--acc-d:rgba(198,255,0,.08);
  --tx:#FFFFFF;--tx2:rgba(235,235,245,.80);--tx3:rgba(235,235,245,.50);
  --grn:#30D158;--grn-d:rgba(48,209,88,.14);
  --red:#FF375F;--yel:#FFD60A;--blu:#0A84FF;--pur:#BF5AF2;--cyn:#00C7FF;
  --dl:#FF375F;--dp:#0A84FF;--du:#30D158;--df:#BF5AF2;
  --ring-move:#FA114F;--ring-ex:#C6FF00;--ring-stand:#00C7FF;
}
:root[data-theme=light]{
  --bg:#F2F2F7;--bg2:#FFFFFF;--surf:#FFFFFF;--surf2:#F2F2F7;--surf3:#E5E5EA;
  --bdr:rgba(60,60,67,.29);--bdr-s:rgba(60,60,67,.45);
  --acc:#4CD964;--acc-g:rgba(76,217,100,.1);--acc-d:rgba(76,217,100,.07);
  --tx:#000000;--tx2:rgba(60,60,67,.6);--tx3:rgba(60,60,67,.36);
  --grn:#34C759;--grn-d:rgba(52,199,89,.12);
  --red:#FF3B30;--yel:#FF9F0A;--blu:#007AFF;--pur:#AF52DE;--cyn:#5AC8FA;
  --dl:#FF3B30;--dp:#007AFF;--du:#34C759;--df:#AF52DE;
  --ring-move:#FF3B30;--ring-ex:#34C759;--ring-stand:#5AC8FA;
}
/* ══ RESET ═══════════════════════════════════════════════════ */
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:var(--bg);color:var(--tx);font-family:-apple-system,'IBM Plex Sans Thai',system-ui,sans-serif;font-size:16px;line-height:1.5}
body{overflow:hidden}
/* ══ SHELL ═══════════════════════════════════════════════════ */
#app{height:100dvh;display:flex;flex-direction:column}
#main{flex:1;overflow-y:auto;overflow-x:hidden;padding-bottom:calc(var(--nav) + env(safe-area-inset-bottom) + 16px)}
/* ══ NAV — iOS Tab Bar style ═════════════════════════════════ */
#nav{height:var(--nav);border-top:0.5px solid rgba(84,84,88,.6);background:rgba(0,0,0,0.85);backdrop-filter:blur(40px) saturate(180%);-webkit-backdrop-filter:blur(40px) saturate(180%);display:flex;position:fixed;bottom:0;left:0;right:0;z-index:100;padding-bottom:env(safe-area-inset-bottom)}
.nb{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;background:none;border:none;color:rgba(235,235,245,.45);cursor:pointer;font-family:inherit;font-size:10px;font-weight:500;letter-spacing:.01em;transition:color .18s;padding-top:6px}
.nb.on{color:var(--acc)}
.nb svg{width:25px;height:25px}
.screen{display:none;min-height:100%}
.screen.on{display:block}
/* ══ PAGE HEADER — Apple large title ════════════════════════ */
.ph{padding:16px 20px 12px;background:rgba(0,0,0,0.85);backdrop-filter:blur(40px);-webkit-backdrop-filter:blur(40px);position:sticky;top:0;z-index:10;border-bottom:0.5px solid rgba(84,84,88,.5)}
.ph h1{font-size:34px;font-weight:700;letter-spacing:.37px;line-height:1.06;color:var(--tx)}
.ph p{font-size:13px;color:var(--tx3);margin-top:2px;font-weight:400}
/* ══ CARDS ════════════════════════════════════════════════════ */
.card{background:var(--surf);border-radius:var(--r);margin:8px 16px;overflow:hidden}
/* ══ BADGES ═══════════════════════════════════════════════════ */
.bdg{display:inline-block;font-size:10px;font-weight:600;letter-spacing:.04em;padding:3px 8px;border-radius:20px;text-transform:uppercase}
.bn{background:var(--surf2);color:var(--tx3)}
.bf{background:var(--acc-d);color:var(--acc)}
.bd{background:rgba(255,55,95,.13);color:var(--red)}
.bm{background:rgba(10,132,255,.13);color:var(--blu)}
.bh{background:rgba(255,214,10,.12);color:var(--yel)}
.ba{background:var(--grn-d);color:var(--grn)}
.bp{background:rgba(10,132,255,.1);color:var(--blu)}
.bs{background:var(--acc-d);color:var(--acc)}
/* ══ EXERCISE CARD — Apple grouped style ══════════════════════ */
.exc{background:var(--surf);border-radius:var(--r);margin:6px 16px;overflow:hidden}
.exc.ss1{border-bottom-left-radius:0;border-bottom-right-radius:0;margin-bottom:0}
.exc.ss2{border-top-left-radius:0;border-top-right-radius:0;margin-top:0;border-top:1.5px solid var(--acc)}
.exh{padding:14px 16px 10px;display:flex;align-items:flex-start;gap:10px}
.exn{flex:1;min-width:0}
.exnm{font-size:19px;font-weight:600;line-height:1.15;color:var(--tx);text-decoration:none;display:block;word-break:break-word;letter-spacing:-.3px}
.exnm:active{opacity:.6}
.exmeta{font-size:12px;color:var(--tx3);margin-top:4px;line-height:1.4}
/* ══ SET TABLE ════════════════════════════════════════════════ */
.st{width:100%;border-collapse:collapse}
.st th{font-size:10px;color:var(--tx3);font-weight:600;text-align:left;padding:5px 8px 5px 16px;text-transform:uppercase;letter-spacing:.06em;border-top:1px solid var(--bdr);background:var(--bg2)}
.st td{padding:8px 8px 8px 16px;border-top:1px solid var(--bdr);vertical-align:middle}
.sn{font-size:12px;color:var(--tx3);font-weight:500;width:26px}
.sd{width:42px;text-align:center}
/* ══ WEIGHT INPUT ═════════════════════════════════════════════ */
.wc{display:flex;align-items:center;gap:5px}
.wi{width:72px;background:var(--surf2);border:none;color:var(--tx);font-family:-apple-system,sans-serif;font-size:17px;font-weight:600;font-variant-numeric:tabular-nums;text-align:center;padding:7px 3px;border-radius:10px;-moz-appearance:textfield;transition:background .15s}
.wi::-webkit-outer-spin-button,.wi::-webkit-inner-spin-button{-webkit-appearance:none}
.wi:focus{outline:none;background:var(--surf3)}
.ab{width:34px;height:38px;border:none;background:var(--surf2);color:var(--tx2);cursor:pointer;font-size:18px;border-radius:10px;display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:all .12s}
.ab:active{background:var(--acc);color:#000}
/* ══ REPS INPUT ═══════════════════════════════════════════════ */
.ri{width:54px;background:var(--surf2);border:none;color:var(--tx);font-family:-apple-system,sans-serif;font-size:16px;font-weight:600;font-variant-numeric:tabular-nums;text-align:center;padding:7px 3px;border-radius:10px;-moz-appearance:textfield;transition:background .15s}
.ri::-webkit-outer-spin-button,.ri::-webkit-inner-spin-button{-webkit-appearance:none}
.ri:focus{outline:none;background:var(--surf3)}
.rt{font-size:10px;color:var(--tx3);margin-top:2px}
/* ══ DONE BUTTON — Apple circle checkmark ════════════════════ */
.db{width:38px;height:38px;border-radius:50%;border:2px solid var(--surf3);background:var(--surf2);cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .2s;flex-shrink:0}
.db:active{transform:scale(.88)}
.db.done{background:var(--acc);border-color:var(--acc);box-shadow:0 0 0 4px rgba(198,255,0,.18)}
.db svg{width:16px;height:16px;color:transparent;transition:color .15s}
.db.done svg{color:#000}
tr.dc td{opacity:.45}
/* ══ MISC EXERCISE ════════════════════════════════════════════ */
.wubar{font-size:11px;color:var(--tx2);padding:5px 14px 4px;background:var(--bg);border-bottom:0.5px solid rgba(84,84,88,.5)}
.wubar strong{font-size:10px;text-transform:uppercase;letter-spacing:.05em;color:var(--tx3)}
.sug{font-size:12px;color:#000;background:var(--acc);border-radius:20px;padding:4px 12px;display:inline-block;margin:4px 14px 6px;font-weight:600}
.frpe{font-size:10px;color:var(--acc);background:var(--acc-d);border-radius:20px;padding:1px 7px;white-space:nowrap}
.hbtn{padding:8px 20px;background:var(--acc);border:none;color:#000;border-radius:12px;font-size:15px;font-weight:700;cursor:pointer}
.htick{font-variant-numeric:tabular-nums;font-size:24px;font-weight:700;color:var(--acc)}
/* ══ REST TIMER — Apple Activity Ring style ═══════════════════ */
#tov{position:fixed;bottom:calc(var(--nav) + env(safe-area-inset-bottom) + 14px);left:0;right:0;z-index:200;display:flex;flex-direction:column;align-items:center;pointer-events:none;gap:8px}
.tpill{background:var(--bg2);border:1px solid var(--acc);border-radius:32px;padding:8px 18px;display:flex;align-items:center;gap:12px;pointer-events:all;box-shadow:0 4px 32px rgba(0,0,0,.7)}
.tring-wrap{position:relative;width:148px;height:148px;pointer-events:all;filter:drop-shadow(0 8px 32px rgba(0,0,0,.65))}
.tring-svg{width:148px;height:148px;transform:rotate(-90deg)}
.tring-bg{fill:rgba(0,0,0,.84);stroke:rgba(255,255,255,.05);stroke-width:10}
.tring-fg{fill:none;stroke-width:10;stroke-linecap:round;stroke-dasharray:301.6;transition:stroke-dashoffset .98s linear,stroke .5s}
.tring-center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.ttim{font-family:-apple-system,sans-serif;font-size:36px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.05;letter-spacing:-.5px}
.tlbl{font-size:11px;color:var(--tx3);max-width:90px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;text-align:center}
.tskp{background:rgba(0,0,0,.75);border:1px solid var(--bdr-s);color:var(--tx2);padding:8px 24px;border-radius:24px;font-size:13px;cursor:pointer;pointer-events:all;font-family:inherit;backdrop-filter:blur(12px);transition:all .15s}
.tskp:active{color:var(--acc);border-color:var(--acc)}
/* ══ DAY PICKER — Apple Fitness Workout card ══════════════════ */
.dgrid{display:flex;flex-direction:column;gap:12px;padding:12px 16px 8px}
.dbtn{background:var(--surf);border-radius:18px;padding:0;text-align:left;cursor:pointer;width:100%;position:relative;overflow:hidden;transition:transform .13s,opacity .13s;display:flex;flex-direction:column;min-height:116px;border:none}
.dbtn:active{transform:scale(.97);opacity:.88}
/* Dark tint — Apple Workout card style */
.dbtn-tint{position:absolute;inset:0;background:linear-gradient(130deg,rgba(0,0,0,0) 40%,rgba(0,0,0,0)),linear-gradient(130deg,var(--day-c,var(--acc)) 0%,transparent 55%);opacity:.22;pointer-events:none}
.dbtn-body{padding:18px 70px 16px 18px;flex:1;position:relative;z-index:1}
.dbtn .dn{font-size:20px;font-weight:700;color:var(--tx);display:block;line-height:1.1;letter-spacing:-.3px}
.dbtn .dt{font-size:13px;color:var(--tx3);margin-top:2px;font-weight:400}
.d-musc{font-size:12px;color:var(--tx2);margin-top:10px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:1.4}
.d-last{font-size:11px;color:var(--tx3);margin-top:3px}
/* Apple Fitness play button — lime green circle */
.d-play{position:absolute;top:50%;right:18px;transform:translateY(-50%);width:46px;height:46px;border-radius:50%;background:var(--acc);display:flex;align-items:center;justify-content:center;flex-shrink:0;z-index:2}
.d-play svg{width:18px;height:18px;fill:#000;margin-left:2px}
/* ══ WEEK SELECTOR — Apple Fitness segmented pill style ═══════ */
.wsel{display:flex;gap:5px;padding:10px 16px 6px;overflow-x:auto;scrollbar-width:none;background:var(--bg2);border-bottom:0.5px solid rgba(84,84,88,.5)}
.wsel::-webkit-scrollbar{display:none}
.wbtn{flex-shrink:0;padding:6px 15px;border-radius:20px;border:none;background:var(--surf2);color:var(--tx3);font-size:13px;font-weight:600;cursor:pointer;white-space:nowrap;transition:all .15s}
.wbtn.on{background:var(--acc);color:#000}
.dlnote{margin:0 16px 8px;padding:10px 14px;background:rgba(255,214,10,.08);border:1px solid rgba(255,214,10,.2);border-radius:12px;font-size:13px;color:var(--yel);line-height:1.45}
/* ══ SESSION HEADER — Apple Workout style ════════════════════ */
.seh{padding:12px 16px;display:flex;align-items:center;gap:10px;border-bottom:0.5px solid rgba(84,84,88,.6);position:sticky;top:0;background:rgba(0,0,0,0.9);backdrop-filter:blur(40px);-webkit-backdrop-filter:blur(40px);z-index:9}
.set{font-size:17px;font-weight:600;flex:1;line-height:1.2;letter-spacing:-.2px;text-align:center}
.sew{font-size:12px;color:var(--tx3);margin-top:1px;text-align:center}
.bbtn{background:var(--surf2);border:none;color:var(--tx2);border-radius:20px;padding:7px 15px;font-size:14px;cursor:pointer;font-family:inherit;font-weight:500;transition:all .15s}
.fbtn{background:var(--acc);border:none;color:#000;border-radius:20px;padding:7px 16px;font-family:inherit;font-size:14px;font-weight:700;cursor:pointer;letter-spacing:-.1px}
/* ══ MODAL / SUBSTITUTION ═════════════════════════════════════ */
.sub-btn{background:none;border:none;color:var(--tx3);cursor:pointer;padding:2px;transition:color .15s}
.sub-btn:active{color:var(--acc)}
.modal-wrap{position:fixed;inset:0;z-index:300;display:flex;align-items:flex-end}
.modal-bd{position:absolute;inset:0;background:rgba(0,0,0,.6);backdrop-filter:blur(4px)}
.modal-sh{position:relative;background:var(--bg2);border-radius:24px 24px 0 0;width:100%;padding:20px 18px calc(32px + env(safe-area-inset-bottom));z-index:1;max-height:82dvh;overflow-y:auto}
.sopt{display:block;width:100%;text-align:left;padding:14px 0;border:none;background:none;color:var(--tx);font-size:17px;cursor:pointer;border-bottom:1px solid var(--bdr);font-family:inherit;transition:color .12s}
.sopt:last-child{border-bottom:none}
.sopt:active{color:var(--acc)}
.sopt.on{color:var(--acc);font-weight:600}
/* ══ HISTORY ══════════════════════════════════════════════════ */
.hs{padding:14px 18px;border-bottom:1px solid var(--bdr);cursor:pointer;transition:background .12s;display:flex;align-items:center;gap:12px}
.hs:active{background:var(--surf2)}
.hs-dot{width:10px;height:10px;border-radius:50%;flex-shrink:0}
.hs-body{flex:1;min-width:0}
.hd{font-size:12px;color:var(--tx3)}
.hn{font-family:-apple-system,sans-serif;font-size:17px;font-weight:600;letter-spacing:-.2px}
.hst{font-size:13px;color:var(--tx2);margin-top:2px}
.hs-chev{color:var(--tx3);font-size:18px;flex-shrink:0}
/* ══ EMPTY STATE ══════════════════════════════════════════════ */
.empty{text-align:center;padding:64px 28px;color:var(--tx2)}
.empty h3{font-size:22px;margin-bottom:8px;color:var(--tx);font-family:-apple-system,sans-serif;font-weight:600}
/* ══ TOOLS ════════════════════════════════════════════════════ */
.tsec{margin:0 14px 14px}
.tsec h2{font-family:'Barlow Condensed',sans-serif;font-size:22px;font-weight:700;margin-bottom:8px}
/* ══ PLATES ═══════════════════════════════════════════════════ */
.prow{display:flex;flex-wrap:wrap;gap:7px;margin-top:8px;align-items:center}
.pl{width:38px;height:38px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;flex-shrink:0}
.p20{background:#b91c1c;color:#fff}
.p15{background:#1d4ed8;color:#fff}
.p10{background:#047857;color:#fff}
.p5{background:#92400e;color:#fff}
.p25{background:var(--surf2);border:2px solid var(--bdr-s);color:var(--tx);font-size:10px}
.p125{width:30px;height:30px;background:var(--surf);border:1px solid var(--bdr);color:var(--tx3);font-size:9px}
/* ══ VOL CHART ════════════════════════════════════════════════ */
.vrow{display:flex;align-items:center;gap:9px;margin-bottom:6px}
.vn{font-size:12px;width:90px;flex-shrink:0;color:var(--tx2)}
.vbw{flex:1;background:var(--surf2);border-radius:4px;height:8px;overflow:hidden}
.vb{height:100%;background:var(--acc);border-radius:4px;transition:width .4s cubic-bezier(.4,0,.2,1)}
.vnum{font-size:12px;color:var(--tx);font-variant-numeric:tabular-nums;width:22px;text-align:right;flex-shrink:0}
/* ══ GUIDE ════════════════════════════════════════════════════ */
.tc{padding:12px 16px;border-bottom:1px solid var(--bdr)}
.tterm{font-family:'Barlow Condensed',sans-serif;font-size:20px;font-weight:700}
.tfull{font-size:11px;color:var(--tx3);margin-left:6px}
.tdef{font-size:13px;color:var(--tx2);margin-top:4px;line-height:1.55}
.fq{padding:13px 16px;border-bottom:1px solid var(--bdr)}
.fqq{font-weight:600;font-size:14px;margin-bottom:4px}
.fqa{font-size:13px;color:var(--tx2);line-height:1.55}
/* ══ FORM ═════════════════════════════════════════════════════ */
.inp{background:var(--surf2);border:none;color:var(--tx);border-radius:10px;padding:10px 14px;font-size:15px;font-family:inherit;transition:background .15s}
.inp:focus{outline:none;background:var(--surf3)}
.btn{padding:10px 18px;border-radius:12px;border:none;font-family:inherit;font-size:14px;font-weight:600;cursor:pointer;transition:opacity .15s}
.btnp{background:var(--acc);color:#000}
.btns{background:var(--surf2);color:var(--tx)}
.btn:active{opacity:.7}
/* ══ PROGRESS ═════════════════════════════════════════════════ */
.pbar{height:3px;background:rgba(84,84,88,.5);overflow:hidden}
.pbf{height:100%;background:var(--acc);transition:width .35s cubic-bezier(.4,0,.2,1)}
.bon{font-size:11px;color:var(--yel);padding:4px 14px 5px;background:rgba(245,158,11,.07);border-bottom:1px solid var(--bdr)}
/* ══ SECTION LABEL — Apple iOS section header ════════════════ */
.slbl{font-size:22px;font-weight:700;letter-spacing:-.2px;color:var(--tx);padding:22px 18px 8px;line-height:1.1}
/* ══ PLAN SCREEN — Apple card style ══════════════════════════ */
.nxt{margin:12px 16px;border-radius:20px;background:var(--surf);overflow:hidden;position:relative}
.nxt::before{content:'';position:absolute;top:0;left:0;right:0;height:3px;background:var(--acc)}
.nxt-top{padding:18px 16px 12px;display:flex;align-items:center;gap:14px}
.nxt-dot{width:50px;height:50px;border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:700;color:#fff;flex-shrink:0;line-height:1}
.nxt-lbl{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--tx3);font-weight:600}

// ─── STATE ──────────────────────────────────────────────────
let SCR = 'today';
let SESS = null;   // active session
let CFG  = {week:1, repFloor4:false, nickname:''};
let SUBS = {};     // "dayId_exIdx" -> name
let CUSTOM_SUBS = {}; // "dayId_exIdx" -> [name, ...]  user-added substitutes
let TIMER = {on:false, rem:0, total:0, lbl:'', tid:null, endAt:0};
let HOLDS = {};    // "exIdx_si" -> {rem, done, tid}
let CALM  = null;  // calendar month state for plan screen

// ─── STORAGE ────────────────────────────────────────────────
function loadStorage(){
  try{CFG={...CFG,...JSON.parse(localStorage.getItem('ppl_cfg')||'{}')};}catch(e){}
  try{SUBS=JSON.parse(localStorage.getItem('ppl_subs')||'{}');}catch(e){}
  try{CUSTOM_SUBS=JSON.parse(localStorage.getItem('ppl_custom')||'{}');}catch(e){}
  try{const s=localStorage.getItem('ppl_sess');if(s)SESS=JSON.parse(s);}catch(e){}
}
function saveCfg(){localStorage.setItem('ppl_cfg',JSON.stringify(CFG));}
function saveSubs(){localStorage.setItem('ppl_subs',JSON.stringify(SUBS));}
function saveCustomSubs(){localStorage.setItem('ppl_custom',JSON.stringify(CUSTOM_SUBS));}
function saveSess(){
  if(SESS)localStorage.setItem('ppl_sess',JSON.stringify(SESS));
  else localStorage.removeItem('ppl_sess');
}
function allSessions(){try{return JSON.parse(localStorage.getItem('ppl_hist')||'[]');}catch(e){return[];}}
function pushToHistory(s){
  const hs=allSessions();
  const i=hs.findIndex(h=>h.date===s.date&&h.dayId===s.dayId);
  if(i>=0)hs[i]=s;else hs.unshift(s);
  localStorage.setItem('ppl_hist',JSON.stringify(hs));
}
function lastSession(dayId){return allSessions().find(s=>s.dayId===dayId&&s.completed);}

// ─── HELPERS ────────────────────────────────────────────────
function effEx(dayId,idx,week){
  const base=P.days[dayId].ex[idx];
  const ov=(P.weeks[String(week)]||{})[dayId]?.[String(idx)]||{};
  return{...base,...ov};
}
function subName(dayId,idx){
  const k=dayId+'_'+idx, ex=P.days[dayId].ex[idx];
  return SUBS[k]&&SUBS[k]!==ex.n?SUBS[k]:ex.n;
}
function subVideo(dayId,idx){
  const k=dayId+'_'+idx, ex=P.days[dayId].ex[idx];
  if(!SUBS[k]||SUBS[k]===ex.n)return ex.video;
  const si=ex.sub.indexOf(SUBS[k]);
  return si>=0&&ex.subVideo?.[si]?ex.subVideo[si]:ex.video;
}
function repDisplay(ex,si){
  if(ex.type==='perset'&&ex.perSetReps)return String(ex.perSetReps[Math.min(si,ex.perSetReps.length-1)]);
  if(ex.type==='amrap')return'AMRAP';
  if(ex.type==='hold')return'30s';
  let r=String(ex.reps||'');
  if(CFG.repFloor4){
    if(/^\d+$/.test(r)&&parseInt(r)<4)r='4';
    const m=r.match(/^(\d+)-(\d+)$/);
    if(m&&parseInt(m[1])<4)r=`4-${Math.max(4,parseInt(m[2]))}`;
  }
  return r;
}
function muscName(k){return P.muscleLabels[k]||k;}
function fmtTime(s){return`${Math.floor(s/60)}:${String(s%60).padStart(2,'0')}`;}
function dkey(y,m,d){return`${y}-${String(m+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;}
function todayStr(){const d=new Date();return dkey(d.getFullYear(),d.getMonth(),d.getDate());}
function daysBetween(a,b){return Math.round((new Date(b+'T12:00:00')-new Date(a+'T12:00:00'))/86400000);}
function fmtDate(d){if(!d)return'';return new Date(d+'T12:00:00').toLocaleDateString('th-TH',{day:'numeric',month:'short',year:'numeric'});}
function progression(lastSets,ex){
  if(!lastSets||!lastSets.length)return null;
  const last=lastSets[lastSets.length-1];
  if(!last||!last.weight||last.weight<=0)return null;
  const r=String(ex.reps||'');
  const m=r.match(/^(\d+)-(\d+)$/);
  if(m&&last.reps>=parseInt(m[2]))return last.weight+2.5;
  if(/^\d+$/.test(r)&&last.reps>=parseInt(r))return last.weight+2.5;
  return null;
}

// ─── REST MIN ────────────────────────────────────────────────
function minRest(sec){
  if(sec>=210)return 120; // compounds 3-3.5min → 2min
  if(sec>=150)return 90;  // moderate → 1.5min
  if(sec>=90) return 60;  // isolation → 1min
  return sec;
}
// ─── AUDIO / HAPTIC ─────────────────────────────────────────
let AC=null;
function beep(f,d,v){
  try{
    if(!AC)AC=new(window.AudioContext||window.webkitAudioContext)();
    const o=AC.createOscillator(),g=AC.createGain();
    o.connect(g);g.connect(AC.destination);
    o.frequency.value=f||880;o.type='sine';
    g.gain.setValueAtTime(v||0.25,AC.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001,AC.currentTime+(d||0.2));
    o.start(AC.currentTime);o.stop(AC.currentTime+(d||0.2));
  }catch(e){}
}
function vibrate(p){try{navigator.vibrate?.(p);}catch(e){}}

// ─── REST TIMER ──────────────────────────────────────────────
function startRest(sec,lbl){
  if(sec<=0)return;
  stopTimer();
  const endAt=Date.now()+sec*1000;
  TIMER={on:true,rem:sec,total:sec,lbl:lbl||'',tid:null,endAt};
  TIMER.tid=setInterval(()=>{
    const rem=Math.max(0,Math.round((TIMER.endAt-Date.now())/1000));
    if(rem!==TIMER.rem){
      TIMER.rem=rem;
      if(rem<=0){
        stopTimer();
        beep(880,.1);setTimeout(()=>beep(880,.1),200);setTimeout(()=>beep(1100,.4),420);
        vibrate([200,100,200]);
        return;
      }else if(rem<=3)beep(660,.08,.1);
    }
    renderTimer();
  },250);
  renderTimer();
}
function stopTimer(){
  if(TIMER.tid)clearInterval(TIMER.tid);
  TIMER={on:false,rem:0,total:0,lbl:'',tid:null,endAt:0};
  renderTimer();
}
// ─── BACKGROUND TIMER SYNC ───────────────────────────────────
document.addEventListener('visibilitychange',()=>{
  if(!document.hidden&&TIMER.on){
    TIMER.rem=Math.max(0,Math.round((TIMER.endAt-Date.now())/1000));
    if(TIMER.rem<=0){
      stopTimer();
      beep(880,.1);setTimeout(()=>beep(880,.1),200);setTimeout(()=>beep(1100,.4),420);
      vibrate([200,100,200]);
    }else renderTimer();
  }
});
function renderTimer(){
  const el=document.getElementById('tov');
  if(!TIMER.on){el.style.display='none';return;}
  el.style.display='flex';
  const pct=TIMER.rem/TIMER.total;
  const c=pct>.5?'#C6FF00':pct>.25?'#FFD60A':'#FF375F';
  const circ=301.6,offset=circ*(1-pct);
  const fg=el.querySelector('.tring-fg');
  if(fg){fg.style.strokeDashoffset=offset;fg.style.stroke=c;const t=el.querySelector('.ttim');if(t){t.textContent=fmtTime(TIMER.rem);t.style.color=c;}return;}
  el.innerHTML=`<div class="tring-wrap"><svg class="tring-svg" viewBox="0 0 110 110"><circle cx="55" cy="55" r="48" class="tring-bg"/><circle cx="55" cy="55" r="48" class="tring-fg" style="stroke:${c};stroke-dashoffset:${offset}"/></svg><div class="tring-center"><div class="ttim" style="color:${c}">${fmtTime(TIMER.rem)}</div><div class="tlbl">${TIMER.lbl||'พัก'}</div></div></div><button class="tskp" onclick="stopTimer()">ข้ามพัก</button>`;
}
// ─── WARMUP INIT ─────────────────────────────────────────────
function initWarmupSets(ex,workingW){
  const wuStr=String(ex.wu||'0');
  if(wuStr==='0')return[];
  const n=parseInt(wuStr.split('-')[0]);
  if(!n||isNaN(n))return[];
  const rule=P.warmupCalc.rules.find(r=>r.warmupSets===n)||P.warmupCalc.rules.find(r=>r.warmupSets===Math.max(1,Math.min(n,4)));
  if(!rule)return[];
  return rule.steps.map((step,i)=>({weight:workingW>0?Math.round(workingW*step.pct/100/2.5)*2.5:0,reps:null,done:false,isWarmup:true,pct:step.pct,repsHint:step.reps,label:'W'+(i+1)}));
}
// ─── CONFETTI ────────────────────────────────────────────────
function launchConfetti(){
  const canvas=document.getElementById('confetti-canvas');if(!canvas)return;
  canvas.style.display='block';canvas.width=innerWidth;canvas.height=innerHeight;
  const ctx=canvas.getContext('2d');
  const ps=Array.from({length:90},()=>({x:Math.random()*canvas.width,y:-10-Math.random()*80,vx:(Math.random()-.5)*4,vy:Math.random()*4+2,r:Math.random()*6+3,color:['#C6FF00','#00C7FF','#FA114F','#BF5AF2','#FFD60A','#30D158','#fff'][Math.floor(Math.random()*7)],rot:Math.random()*360,rv:(Math.random()-.5)*8,life:1}));
  let fr;const draw=()=>{ctx.clearRect(0,0,canvas.width,canvas.height);let alive=false;ps.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.vy+=.08;p.rot+=p.rv;p.life-=.006;if(p.life<=0||p.y>canvas.height)return;alive=true;ctx.save();ctx.globalAlpha=Math.max(0,p.life);ctx.translate(p.x,p.y);ctx.rotate(p.rot*Math.PI/180);ctx.fillStyle=p.color;ctx.fillRect(-p.r,-p.r/2,p.r*2,p.r);ctx.restore();});if(alive)fr=requestAnimationFrame(draw);else{canvas.style.display='none';}};cancelAnimationFrame(fr);draw();
}

// ─── HOLD TIMER ──────────────────────────────────────────────
function startHold(ei,si){
  const k=ei+'_'+si;
  if(HOLDS[k]?.running)return;
  HOLDS[k]={rem:30,running:true,done:false};
  const tick=()=>{
    if(!HOLDS[k]||!HOLDS[k].running)return;
    HOLDS[k].rem--;
    const el=document.getElementById('hld_'+k);
    if(HOLDS[k].rem<=0){
      HOLDS[k]={rem:0,running:false,done:true};
      beep(880,.2);vibrate([150,100,150]);
      if(el)el.innerHTML='<span style="color:var(--grn);font-weight:600">✓ เสร็จ</span>';
    }else{
      if(el)el.innerHTML=`<span class="htick">${HOLDS[k].rem}s</span>`;
      setTimeout(tick,1000);
    }
  };
  setTimeout(tick,1000);
  const el=document.getElementById('hld_'+k);
  if(el)el.innerHTML=`<span class="htick">30s</span>`;
}

// ─── SESSION ─────────────────────────────────────────────────
function startSession(dayId){
  const day=P.days[dayId];
  const last=lastSession(dayId);
  let topSetWeights=[];
  const exercises=day.ex.map((baseEx,idx)=>{
    const ex=effEx(dayId,idx,CFG.week);
    const lastEx=last?.exercises?.[idx];
    const lastSets=lastEx?.sets||[];
    const lastW=lastSets[0]?.weight||0;
    let sugW=lastW;
    const prog=progression(lastSets,ex);
    if(prog!==null)sugW=prog;
    // back-off: use % of previous exercise's top set weight
    if(ex.backoffPct&&topSetWeights.length>0){
      const top=topSetWeights[topSetWeights.length-1];
      if(top>0){const calc=Math.round(top*ex.backoffPct/100/2.5)*2.5;sugW=calc;}
    }
    const sets=[];
    for(let i=0;i<ex.ws;i++)sets.push({weight:sugW,reps:null,done:false});
    if(ex.type==='dropset'){
      const dw=sugW>0?Math.round(sugW*(1-(ex.dropPct||40)/100)/2.5)*2.5:0;
      sets[0].dropWeight=dw;sets[0].dropReps=null;
    }
    topSetWeights.push(sugW);
    return{
      baseIdx:idx,
      name:subName(dayId,idx),
      suggested:(prog!==null&&lastW>0&&prog!==lastW)?prog:null,
      sets,
      warmupSets:initWarmupSets(ex,sugW)
    };
  });
  SESS={date:todayStr(),dayId,week:CFG.week,exercises,completed:false,startTime:Date.now()};
  HOLDS={};
  saveSess();render();
}
function isLastWorkingSet(ei,si){
  if(!SESS)return false;
  for(let e=ei;e<SESS.exercises.length;e++){
    const ex2=SESS.exercises[e];
    for(let s=(e===ei?si+1:0);s<ex2.sets.length;s++){
      if(!ex2.sets[s].done)return false;
    }
  }
  return true;
}

        <div style="display:inline-flex;align-items:center;gap:5px;background:rgba(255,255,255,.08);border-radius:10px;padding:4px 10px;font-size:11px;font-weight:600;color:${isRest||isWaiting?'rgba(255,255,255,.6)':'var(--tx3)'}">
          <div style="width:8px;height:8px;border-radius:50%;background:${col}"></div>
          สัปดาห์ ${nx.week} · ${weekDone}/${weekTotal} วัน
        </div>
        ${isLate?`<div style="background:rgba(255,214,10,.12);border-radius:10px;padding:4px 10px;font-size:11px;font-weight:700;color:var(--yel)">${nx.since} วันไม่ได้ซ้อม</div>`:''}
      </div>
      <div class="hero-actions">${heroActions}</div>
    </div>
  </div>`;

  // ── Cycle row ────────────────────────────────────────────────
  const curIdx=(()=>{if(!nx.last)return 0;const li=CYCLE.findIndex(c=>c.d===nx.last.dayId);if(nx.ready)return CYCLE.findIndex(c=>c.d===nx.dayId);return Math.min(li+nx.since,CYCLE.length-1);})();
  const cycHtml=CYCLE.map((c,i)=>{
    const isNow=i===curIdx;
    if(c.r)return`<div class="cyc2-item rest-item${isNow?' now':''}"><div class="cyc2-dot" style="background:var(--bdr)"></div><div class="cyc2-lbl">Rest</div>${isNow?'<div class="cyc2-pip"></div>':''}</div>`;
    return`<div class="cyc2-item${isNow?' now':''}"><div class="cyc2-dot" style="background:${DAYC[c.d]}"></div><div class="cyc2-lbl">${DAYS_SHORT[c.d]}</div>${isNow?'<div class="cyc2-pip"></div>':''}</div>`;
  }).join('');

  // ── Stats ────────────────────────────────────────────────────
  const pct=Math.round(doneCount/24*100);
  const statsHtml=`<div class="sbar">
    <div class="sbar-item">
      <div class="sbar-n" style="color:var(--acc)">${doneCount}<span style="font-size:14px;color:var(--tx3);font-weight:600">/24</span></div>
      <div class="sbar-l">ซ้อมแล้ว</div>
      <div class="sbar-bar"><div class="sbar-fill" style="width:${pct}%;background:var(--acc)"></div></div>
    </div>
    <div class="sbar-item">
      <div class="sbar-n">${pct}%</div>
      <div class="sbar-l">Phase 1</div>
      <div class="sbar-bar"><div class="sbar-fill" style="width:${pct}%;background:var(--tx2)"></div></div>
    </div>
    <div class="sbar-item">
      <div class="sbar-n" style="color:${streak>2?'var(--grn)':streak>0?'var(--tx)':'var(--tx3)'}">${streak}</div>
      <div class="sbar-l">ต่อเนื่อง</div>
      <div class="sbar-bar"><div class="sbar-fill" style="width:${Math.min(streak/7*100,100)}%;background:var(--grn)"></div></div>
    </div>
  </div>`;

  // ── Day chips ────────────────────────────────────────────────
  const chipsHtml=P.schedule.order.map(id=>{
    const ls=lastSession(id);
    const lastTxt=ls?fmtDate(ls.date):'';
    return`<button class="dchip" onclick="startSession('${id}')">
      <div class="dc-dot" style="background:${DAYC[id]}"></div>
      ${P.days[id].name}
      ${lastTxt?`<span class="dc-last">${lastTxt}</span>`:''}
    </button>`;
  }).join('');

  // ── Progress grid ────────────────────────────────────────────
  const order=P.schedule.order;
  const doneMap={};hist.forEach(s=>{doneMap[(s.week||1)+'_'+s.dayId]=s;});
  let pgHtml=`<div class="pg2-h"></div>`+order.map(id=>`<div class="pg2-h" style="color:${DAYC[id]}">${DAYS_SHORT[id]}</div>`).join('');
  for(let w=1;w<=6;w++){
    pgHtml+=`<div class="pg2-w">W${w}</div>`;
    order.forEach(id=>{
      const s=doneMap[w+'_'+id];
      const cur=(w===nx.week&&id===nx.dayId&&nx.ready)?' cur':'';
      pgHtml+=s
        ?`<div class="pg2-c on${cur}" style="background:${DAYC[id]}" onclick="showSessDetail('${s.date}','${id}')">✓</div>`
        :`<div class="pg2-c${cur}" onclick="planStart('${id}',${w})">${w===6?'☾':'·'}</div>`;
    });
  }

  return`<div class="home-wrap">
    <div class="home-top">
      <div>
        <div class="home-greet">${nick?greetWord+', '+nick+'!':greetWord}</div>
        <div class="home-date">${todayLabel}</div>
      </div>
      ${streak>0?`<div class="home-streak"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="var(--acc)" stroke-width="2.5" stroke-linecap="round"><path d="M13 2L3 14h9l-1 8 10-12h-9l1-8z"/></svg>${streak}</div>`:''}
    </div>
    ${heroCard}
    <div class="hslbl">เลือกวันซ้อม</div>
    <div class="dchips">${chipsHtml}</div>
    <div class="hslbl">ความคืบหน้า</div>
    ${statsHtml}
    <div class="hslbl" style="padding-bottom:10px">รอบซ้อม</div>
    <div class="cyc2">${cycHtml}</div>
    <div style="padding:2px 16px 0;font-size:10px;color:var(--tx3);line-height:1.6">${P.schedule.restRule_th}</div>
    <div class="hslbl">ตาราง</div>
    <div class="pg2">${pgHtml}</div>
    <div style="padding:6px 16px 0;font-size:10px;color:var(--tx3)">กดช่องว่างเพื่อซ้อมวันนั้น · ☾ = Deload</div>
    <div style="height:24px"></div>
  </div>`;
}
function setWeek(w){CFG.week=w;saveCfg();render();}

// ─── TODAY: WORKOUT ──────────────────────────────────────────

  const s=SESS;
  const day=P.days[s.dayId];

  const pct=total?Math.round(done/total*100):0;
  const totalEx=s.exercises.length;
  const doneExFull=s.exercises.filter(e=>e.sets.length>0&&e.sets.every(x=>x.done)).length;
  const curExNum=Math.min(doneExFull+1,totalEx);
  const isLeg=s.dayId==='legs'||s.dayId==='full';
  const wuItems=P.generalWarmup.items.filter(i=>!i.legDayOnly||isLeg)
    .map(i=>{const vid=WU_VIDEOS[i.name];const vl=vid?` · <button class="wu-video-link" onclick="showVideo('${vid}','${i.name}','${i.th||''}')">▶ ดูวิดีโอ</button>`:'';return`<div class="wu-item"><span class="wu-dot">•</span><div><div class="wu-name">${i.name}${i.optional?' <span style="font-size:10px;color:var(--tx3)">(ทางเลือก)</span>':''}</div><div class="wu-meta">${i.repsTime}${vl}</div></div></div>`;}).join('');
  const deload=P.weeks[String(s.week)]?.deload;
  const cards=s.exercises.map((_,i)=>buildCard(i)).join('');

    <button class="bbtn" onclick="confirmCancel()">✕</button>
    <div style="flex:1;text-align:center"><div class="set">${day.name}</div><div class="sew">W${s.week} · ${day.th}</div>${nickLine}</div>
    <button class="fbtn" onclick="finishSession()">Finish</button>
  </div>
  <div class="pbar"><div class="pbf" style="width:${pct}%"></div></div>
  <div class="prog-row">
    <span class="prog-sets">${done}/${total} sets</span>
    <span class="prog-pct">${pct}%</span>
    <span class="prog-ex" style="font-size:12px;color:var(--tx3)">${curExNum}/${totalEx} exercises</span>
    <span class="prog-vol" id="sess-vol">— kg</span>
  </div>
  ${deload?`<div class="dlnote" style="margin-top:0">! Deload — ลดน้ำหนัก ห้ามดันถึงหมดแรง</div>`:''}
  <details style="margin:4px 12px 4px;background:var(--surf);border:1px solid var(--bdr);border-radius:var(--r)">
    <summary style="padding:8px 12px;font-size:12px;color:var(--tx2);cursor:pointer;list-style:none;user-select:none">▸ วอร์มอัพทั่วไป & เครื่องมือ</summary>
    <div style="padding:6px 12px 10px">${wuItems}</div>
    <div style="border-top:1px solid var(--bdr);padding:8px 12px 10px">
      <div style="font-size:11px;color:var(--tx3);font-weight:700;text-transform:uppercase;letter-spacing:.06em;margin-bottom:6px">เครื่องคิดวอร์ม</div>
      <div style="display:flex;gap:6px;flex-wrap:wrap;align-items:center">
        <input class="inp" type="number" id="wu-quick-w" placeholder="น้ำหนักจริง (kg)" style="width:160px;font-size:14px" inputmode="decimal" oninput="calcWarmupQuick()">
        <select class="inp" id="wu-quick-n" style="width:110px;font-size:13px" onchange="calcWarmupQuick()">
          <option value="1">1 เซ็ต</option>
          <option value="2">2 เซ็ต</option>
          <option value="3" selected>3 เซ็ต</option>
          <option value="4">4 เซ็ต</option>
        </select>
      </div>
      <div id="wu-quick-res" style="margin-top:6px"></div>
    </div>
    <div style="border-top:1px solid var(--bdr);padding:8px 12px 10px">
      <div style="font-size:11px;color:var(--tx3);font-weight:700;text-transform:uppercase;letter-spacing:.06em;margin-bottom:6px">เครื่องคิดแผ่น (บาร์ 20kg)</div>
      <input class="inp" type="number" id="wu-plate-w" placeholder="น้ำหนักเป้า (kg)" style="width:180px;font-size:14px" inputmode="decimal" oninput="calcPlatesQuick()">
      <div id="wu-plate-res" class="prow" style="min-height:32px;margin-top:6px"></div>
    </div>
  </details>
  ${cards}
  <div style="padding:16px 16px 6px">
    <button class="btn btnp" style="width:100%;font-size:17px;font-weight:700;padding:16px;border-radius:14px;letter-spacing:-.1px" onclick="finishSession()">Finish Workout</button>
  </div>`;
}

function buildCard(ei){
  const s=SESS;
  const el=s.exercises[ei];
  const ex=effEx(s.dayId,el.baseIdx,s.week);
  const vid=subVideo(s.dayId,el.baseIdx);
  const badgeMap={normal:['bn','Normal'],feeder:['bf','Feeder'],dropset:['bd','Drop 10+5'],mechdrop:['bm','Mech Drop 8+8'],hold:['bh','Hold 30s'],amrap:['ba','AMRAP'],perset:['bp','Per-set']};
  const [bc,bl]=badgeMap[ex.type]||['bn',ex.type];
  const isSSfirst=ex.superset&&!el.name.includes('A2')&&el.name.includes('A1');
  const isSSsecond=ex.superset&&el.name.includes('A2');
  const cls='exc'+(isSSfirst?' ss1':isSSsecond?' ss2':'');
  const boHtml=ex.backoffPct?`<div class="bon">↓ Back-off: ${ex.backoffPct}% ของ top set (${ex.th})</div>`:'';
  const mdHtml=ex.type==='mechdrop'?`<div style="font-size:11px;color:var(--blu);padding:3px 12px 4px;border-bottom:1px solid var(--bdr)">${ex.th}</div>`:'';
  const sugHtml=el.suggested?`<div class="sug">↑ เพิ่มเป็น ${el.suggested}kg จากสัปดาห์ก่อน</div>`:'';
  const subBtn=ex.sub.length>0?`<button class="sub-btn" title="เปลี่ยนท่า" onclick="openSub(${ei})"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 1l4 4-4 4"/><path d="M3 11V9a4 4 0 0 1 4-4h14"/><path d="M7 23l-4-4 4-4"/><path d="M21 13v2a4 4 0 0 1-4 4H3"/></svg></button>`:'' ;
  const ssBadge=ex.superset?`<span class="bdg bs">${ex.superset}</span>`:'';

  // PR detection
  const lastSess=lastSession(SESS.dayId);
  const lastEx=lastSess?.exercises?.find(e=>e.baseIdx===el.baseIdx||e.name===el.name);
  const lastTopW=lastEx?.sets?.filter(s=>s.done).reduce((m,s)=>Math.max(m,s.weight||0),0)||0;

  // Warmup rows
  let wuRowsHtml='';
  if(el.warmupSets&&el.warmupSets.length){
    const wuRows=el.warmupSets.map((ws,wsi)=>`<tr class="wuset${ws.done?' wudone':''}" id="wurow_${ei}_${wsi}">
      <td class="wusn">${ws.label}</td>
      <td><div class="wc"><button class="ab" onclick="adjWuW(${ei},${wsi},-2.5)">−</button><input class="wi" type="number" id="wuw_${ei}_${wsi}" value="${ws.weight||0}" step="2.5" min="0" inputmode="decimal" oninput="setWuWeight(${ei},${wsi},this.value)" style="font-size:13px"><button class="ab" onclick="adjWuW(${ei},${wsi},2.5)">+</button></div></td>
      <td><span style="font-size:12px;color:var(--tx3)">${ws.repsHint||'—'}</span><div style="font-size:10px;color:var(--tx3);margin-top:1px">${ws.pct}%</div></td>
      <td class="sd"><button class="db${ws.done?' done':''}" onclick="markWuDone(${ei},${wsi})"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg></button></td>
    </tr>`).join('');
    wuRowsHtml=`<tr class="wu-sep"><td colspan="4">วอร์มอัพ ${el.warmupSets.length} เซ็ต</td></tr>${wuRows}<tr class="wu-sep"><td colspan="4">เซ็ตจริง</td></tr>`;
  }

  let tableHtml='';
  if(ex.type==='hold'){
    const rows=el.sets.map((set,si)=>{
      const k=ei+'_'+si, hd=HOLDS[k];
      let hcon=hd?.done?'<span style="color:var(--grn);font-weight:600">✓ เสร็จ</span>':hd?.running?`<span class="htick">${hd.rem}s</span>`:`<button class="hbtn" onclick="startHold(${ei},${si})">▶ 30s</button>`;
      return`<tr class="${set.done?'dc':''}"><td class="sn">${si+1}</td><td colspan="2" id="hld_${k}" style="padding:7px 12px">${hcon}</td><td class="sd">${doneBtn(ei,si,set.done)}</td></tr>`;
    }).join('');
    tableHtml=`<table class="st"><thead><tr><th>#</th><th colspan="2">เป้าหมาย</th><th></th></tr></thead><tbody>${wuRowsHtml}${rows}</tbody></table>`;
  } else if(ex.type==='dropset'){
    const set=el.sets[0],rt=repDisplay(ex,0),dw=set.dropWeight??0,isPR=lastTopW>0&&set.weight>lastTopW&&set.done;
    tableHtml=`<table class="st"><thead><tr><th>#</th><th>น้ำหนัก (kg)</th><th>ครั้ง</th><th></th></tr></thead><tbody>${wuRowsHtml}
      <tr class="${set.done?'dc':''}" id="srow_${ei}_0"><td class="sn">1${isPR?'<span class="pr-badge" style="display:block;margin-top:1px">PR</span>':''}</td><td>${weightCell(ei,0,set.weight,false)}</td><td><input class="ri" type="number" value="${set.reps??''}" placeholder="${rt}" min="0" inputmode="numeric" oninput="setReps(${ei},0,this.value)"><div class="rt">เป้า ${rt}</div></td><td class="sd">${doneBtn(ei,0,set.done)}</td></tr>
      <tr style="background:rgba(248,81,73,.05)"><td class="sn" style="color:var(--red)">↓</td><td>${weightCell(ei,0,dw,true)}</td><td><input class="ri" type="number" value="${set.dropReps??''}" placeholder="+5" min="0" inputmode="numeric" oninput="SESS.exercises[${ei}].sets[0].dropReps=parseInt(this.value)||0;saveSess()"><div class="rt">Drop +5</div></td><td></td></tr>
    </tbody></table>`;
  } else {
    const rows=el.sets.map((set,si)=>{
      const rt=repDisplay(ex,si);
      const frpe=ex.type==='feeder'&&ex.feederRPE?`<span class="frpe">RPE ${ex.feederRPE[si]}</span>`:`<span style="font-size:10px;color:var(--tx3)">RPE ${ex.rpe}</span>`;
      const isPR=lastTopW>0&&set.weight>lastTopW&&set.done;
      return`<tr class="${set.done?'dc':''}" id="srow_${ei}_${si}"><td class="sn">${si+1}${isPR?'<span class="pr-badge" style="display:block;margin-top:1px">PR</span>':''}</td><td>${weightCell(ei,si,set.weight,false)}</td><td><input class="ri" type="number" value="${set.reps??''}" placeholder="${rt}" min="0" inputmode="numeric" oninput="setReps(${ei},${si},this.value)"><div class="rt">เป้า ${rt}</div>${frpe}</td><td class="sd">${doneBtn(ei,si,set.done)}</td></tr>`;
    }).join('');
    tableHtml=`<table class="st"><thead><tr><th>#</th><th>น้ำหนัก (kg)</th><th>ครั้ง / RPE</th><th></th></tr></thead><tbody>${wuRowsHtml}${rows}</tbody></table>`;
  }

  // Last session hint
  const lastEx2=lastSess?.exercises?.find(e=>e.baseIdx===el.baseIdx||e.name===el.name);
  const lastDoneSets=lastEx2?.sets?.filter(s=>s.done&&s.weight>0&&s.reps>0)||[];
  let lastHintHtml='';
  if(lastDoneSets.length){
    const topSet=lastDoneSets.reduce((a,b)=>(b.weight*b.reps>a.weight*a.reps?b:a),lastDoneSets[0]);
    const wds=lastDoneSets.map(s=>`${s.weight}×${s.reps}`).join(', ');
    lastHintHtml=`<div class="last-hint">รอบที่แล้ว: <strong>${wds}</strong></div>`;
  }

  const minSets=1;
  const setActionsHtml=`<div class="set-actions"><button class="set-rm-btn" onclick="removeSet(${ei})" title="ลบเซ็ตสุดท้าย">− เซ็ต</button><button class="set-add-btn" onclick="addSet(${ei})">+ เพิ่มเซ็ต</button></div>`;

  // Muscle chips — use detailed data if available
  const uniFlag=isUni(el.name);
  const uniSvg=`<svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M7 16V4m0 0L3 8m4-4l4 4"/><path d="M17 8v12m0 0l4-4m-4 4l-4-4"/></svg>`;
  const det=EX_MUSCLE_DETAIL[el.name];
  let mchipsHtml='';
  if(det){
    const secChips=det.sec.map(s=>`<span class="mchip sec">${s}</span>`).join('');
    const uniC=uniFlag?`<span class="mchip uni">${uniSvg} ทีละข้าง</span>`:'';
    mchipsHtml=`<div class="mchips"><span class="mchip pri">${det.pri}</span>${secChips}${uniC}</div>`;
  } else {
    const mArr=ex.m||[];
    const muscChips=mArr.map((k,i)=>`<span class="mchip ${i===0?'pri':'sec'}">${muscName(k)}</span>`).join('');
    const uniC=uniFlag?`<span class="mchip uni">${uniSvg} ทีละข้าง</span>`:'';
    if(mArr.length||uniFlag)mchipsHtml=`<div class="mchips">${muscChips}${uniC}</div>`;
  }
  const badgeRow=(bc!=='bn'||ex.superset)?`<div style="display:flex;gap:5px;flex-wrap:wrap;margin-bottom:5px">${ssBadge}${bc!=='bn'?`<span class="bdg ${bc}">${bl}</span>`:''}</div>`:'';
  return`<div class="${cls}" id="exc_${ei}">
    <div class="exh">
      <div class="exn">
        ${badgeRow}
        <button class="exnm" style="background:none;border:none;padding:0;text-align:left;width:100%;cursor:${vid?'pointer':'default'}" onclick="${vid?`showVideo('${vid.replace(/'/g,"\\'")}','${el.name.replace(/'/g,"\\'")}','${(ex.th||'').replace(/'/g,"\\'")}')`:'void(0)'}"><span style="display:flex;align-items:center;gap:8px">${el.name}${vid?`<span style="font-size:11px;font-weight:600;color:#000;background:var(--acc);border-radius:6px;padding:2px 8px;flex-shrink:0;letter-spacing:-.1px">▶</span>`:''}</span></button>
        <div class="exmeta">${ex.th||''}</div>
      </div>
      <div style="display:flex;gap:6px;align-items:center;flex-shrink:0">${subBtn}</div>
    </div>
    ${mchipsHtml}${lastHintHtml}${boHtml}${mdHtml}${sugHtml}${tableHtml}${ex.type!=='hold'?setActionsHtml:''}
  </div>`;
}

function weightCell(ei,si,val,isDrop){
  const id=(isDrop?'dw':'w')+'_'+ei+'_'+si;
  const oc=isDrop?`SESS.exercises[${ei}].sets[${si}].dropWeight=Math.max(0,parseFloat(this.value)||0);saveSess()`:`setWeight(${ei},${si},this.value)`;
  return`<div class="wc"><button class="ab" onclick="adjW(${ei},${si},-2.5,${isDrop})">−</button><input class="wi" type="number" id="${id}" value="${val||0}" step="2.5" min="0" inputmode="decimal" oninput="${oc}"><button class="ab" onclick="adjW(${ei},${si},2.5,${isDrop})">+</button></div>`;
}
function doneBtn(ei,si,done){
  return`<button class="db${done?' done':''}" onclick="markDone(${ei},${si})"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg></button>`;
}

// ─── SET ACTIONS ─────────────────────────────────────────────
function setWuWeight(ei,wsi,v){if(!SESS||!SESS.exercises[ei].warmupSets)return;SESS.exercises[ei].warmupSets[wsi].weight=Math.max(0,parseFloat(v)||0);saveSess();}
function adjWuW(ei,wsi,d){if(!SESS||!SESS.exercises[ei].warmupSets)return;const ws=SESS.exercises[ei].warmupSets[wsi];ws.weight=Math.max(0,Math.round(((ws.weight||0)+d)/2.5)*2.5);const el=document.getElementById('wuw_'+ei+'_'+wsi);if(el)el.value=ws.weight;saveSess();}
function markWuDone(ei,wsi){if(!SESS||!SESS.exercises[ei].warmupSets)return;const ws=SESS.exercises[ei].warmupSets[wsi];ws.done=!ws.done;saveSess();vibrate(ws.done?[30]:[15]);const card=document.getElementById('exc_'+ei);if(card){const n=document.createElement('div');n.innerHTML=buildCard(ei);card.replaceWith(n.firstChild);}}
function setWeight(ei,si,v){if(!SESS)return;SESS.exercises[ei].sets[si].weight=Math.max(0,parseFloat(v)||0);saveSess();}
function adjW(ei,si,d,isDrop){
  if(!SESS)return;
  const set=SESS.exercises[ei].sets[si];
  if(isDrop){
    set.dropWeight=Math.max(0,Math.round(((set.dropWeight||0)+d)/2.5)*2.5);
    const el=document.getElementById('dw_'+ei+'_'+si);
    if(el)el.value=set.dropWeight;
  }else{
    set.weight=Math.max(0,Math.round(((set.weight||0)+d)/2.5)*2.5);
    const el=document.getElementById('w_'+ei+'_'+si);
    if(el)el.value=set.weight;
  }
  saveSess();
}
function setReps(ei,si,v){if(!SESS)return;SESS.exercises[ei].sets[si].reps=parseInt(v)||0;saveSess();}
function markDone(ei,si){
  if(!SESS)return;
  const set=SESS.exercises[ei].sets[si];
  set.done=!set.done;
  saveSess();
  vibrate(set.done?[40,20,80]:[20]);
  if(set.done){
    beep(660,.06,.12);
    const ex=effEx(SESS.dayId,SESS.exercises[ei].baseIdx,SESS.week);
    if(ex.rest>0&&!isLastWorkingSet(ei,si))startRest(minRest(ex.rest),SESS.exercises[ei].name);
  }
  const card=document.getElementById('exc_'+ei);
  if(card){
    const n=document.createElement('div');n.innerHTML=buildCard(ei);
    const nc=n.firstChild;card.replaceWith(nc);
    if(set.done){const row=nc.querySelector('#srow_'+ei+'_'+si);if(row)row.classList.add('row-flash');}
  }
  const total=SESS.exercises.reduce((a,e)=>a+e.sets.length,0);
  const done=SESS.exercises.reduce((a,e)=>a+e.sets.filter(x=>x.done).length,0);
  const pct=total?Math.round(done/total*100):0;
  const pb=document.querySelector('.pbf');if(pb)pb.style.width=pct+'%';
  const ps=document.querySelector('.prog-sets');if(ps)ps.textContent=done+'/'+total+' เซ็ต';
  const pp=document.querySelector('.prog-pct');if(pp)pp.textContent=pct+'%';
  const totalEx=SESS.exercises.length;
  const doneExFull=SESS.exercises.filter(e=>e.sets.length>0&&e.sets.every(x=>x.done)).length;
  const curExNum=Math.min(doneExFull+1,totalEx);
  const pe=document.querySelector('.prog-ex');if(pe)pe.textContent='ท่าที่ '+curExNum+'/'+totalEx;
  const vol=SESS.exercises.reduce((a,e)=>a+(e.sets?.reduce((b,x)=>b+(x.done?(x.weight||0)*(x.reps||1):0),0)||0),0);
  const vv=document.getElementById('sess-vol');if(vv)vv.textContent=vol>0?vol.toFixed(0)+' kg vol':'— kg';
  if(set.done){
    setTimeout(()=>{
      let found=null;
      for(let e=ei;e<SESS.exercises.length&&!found;e++){
        const ex2=SESS.exercises[e];
        for(let s=(e===ei?si+1:0);s<ex2.sets.length;s++){if(!ex2.sets[s].done){found='srow_'+e+'_'+s;break;}}
      }
      if(found){const el=document.getElementById(found);el?.scrollIntoView({behavior:'smooth',block:'center'});}
    },350);
  }
}

function addSet(ei){
  if(!SESS)return;
  const sets=SESS.exercises[ei].sets;
  const last=sets[sets.length-1];
  sets.push({weight:last?.weight||0,reps:null,done:false});
  saveSess();
  const card=document.getElementById('exc_'+ei);
  if(card){const n=document.createElement('div');n.innerHTML=buildCard(ei);card.replaceWith(n.firstChild);}
}
function removeSet(ei){
  if(!SESS)return;
  const sets=SESS.exercises[ei].sets;
  if(sets.length<=1)return;
  sets.pop();
  saveSess();
  const card=document.getElementById('exc_'+ei);
  if(card){const n=document.createElement('div');n.innerHTML=buildCard(ei);card.replaceWith(n.firstChild);}
}

function ytParse(url){
  if(!url)return null;
  let id='',start=0;
  const m1=url.match(/youtu\.be\/([^?&#/]+)/);
  const m2=url.match(/[?&]v=([^?&#]+)/);
  if(m1)id=m1[1];else if(m2)id=m2[1];
  if(!id)return null;
  const ts=url.match(/[?&]t=(\d+)/);
  if(ts)start=parseInt(ts[1]);
  return{id,start,embed:`https://www.youtube.com/embed/${id}?start=${start}&rel=0&modestbranding=1&autoplay=1&playsinline=1`,thumb:`https://i.ytimg.com/vi/${id}/hqdefault.jpg`};
}

// ─── PLAN ────────────────────────────────────────────────────
const DAYC={legs:'var(--dl)',push:'var(--dp)',pull:'var(--du)',full:'var(--df)'};
const DAYS_SHORT={legs:'Legs',push:'Push',pull:'Pull',full:'Full'};
const CYCLE=[{d:'legs'},{d:'push'},{d:'pull'},{r:1},{d:'full'},{r:1},{r:2}];
function gapAfter(dayId){return(dayId==='pull'||dayId==='full')?2:1;}

function nextUp(){
  const order=P.schedule.order;
  const hist=allSessions().filter(s=>s.completed).sort((a,b)=>b.date.localeCompare(a.date));
  if(!hist.length)return{dayId:order[0],last:null,since:null,gap:0,ready:true,week:CFG.week};
  const last=hist[0];
  const li=order.indexOf(last.dayId);
  const dayId=order[(li+1)%order.length];
  const week=li===order.length-1?Math.min(6,(last.week||1)+1):(last.week||1);
  const since=daysBetween(last.date,todayStr());
  const gap=gapAfter(last.dayId);
  return{dayId,last,since,gap,ready:since>=gap,week};
}

function renderPlan(){
  const nx=nextUp(),order=P.schedule.order;
  const day=P.days[nx.dayId];
  const hist=allSessions().filter(s=>s.completed);
  if(!CALM){const d=new Date();CALM={y:d.getFullYear(),m:d.getMonth()};}

  let statusHtml;
  if(!nx.last){
    statusHtml=`<button class="nxt-btn" onclick="planStart('${nx.dayId}',${nx.week})">เริ่มซ้อมวันแรก</button>`;
  }else if(nx.since===0){
    statusHtml=`<div class="nxt-rest">✓ ซ้อม ${P.days[nx.last.dayId].name} ไปแล้ววันนี้ — พักได้เลย<br>ถัดไป: <strong>${day.name}</strong></div><button class="nxt-btn ghost" onclick="planStart('${nx.dayId}',${nx.week})">ซ้อม ${day.name} เลย</button>`;
  }else if(!nx.ready){
    const left=nx.gap-nx.since;
    statusHtml=`<div class="nxt-rest"><strong>วันนี้พัก</strong> — เหลืออีก ${left} วัน (${nx.since}/${nx.gap})</div><button class="nxt-btn ghost" onclick="planStart('${nx.dayId}',${nx.week})">ข้ามพัก ซ้อมเลย</button>`;
  }else{
    const late=nx.since>nx.gap+2?`<div style="font-size:12px;color:var(--yel);margin-bottom:7px">ห่างจากครั้งล่าสุด ${nx.since} วันแล้ว</div>`:'';
    statusHtml=`${late}<button class="nxt-btn" onclick="planStart('${nx.dayId}',${nx.week})">เริ่มซ้อม ${day.name}</button>`;
  }
  const nxCard=`<div class="nxt"><div class="nxt-top"><div class="nxt-dot" style="background:${DAYC[nx.dayId]}">${DAYS_SHORT[nx.dayId]}</div><div style="flex:1;min-width:0"><div class="nxt-lbl">${nx.ready||!nx.last?'ถัดไป':'พักอยู่'}</div><div class="nxt-nm">${day.name}</div><div class="nxt-sub">${day.th} · สัปดาห์ ${nx.week}${nx.last?' · ล่าสุด '+fmtDate(nx.last.date):''}</div></div></div><div class="nxt-act">${statusHtml}</div></div>`;

  const curIdx=(()=>{if(!nx.last)return 0;const li=CYCLE.findIndex(c=>c.d===nx.last.dayId);if(nx.ready)return CYCLE.findIndex(c=>c.d===nx.dayId);return Math.min(li+nx.since,CYCLE.length-1);})();
  const cycHtml=CYCLE.map((c,i)=>{const on=i===curIdx?' now':'';if(c.r)return`<div class="cyc-i rest${on}"><div class="cyc-b" style="background:var(--bdr)"></div><div class="cyc-t">Rest</div></div>`;return`<div class="cyc-i${on}"><div class="cyc-b" style="background:${DAYC[c.d]}"></div><div class="cyc-t">${DAYS_SHORT[c.d]}</div></div>`;}).join('');

  const doneMap={};hist.forEach(s=>{doneMap[(s.week||1)+'_'+s.dayId]=s;});
  let pgHtml=`<div class="pg-h"></div>`+order.map(id=>`<div class="pg-h" style="color:${DAYC[id]}">${DAYS_SHORT[id]}</div>`).join('');
  for(let w=1;w<=6;w++){
    pgHtml+=`<div class="pg-w">W${w}</div>`;
    order.forEach(id=>{const s=doneMap[w+'_'+id];const cur=(w===nx.week&&id===nx.dayId&&nx.ready)?' cur':'';pgHtml+=s?`<div class="pg-c on${cur}" style="background:${DAYC[id]}" onclick="showSessDetail('${s.date}','${id}')" title="${fmtDate(s.date)}">✓</div>`:`<div class="pg-c${cur}" onclick="planStart('${id}',${w})">${w===6?'☾':'·'}</div>`;});
  }

  const doneCount=hist.length;
  const streak=(()=>{const dates=[...new Set(hist.map(s=>s.date))].sort().reverse();if(!dates.length)return 0;let n=1;for(let i=1;i<dates.length;i++){if(daysBetween(dates[i],dates[i-1])<=3)n++;else break;}return n;})();

  return`<div class="ph"><h1>แผน</h1><p>Phase 1 · Base Hypertrophy · 6 สัปดาห์</p></div>
  ${nxCard}
  <div class="slbl">รอบการซ้อม</div>
  <div class="cyc">${cycHtml}</div>
  <div style="padding:4px 14px 0;font-size:11px;color:var(--tx3);line-height:1.5">${P.schedule.restRule_th}</div>
  <div class="slbl">ความคืบหน้า Phase 1</div>
  <div class="stats">
    <div class="stat"><div class="stat-n" style="color:var(--acc)">${doneCount}<span style="font-size:13px;color:var(--tx3)">/24</span></div><div class="stat-l">ซ้อมแล้ว</div></div>
    <div class="stat"><div class="stat-n">${Math.round(doneCount/24*100)}%</div><div class="stat-l">ของ Phase</div></div>
    <div class="stat"><div class="stat-n" style="color:${streak>1?'var(--grn)':'var(--tx)'}">${streak}</div><div class="stat-l">ต่อเนื่อง</div></div>
  </div>
  <div class="pg" style="margin-top:9px">${pgHtml}</div>
  <div style="padding:4px 14px 0;font-size:11px;color:var(--tx3)">กดช่องว่างเพื่อเริ่มซ้อมวันนั้น · ☾ = deload</div>
  <div class="slbl">ปฏิทิน</div>
  ${renderCal()}
  <div class="lg">${order.map(id=>`<div class="lg-i"><div class="lg-d" style="background:${DAYC[id]}"></div>${P.days[id].name}</div>`).join('')}</div>
  <div style="height:20px"></div>`;
}

function renderCal(){
  const {y,m}=CALM;
  const byDate={};
  allSessions().filter(s=>s.completed).forEach(s=>{(byDate[s.date]=byDate[s.date]||[]).push(s);});
  const first=new Date(y,m,1);
  const startDow=(first.getDay()+6)%7;
  const dim=new Date(y,m+1,0).getDate();
  const today=todayStr();
  const mLabel=first.toLocaleDateString('th-TH',{month:'long',year:'numeric'});
  let cells=['จ','อ','พ','พฤ','ศ','ส','อา'].map(d=>`<div class="cal-dow">${d}</div>`).join('');
  for(let i=0;i<startDow;i++)cells+=`<div class="cal-d pad"></div>`;
  for(let d=1;d<=dim;d++){
    const key=dkey(y,m,d);const ss=byDate[key]||[];
    const dots=ss.map(s=>`<div class="cal-dot" style="background:${DAYC[s.dayId]||'var(--tx3)'}"></div>`).join('');
    const cls=`cal-d${ss.length?' has':''}${key===today?' today':''}`;
    const click=ss.length?` onclick="showSessDetail('${ss[0].date}','${ss[0].dayId}')"`:'';
    cells+=`<div class="${cls}"${click}><span>${d}</span><div class="cal-dots">${dots}</div></div>`;
  }
  return`<div class="cal-h"><button class="cal-nav" onclick="calMove(-1)">‹</button><div class="cal-m">${mLabel}</div><button class="cal-nav" onclick="calMove(1)">›</button></div><div class="cal">${cells}</div>`;
}
function calMove(d){const nm=CALM.m+d;CALM={y:CALM.y+Math.floor(nm/12),m:((nm%12)+12)%12};render();}
function planStart(dayId,week){
  if(SESS){if(!window.__forceStart)return confirmStartNew(dayId);window.__forceStart=false;}

  if(week){CFG.week=week;saveCfg();}
  goNav('today');startSession(dayId);
}

// ─── HISTORY ─────────────────────────────────────────────────
function renderHistory(){
  const sessions=allSessions().filter(s=>s.completed);
  if(!sessions.length)return`<div class="ph"><h1>ประวัติ</h1></div><div class="empty"><h3>ยังไม่มีประวัติ</h3><p>เริ่มซ้อมเลย!</p></div>`;
  const expRow=`<div style="display:flex;gap:8px;padding:10px 16px">
    <button class="btn btns" style="font-size:13px;padding:8px 14px" onclick="exportData()">↑ Export</button>
    <label class="btn btns" style="cursor:pointer;font-size:13px;padding:8px 14px">↓ Import<input type="file" accept=".json" style="display:none" onchange="handleImport(event)"></label>
  </div>`;
  const DAYC2={legs:'var(--dl)',push:'var(--dp)',pull:'var(--du)',full:'var(--df)'};
  // Group by month
  const groups={};
  sessions.forEach(s=>{
    const d=new Date(s.date+'T12:00:00');
    const key=d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0');
    const label=d.toLocaleDateString('th-TH',{month:'long',year:'numeric'});
    if(!groups[key])groups[key]={label,sessions:[]};
    groups[key].sessions.push(s);
  });
  const html=Object.keys(groups).sort().reverse().map(key=>{
    const {label,sessions:gss}=groups[key];
    const rows=gss.map(s=>{
      const day=P.days[s.dayId];
      const doneSets=s.exercises?.reduce((a,e)=>a+(e.sets?.filter(x=>x.done).length||0),0)||0;
      const doneVol=s.exercises?.reduce((a,e)=>a+(e.sets?.reduce((b,x)=>b+(x.done?(x.weight||0)*(x.reps||0):0),0)||0),0)||0;
      const d=new Date(s.date+'T12:00:00');
      const dayLabel=d.toLocaleDateString('th-TH',{weekday:'short',day:'numeric'});
      return`<div class="hs" onclick="showSessDetail('${s.date}','${s.dayId}')">
        <div class="hs-dot" style="background:${DAYC2[s.dayId]||'var(--acc)'}"></div>
        <div class="hs-body">
          <div class="hd">${dayLabel} · W${s.week}</div>
          <div class="hn">${day?.name||s.dayId}</div>
          <div class="hst">${doneSets} sets · ${doneVol>0?Math.round(doneVol)+' kg':'—'}</div>
        </div>
        <div class="hs-chev">›</div>
      </div>`;
    }).join('');
    return`<div style="padding:16px 18px 4px;font-size:20px;font-weight:700;letter-spacing:-.2px">${label}</div>${rows}`;
  }).join('');
  return`<div class="ph"><h1>ประวัติ</h1><p>${sessions.length} sessions</p></div>${expRow}${html}`;
}
function showSessDetail(date,dayId){
  const s=allSessions().find(x=>x.date===date&&x.dayId===dayId);
  if(!s)return;
  const day=P.days[dayId];
  const durSec=s.endTime&&s.startTime?Math.round((s.endTime-s.startTime)/1000):0;
  const durStr=durSec>0?`${Math.floor(durSec/3600)>0?Math.floor(durSec/3600)+'ชม. ':''}${Math.floor((durSec%3600)/60)} นาที`:'';
  const rows=s.exercises?.map((ex,ei)=>{
    const doneSets=ex.sets?.filter(x=>x.done)||[];
    if(!doneSets.length)return'';
    const setRows=doneSets.map((x,si)=>`
      <div class="hedit-row">
        <span style="font-size:12px;color:var(--tx3);width:22px">${si+1}</span>
        <input class="hedit-inp" type="number" value="${x.weight||0}" step="2.5" inputmode="decimal" onchange="editHistSet('${date}','${dayId}',${ei},${si},'weight',this.value)"> <span style="font-size:12px;color:var(--tx3)">kg ×</span>
        <input class="hedit-inp" type="number" value="${x.reps||0}" inputmode="numeric" onchange="editHistSet('${date}','${dayId}',${ei},${si},'reps',this.value)"> <span style="font-size:12px;color:var(--tx3)">ครั้ง</span>
      </div>`).join('');
    return`<div style="border-bottom:1px solid var(--bdr)"><div style="padding:8px 14px 2px;font-size:15px;font-weight:600">${ex.name}</div>${setRows}</div>`;
  }).join('')||'';
  document.getElementById('modal').innerHTML=`<div class="modal-wrap">
    <div class="modal-bd" onclick="closeModal()"></div>
    <div class="modal-sh" style="max-height:85dvh;overflow-y:auto">
      <div style="display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:4px">
        <div>
          <div style="font-size:18px;font-weight:700">${day?.name||dayId}</div>
          <div style="font-size:13px;color:var(--tx3)">${fmtDate(date)}${durStr?' · '+durStr:''} · W${s.week}</div>
        </div>
        <button onclick="closeModal()" style="background:none;border:none;color:var(--tx3);font-size:22px;cursor:pointer;padding:0;line-height:1">✕</button>
      </div>
      <div style="font-size:11px;color:var(--acc);margin-bottom:10px">กดตัวเลขเพื่อแก้ไข</div>
      ${rows}
      <button onclick="confirmDeleteSession('${date}','${dayId}')" style="width:100%;margin-top:14px;padding:11px;border:1px solid var(--red);border-radius:11px;background:none;color:var(--red);font-size:14px;cursor:pointer;font-family:inherit">ลบ Session นี้</button>
      <button class="sopt" style="color:var(--tx3);margin-top:4px;text-align:center" onclick="closeModal()">ปิด</button>
    </div>
  </div>`;
}
function editHistSet(date,dayId,ei,si,field,val){
  const hs=allSessions();
  const s=hs.find(x=>x.date===date&&x.dayId===dayId);
  if(!s)return;
  const doneSets=s.exercises?.[ei]?.sets?.filter(x=>x.done)||[];
  const set=doneSets[si];
  if(!set)return;
  set[field]=field==='weight'?(Math.max(0,parseFloat(val)||0)):(Math.max(0,parseInt(val)||0));
  localStorage.setItem('ppl_hist',JSON.stringify(hs));
}
function confirmDeleteSession(date,dayId){
  document.getElementById('modal').innerHTML=`<div class="modal-wrap">
    <div class="modal-bd" onclick="closeModal()"></div>
    <div class="modal-sh" style="padding-bottom:calc(24px + env(safe-area-inset-bottom))">
      <div style="font-size:18px;font-weight:700;margin-bottom:6px">ลบ Session?</div>
      <div style="font-size:13px;color:var(--tx2);margin-bottom:20px">ข้อมูลจะหายถาวร ไม่สามารถกู้คืนได้</div>
      <button onclick="deleteSession('${date}','${dayId}')" style="width:100%;padding:13px;border:none;border-radius:11px;background:var(--red);color:#fff;font-size:17px;font-weight:700;cursor:pointer;margin-bottom:8px">ลบ</button>
      <button onclick="closeModal()" style="width:100%;padding:11px;border:1.5px solid var(--bdr-s);border-radius:11px;background:var(--surf2);color:var(--tx2);font-size:14px;cursor:pointer;font-family:inherit">ยกเลิก</button>
    </div>
  </div>`;
}
function deleteSession(date,dayId){
  const hs=allSessions().filter(s=>!(s.date===date&&s.dayId===dayId));
  localStorage.setItem('ppl_hist',JSON.stringify(hs));
  closeModal();render();
}
function exportData(){
  const data={sessions:allSessions(),cfg:CFG,subs:SUBS};
  const b=new Blob([JSON.stringify(data,null,2)],{type:'application/json'});
  const u=URL.createObjectURL(b);
  const a=document.createElement('a');a.href=u;a.download=`ppl-backup-${todayStr()}.json`;a.click();URL.revokeObjectURL(u);
}
function handleImport(e){
  const f=e.target.files[0];if(!f)return;
  const r=new FileReader();
  r.onload=ev=>{try{const d=JSON.parse(ev.target.result);if(d.sessions)localStorage.setItem('ppl_hist',JSON.stringify(d.sessions));if(d.cfg){CFG={...CFG,...d.cfg};saveCfg();}if(d.subs){SUBS=d.subs;saveSubs();}render();alert('นำเข้าสำเร็จ');}catch(err){alert('ไฟล์ไม่ถูกต้อง');}};
  r.readAsText(f);
}

function renderPR(){
  const hist=allSessions().filter(s=>s.completed);
  if(!hist.length)return`<div class="empty"><h3>ยังไม่มีข้อมูล</h3><p>ซ้อมก่อนแล้วค้าง PR จะปรากฏที่นี่</p></div>`;
  // Build PR map: exName -> {weight, reps, date}
  const prMap={};
  hist.forEach(s=>{
    s.exercises?.forEach(ex=>{
      ex.sets?.filter(x=>x.done&&x.weight>0&&x.reps>0).forEach(x=>{
        const cur=prMap[ex.name];
        if(!cur||x.weight>cur.weight||(x.weight===cur.weight&&x.reps>cur.reps)){
          prMap[ex.name]={weight:x.weight,reps:x.reps,date:s.date};
        }
      });
    });
  });
  const rows=Object.entries(prMap).sort((a,b)=>b[1].weight-a[1].weight).map(([name,pr])=>`
    <div class="pr-row">
      <div style="flex:1;min-width:0">

        <div class="pr-date">${fmtDate(pr.date)}</div>

      <div style="text-align:right">

        <div style="font-size:11px;color:var(--tx3)">× ${pr.reps}</div>
      </div>
    </div>`).join('');
  return`<div class="slbl">Personal Records</div>${rows}`;
}

function calc1RM(){
  const w=parseFloat(document.getElementById('orm_w')?.value)||0;
  const r=parseInt(document.getElementById('orm_r')?.value)||0;
  const res=document.getElementById('orm_res');if(!res)return;
  if(!w||!r||r<1){res.innerHTML='';return;}
  if(r===1){res.innerHTML=`<div class="onerm-result">${w} kg</div><div class="onerm-sub">= 1RM โดยตรง</div>`;return;}
  const orm=Math.round(w*(1+r/30)*10)/10;
  const pcts=[[100,'1RM'],[95,'~1-2'],[90,'~3-4'],[85,'~5-6'],[80,'~7-8'],[75,'~9-10'],[70,'~11-12']];
  const rows=pcts.map(([p,rep])=>`<div style="display:flex;justify-content:space-between;padding:4px 0;border-bottom:1px solid var(--bdr);font-size:13px"><span style="color:var(--tx2)">${p}% · ${rep} ครั้ง</span><span style="font-variant-numeric:tabular-nums;font-weight:600">${Math.round(orm*p/100/2.5)*2.5} kg</span></div>`).join('');
  res.innerHTML=`<div class="onerm-result">${orm} kg</div><div class="onerm-sub">1RM ประมาณการ (Epley)</div><div style="margin-top:6px">${rows}</div>`;
}

ed,sans-serif" letter-spacing="1">FRONT</text></svg>`;
  const back=`<svg viewBox="0 0 120 300" xmlns="http://www.w3.org/2000/svg" width="100%" height="100%">${body}<ellipse cx="60" cy="63" rx="25" ry="14" fill="${f('upperBack')}" stroke="${s('upperBack')}" stroke-width="1.2"/><path d="M32,72 C27,78 25,92 27,108 L35,122 L52,115 L52,72 C44,70 37,70 32,72 Z" fill="${f('lats')}" stroke="${s('lats')}" stroke-width="1"/><path d="M88,72 C93,78 95,92 93,108 L85,122 L68,115 L68,72 C76,70 83,70 88,72 Z" fill="${f('lats')}" stroke="${s('lats')}" stroke-width="1"/><ellipse cx="27" cy="51" rx="9" ry="10" fill="${f('rearDelts')}" stroke="${s('rearDelts')}" stroke-width="1"/><ellipse cx="93" cy="51" rx="9" ry="10" fill="${f('rearDelts')}" stroke="${s('rearDelts')}" stroke-width="1"/><ellipse cx="16" cy="80" rx="6" ry="15" fill="${f('triceps')}" stroke="${s('triceps')}" stroke-width="1"/><ellipse cx="104" cy="80" rx="6" ry="15" fill="${f('triceps')}" stroke="${s('triceps')}" stroke-width="1"/><ellipse cx="46" cy="162" rx="15" ry="12" fill="${f('glutes')}" stroke="${s('glutes')}" stroke-width="1.2"/><ellipse cx="74" cy="162" rx="15" ry="12" fill="${f('glutes')}" stroke="${s('glutes')}" stroke-width="1.2"/><ellipse cx="46" cy="202" rx="12" ry="27" fill="${f('hamstrings')}" stroke="${s('hamstrings')}" stroke-width="1"/><ellipse cx="74" cy="202" rx="12" ry="27" fill="${f('hamstrings')}" stroke="${s('hamstrings')}" stroke-width="1"/><ellipse cx="45" cy="258" rx="9" ry="17" fill="${f('calves')}" stroke="${s('calves')}" stroke-width="1"/><ellipse cx="75" cy="258" rx="9" ry="17" fill="${f('calves')}" stroke="${s('calves')}" stroke-width="1"/><text x="60" y="296" text-anchor="middle" font-size="9" fill="rgba(255,255,255,0.3)" font-family="Barlow Condensed,sans-serif" letter-spacing="1">BACK</text></svg>`;
  return{front,back};
}

function renderTools(){
  const now=new Date();
  const ws=new Date(now.getFullYear(),now.getMonth(),now.getDate()-((now.getDay()+6)%7));
  const wkStart=dkey(ws.getFullYear(),ws.getMonth(),ws.getDate());
  const wkSess=allSessions().filter(s=>s.completed&&s.date>=wkStart);
  const volMap={};
  wkSess.forEach(s=>{
    s.exercises?.forEach((ex,xi)=>{
      const dayEx=P.days[s.dayId]?.ex[ex.baseIdx!==undefined?ex.baseIdx:xi];
      (dayEx?.m||[]).forEach(m=>{volMap[m]=(volMap[m]||0)+(ex.sets?.filter(x=>x.done).length||0);});
    });
  });
  const {front,back}=anatomySVG(volMap);
  const legend=[{c:'#22c55e',l:'มาก (>65%)'},{c:'#f97316',l:'ปานกลาง'},{c:'#eab308',l:'น้อย'},{c:'rgba(255,255,255,0.08)',l:'0 เซ็ต'}].map(i=>`<div class="vol-li"><div class="vol-dot" style="background:${i.c}"></div>${i.l}</div>`).join('');
  const maxBar=Math.max(...Object.values(volMap),1,8);
  const barHtml=Object.entries(P.muscleLabels).map(([k,lbl])=>{const v=volMap[k]||0;const pct=v/maxBar*100;const c=v===0?'var(--bdr)':v>=10?'var(--grn)':v>=6?'var(--acc)':'var(--yel)';return`<div class="vrow"><div class="vn">${lbl}</div><div class="vbw"><div class="vb" style="width:${pct}%;background:${c}"></div></div><div class="vnum">${v}</div></div>`;}).join('');

  return`<div class="ph"><h1>เครื่องมือ</h1></div>
  <div style="padding:10px 12px 4px">
    <h2 style="font-family:'Barlow Condensed',sans-serif;font-size:19px;font-weight:700;margin-bottom:6px">Volume สัปดาห์นี้</h2>
    <div class="anatomy-wrap"><div class="anatomy-fig">${front}<div class="anatomy-lbl">ด้านหน้า</div></div><div class="anatomy-fig">${back}<div class="anatomy-lbl">ด้านหลัง</div></div></div>
    <div class="vol-legend">${legend}</div>
    <details style="margin-top:6px"><summary style="font-size:12px;color:var(--tx3);cursor:pointer;padding:4px 0">▸ ตัวเลข (เซ็ต)</summary><div style="margin-top:8px">${barHtml}</div></details>
  </div>

  <div style="margin:0 12px;border-top:1px solid var(--bdr);padding-top:12px">
    <h2 style="font-family:'Barlow Condensed',sans-serif;font-size:19px;font-weight:700;margin-bottom:8px">เครื่องคิดแผ่น (บาร์ 20kg)</h2>
    <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap">
      <input class="inp" type="number" id="pt" placeholder="น้ำหนักเป้า (kg)" style="width:180px" inputmode="decimal" oninput="calcPlates()">
    </div>
    <div id="pr" class="prow" style="min-height:44px;margin-top:8px"></div>
  </div>

  <div style="margin:0 12px;border-top:1px solid var(--bdr);padding-top:12px">
    <h2 style="font-family:'Barlow Condensed',sans-serif;font-size:19px;font-weight:700;margin-bottom:8px">เครื่องคิดวอร์ม</h2>
    <div style="display:flex;gap:8px;flex-wrap:wrap">
      <input class="inp" type="number" id="ww" placeholder="น้ำหนักเซ็ตจริง (kg)" style="width:200px" inputmode="decimal" oninput="calcWarmup()">
      <select class="inp" id="ws" style="width:130px" onchange="calcWarmup()">
        <option value="1">1 เซ็ตวอร์ม</option>
        <option value="2">2 เซ็ตวอร์ม</option>
        <option value="3" selected>3 เซ็ตวอร์ม</option>
        <option value="4">4 เซ็ตวอร์ม</option>
      </select>
    </div>
    <div id="wr" style="margin-top:8px"></div>
  </div>

  <div style="margin:0 12px;border-top:1px solid var(--bdr);padding-top:12px">
    <h2 style="font-family:'Barlow Condensed',sans-serif;font-size:19px;font-weight:700;margin-bottom:8px">การตั้งค่า</h2>
    <label style="display:flex;align-items:center;gap:10px;cursor:pointer;padding:8px 0;border-bottom:1px solid var(--bdr)">
      <input type="checkbox" ${CFG.repFloor4?'checked':''} onchange="CFG.repFloor4=this.checked;saveCfg()" style="width:18px;height:18px;accent-color:var(--acc)">
      <div>
        <div style="font-size:14px;font-weight:500">repFloor4</div>
        <div style="font-size:12px;color:var(--tx2)">ถ้า reps น้อยกว่า 4 ให้ขึ้นเป็น 4 แทน</div>
      </div>
    </label>
    <div style="padding:8px 0;font-size:13px;color:var(--tx2)">สัปดาห์ปัจจุบัน: <strong style="color:var(--acc)">W${CFG.week}</strong></div>
  </div>
  <div style="height:20px"></div>`;
}

function calcWarmupQuick(){
  const w=parseFloat(document.getElementById('wu-quick-w')?.value)||0;
  const n=parseInt(document.getElementById('wu-quick-n')?.value)||3;
  const res=document.getElementById('wu-quick-res');if(!res)return;
  if(w<=0){res.innerHTML='';return;}
  const rule=P.warmupCalc.rules.find(r=>r.warmupSets===n);if(!rule)return;
  const rows=rule.steps.map((step,i)=>{const wkg=Math.round(w*step.pct/100/2.5)*2.5;return`<tr><td style="padding:4px 8px 4px 0;color:var(--tx2);font-size:13px">เซ็ต ${i+1}</td><td style="padding:4px 8px;font-size:15px;font-weight:700;font-variant-numeric:tabular-nums;color:var(--acc)">${wkg} kg</td><td style="padding:4px 0;font-size:11px;color:var(--tx3)">${step.pct}%</td></tr>`;}).join('');
  res.innerHTML=`<table style="border-collapse:collapse">${rows}</table>`;
}
function calcPlatesQuick(){
  const t=parseFloat(document.getElementById('wu-plate-w')?.value)||0;
  const res=document.getElementById('wu-plate-res');if(!res)return;
  if(t<=20){res.innerHTML='<span style="color:var(--tx3);font-size:13px">ใส่แค่บาร์ (20 kg)</span>';return;}
  const per=(t-20)/2;const sizes=[20,15,10,5,2.5,1.25];const cls={20:'pl p20',15:'pl p15',10:'pl p10',5:'pl p5',2.5:'pl p25',1.25:'pl p125'};
  let rem=per,html='';sizes.forEach(p=>{const n=Math.floor(rem/p+0.001);if(n>0){rem=Math.round((rem-n*p)*1000)/1000;for(let i=0;i<n;i++)html+=`<div class="${cls[p]}">${p}</div>`;}});
  if(rem>0.01)html+=`<span style="color:var(--red);font-size:12px">ไม่ลงตัว</span>`;
  html+=`<span style="font-size:11px;color:var(--tx3);align-self:center;margin-left:4px">ต่อด้าน</span>`;
  res.innerHTML=html;
}
function calcPlates(){
  const t=parseFloat(document.getElementById('pt')?.value)||0;
  const res=document.getElementById('pr');if(!res)return;
  if(t<=20){res.innerHTML='<span style="color:var(--tx3);font-size:13px">ใส่แค่บาร์ (20 kg)</span>';return;}
  const per=(t-20)/2;
  const sizes=[20,15,10,5,2.5,1.25];
  const cls={20:'pl p20',15:'pl p15',10:'pl p10',5:'pl p5',2.5:'pl p25',1.25:'pl p125'};
  let rem=per,html='';
  sizes.forEach(p=>{
    const n=Math.floor(rem/p+0.001);
    if(n>0){rem=Math.round((rem-n*p)*1000)/1000;for(let i=0;i<n;i++)html+=`<div class="${cls[p]}">${p}</div>`;}
  });
  if(rem>0.01)html+=`<span style="color:var(--red);font-size:12px">ไม่ลงตัว</span>`;
  html+=`<span style="font-size:11px;color:var(--tx3);align-self:center;margin-left:4px">ต่อด้าน</span>`;
  res.innerHTML=html;
}

function calcWarmup(){
  const w=parseFloat(document.getElementById('ww')?.value)||0;
  const n=parseInt(document.getElementById('ws')?.value)||3;
  const res=document.getElementById('wr');if(!res)return;
  if(w<=0){res.innerHTML='';return;}
  const rule=P.warmupCalc.rules.find(r=>r.warmupSets===n);
  if(!rule)return;
  const rows=rule.steps.map((step,i)=>{
    const wkg=Math.round(w*step.pct/100/2.5)*2.5;
    return`<tr><td style="padding:5px 8px 5px 0;color:var(--tx2);font-size:13px">เซ็ต ${i+1}</td><td style="padding:5px 8px;font-size:15px;font-weight:600;font-variant-numeric:tabular-nums">${wkg} kg</td><td style="padding:5px 0;font-size:11px;color:var(--tx3)">${step.pct}% · ${step.reps}</td></tr>`;
  }).join('');
  res.innerHTML=`<table style="border-collapse:collapse">${rows}</table><div style="font-size:11px;color:var(--tx3);margin-top:5px">${P.warmupCalc.note_th}</div>`;
}

// ─── GUIDE ───────────────────────────────────────────────────
function renderGuide(){
  const terms=P.keyTerms.map(t=>`<div class="tc"><div style="display:flex;align-items:baseline;gap:6px"><span class="tterm">${t.term}</span>${t.full?`<span class="tfull">${t.full}</span>`:''}</div><div class="tdef">${t.th}</div></div>`).join('');
  const faqs=P.faq.map(f=>`<div class="fq"><div class="fqq">${f.q_th}</div><div class="fqa">${f.a_th}</div></div>`).join('');
  const prog=P.progression.rules_th.map(r=>`<div style="display:flex;gap:7px;padding:6px 0;border-bottom:1px solid var(--bdr)"><span style="color:var(--acc);flex-shrink:0">•</span><span style="font-size:13px;color:var(--tx2);line-height:1.5">${r}</span></div>`).join('');
  return`<div class="ph"><h1>คู่มือ</h1><p>PPL 4x · Jeff Nippard · Phase 1 W1-6</p></div>
  <div style="padding:8px 14px 4px;font-size:13px;color:var(--tx2);line-height:1.5">${P.schedule.restRule_th}</div>

  <div class="slbl">Progressive Overload</div>
  <div style="padding:0 14px 10px">${prog}</div>

  <div class="slbl">FAQ</div>
  ${faqs}

  <div class="slbl">คำศัพท์</div>
  ${terms}
  <div style="height:20px"></div>`;
}

loadStorage();
render();
</script>
