<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0d1117">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>PPL 4x</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700;800&family=IBM+Plex+Sans+Thai:wght@400;500;600&display=swap">
<style>
/* ══ TOKENS ══════════════════════════════════════════════════ */
:root{
  --bg:#0c0c0e;--bg2:#111114;--surf:#18181c;--surf2:#222228;
  --bdr:rgba(255,255,255,0.07);--bdr-s:rgba(255,255,255,0.12);
  --acc:#ff6500;--acc-g:rgba(255,101,0,.13);--acc-d:rgba(255,101,0,.08);
  --tx:#f2f2f4;--tx2:#8f8fa0;--tx3:#50505e;
  --grn:#22c55e;--grn-d:rgba(34,197,94,.12);
  --red:#ef4444;--yel:#f59e0b;--blu:#3b82f6;
  --nav:64px;--r:14px;
  --dl:#e8480a;--dp:#0ea5e9;--du:#10b981;--df:#c026d3;
}
@media(prefers-color-scheme:light){:root:not([data-theme=dark]){
  --bg:#f4f4f6;--bg2:#ffffff;--surf:#ffffff;--surf2:#ebebef;
  --bdr:rgba(0,0,0,0.08);--bdr-s:rgba(0,0,0,0.14);
  --acc:#e85200;--acc-g:rgba(232,82,0,.09);--acc-d:rgba(232,82,0,.06);
  --tx:#131316;--tx2:#63637a;--tx3:#9999b0;
  --grn:#16a34a;--grn-d:rgba(22,163,74,.1);
  --red:#dc2626;--yel:#d97706;--blu:#2563eb;
  --dl:#d43d08;--dp:#0284c7;--du:#059669;--df:#a21caf;
}}
:root[data-theme=dark]{
  --bg:#0c0c0e;--bg2:#111114;--surf:#18181c;--surf2:#222228;
  --bdr:rgba(255,255,255,0.07);--bdr-s:rgba(255,255,255,0.12);
  --acc:#ff6500;--acc-g:rgba(255,101,0,.13);--acc-d:rgba(255,101,0,.08);
  --tx:#f2f2f4;--tx2:#8f8fa0;--tx3:#50505e;
  --grn:#22c55e;--grn-d:rgba(34,197,94,.12);
  --red:#ef4444;--yel:#f59e0b;--blu:#3b82f6;
  --dl:#e8480a;--dp:#0ea5e9;--du:#10b981;--df:#c026d3;
}
:root[data-theme=light]{
  --bg:#f4f4f6;--bg2:#ffffff;--surf:#ffffff;--surf2:#ebebef;
  --bdr:rgba(0,0,0,0.08);--bdr-s:rgba(0,0,0,0.14);
  --acc:#e85200;--acc-g:rgba(232,82,0,.09);--acc-d:rgba(232,82,0,.06);
  --tx:#131316;--tx2:#63637a;--tx3:#9999b0;
  --grn:#16a34a;--grn-d:rgba(22,163,74,.1);
  --red:#dc2626;--yel:#d97706;--blu:#2563eb;
  --dl:#d43d08;--dp:#0284c7;--du:#059669;--df:#a21caf;
}
/* ══ RESET ═══════════════════════════════════════════════════ */
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:var(--bg);color:var(--tx);font-family:'IBM Plex Sans Thai','DM Sans',system-ui,sans-serif;font-size:15px;line-height:1.5}
body{overflow:hidden}
/* ══ SHELL ═══════════════════════════════════════════════════ */
#app{height:100dvh;display:flex;flex-direction:column}
#main{flex:1;overflow-y:auto;overflow-x:hidden;padding-bottom:calc(var(--nav) + env(safe-area-inset-bottom) + 12px)}
/* ══ NAV ══════════════════════════════════════════════════════ */
#nav{height:var(--nav);border-top:1px solid var(--bdr);background:rgba(12,12,14,0.82);backdrop-filter:blur(24px) saturate(160%);-webkit-backdrop-filter:blur(24px) saturate(160%);display:flex;position:fixed;bottom:0;left:0;right:0;z-index:100;padding-bottom:env(safe-area-inset-bottom)}
.nb{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;background:none;border:none;color:var(--tx3);cursor:pointer;font-family:'DM Sans',inherit;font-size:10px;font-weight:500;letter-spacing:.04em;text-transform:uppercase;transition:color .2s}
.nb.on{color:var(--acc)}
.nb svg{width:22px;height:22px}
.screen{display:none;min-height:100%}
.screen.on{display:block}
.bc{font-family:'Barlow Condensed',sans-serif}
/* ══ PAGE HEADER ══════════════════════════════════════════════ */
.ph{padding:16px 16px 12px;border-bottom:1px solid var(--bdr);background:var(--bg);position:sticky;top:0;z-index:10}
.ph h1{font-family:'Barlow Condensed',sans-serif;font-size:28px;font-weight:800;letter-spacing:-.01em;text-wrap:balance;line-height:1}
.ph p{font-size:12px;color:var(--tx2);margin-top:3px}
/* ══ CARDS ════════════════════════════════════════════════════ */
.card{background:var(--surf);border:1px solid var(--bdr);border-radius:var(--r);margin:8px 14px;overflow:hidden}
/* ══ BADGES ═══════════════════════════════════════════════════ */
.bdg{display:inline-block;font-size:10px;font-weight:600;letter-spacing:.05em;padding:2px 7px;border-radius:20px;text-transform:uppercase}
.bn{background:var(--surf2);color:var(--tx2)}
.bf{background:var(--acc-d);color:var(--acc)}
.bd{background:rgba(239,68,68,.13);color:var(--red)}
.bm{background:rgba(59,130,246,.13);color:var(--blu)}
.bh{background:rgba(245,158,11,.13);color:var(--yel)}
.ba{background:var(--grn-d);color:var(--grn)}
.bp{background:rgba(59,130,246,.1);color:var(--blu)}
.bs{background:var(--acc-d);color:var(--acc)}
/* ══ EXERCISE CARD ════════════════════════════════════════════ */
.exc{background:var(--surf);border:1px solid var(--bdr);border-radius:var(--r);margin:6px 14px;overflow:hidden}
.exc.ss1{border-bottom-left-radius:0;border-bottom-right-radius:0;border-bottom:none;margin-bottom:0}
.exc.ss2{border-top-left-radius:0;border-top-right-radius:0;margin-top:0;border-top:2px dashed var(--acc)}
.exh{padding:12px 14px 10px;display:flex;align-items:flex-start;gap:10px}
.exn{flex:1;min-width:0}
.exnm{font-family:'Barlow Condensed',sans-serif;font-size:24px;font-weight:700;line-height:1.05;color:var(--tx);text-decoration:none;display:block;word-break:break-word;letter-spacing:-.01em}
.exnm:active{color:var(--acc)}
.exmeta{font-size:12px;color:var(--tx2);margin-top:4px;line-height:1.4}
/* ══ SET TABLE ════════════════════════════════════════════════ */
.st{width:100%;border-collapse:collapse}
.st th{font-size:10px;color:var(--tx3);font-weight:600;text-align:left;padding:4px 8px 4px 14px;text-transform:uppercase;letter-spacing:.06em;border-top:1px solid var(--bdr);background:var(--bg)}
.st td{padding:7px 8px 7px 14px;border-top:1px solid var(--bdr);vertical-align:middle}
.sn{font-size:12px;color:var(--tx3);font-weight:500;width:26px}
.sd{width:38px;text-align:center}
/* ══ WEIGHT INPUT ═════════════════════════════════════════════ */
.wc{display:flex;align-items:center;gap:4px}
.wi{width:70px;background:var(--surf2);border:1.5px solid var(--bdr-s);color:var(--tx);font-family:'IBM Plex Sans Thai','DM Sans',sans-serif;font-size:16px;font-weight:600;font-variant-numeric:tabular-nums;text-align:center;padding:6px 3px;border-radius:9px;-moz-appearance:textfield;transition:border-color .15s,background .15s}
.wi::-webkit-outer-spin-button,.wi::-webkit-inner-spin-button{-webkit-appearance:none}
.wi:focus{outline:none;border-color:var(--acc);background:var(--surf)}
.ab{width:30px;height:34px;border:1.5px solid var(--bdr-s);background:var(--surf2);color:var(--tx2);cursor:pointer;font-size:17px;border-radius:9px;display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:all .12s}
.ab:active{background:var(--acc-d);border-color:var(--acc);color:var(--acc)}
/* ══ REPS INPUT ═══════════════════════════════════════════════ */
.ri{width:52px;background:var(--surf2);border:1.5px solid var(--bdr-s);color:var(--tx);font-family:'IBM Plex Sans Thai','DM Sans',sans-serif;font-size:15px;font-weight:600;font-variant-numeric:tabular-nums;text-align:center;padding:6px 3px;border-radius:9px;-moz-appearance:textfield;transition:border-color .15s}
.ri::-webkit-outer-spin-button,.ri::-webkit-inner-spin-button{-webkit-appearance:none}
.ri:focus{outline:none;border-color:var(--acc)}
.rt{font-size:10px;color:var(--tx3);margin-top:1px}
/* ══ DONE BUTTON ══════════════════════════════════════════════ */
.db{width:34px;height:34px;border-radius:50%;border:2px solid var(--bdr-s);background:var(--surf2);cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .18s;flex-shrink:0}
.db:active{border-color:var(--grn);transform:scale(.92)}
.db.done{background:var(--grn);border-color:var(--grn);box-shadow:0 0 0 3px rgba(34,197,94,.2)}
.db svg{width:15px;height:15px;color:transparent;transition:color .12s}
.db.done svg{color:#fff}
tr.dc td{opacity:.5}
/* ══ MISC EXERCISE ════════════════════════════════════════════ */
.wubar{font-size:11px;color:var(--tx2);padding:5px 14px 4px;background:var(--bg);border-bottom:1px solid var(--bdr)}
.wubar strong{font-size:10px;text-transform:uppercase;letter-spacing:.05em;color:var(--tx3)}
.sug{font-size:11px;color:var(--acc);background:var(--acc-g);border:1px solid rgba(255,101,0,.22);border-radius:20px;padding:3px 10px;display:inline-block;margin:4px 14px 6px}
.frpe{font-size:10px;color:var(--acc);background:var(--acc-d);border-radius:20px;padding:1px 7px;white-space:nowrap}
.hbtn{padding:7px 18px;background:var(--acc-d);border:1.5px solid var(--acc);color:var(--acc);border-radius:10px;font-family:'Barlow Condensed',sans-serif;font-size:17px;font-weight:700;cursor:pointer}
.htick{font-variant-numeric:tabular-nums;font-size:22px;font-weight:700;font-family:'Barlow Condensed',sans-serif;color:var(--acc)}
/* ══ REST TIMER ═══════════════════════════════════════════════ */
#tov{position:fixed;bottom:calc(var(--nav) + env(safe-area-inset-bottom) + 12px);left:0;right:0;z-index:200;display:flex;flex-direction:column;align-items:center;pointer-events:none;gap:8px}
.tpill{background:var(--bg2);border:1px solid var(--acc);border-radius:32px;padding:8px 18px;display:flex;align-items:center;gap:12px;pointer-events:all;box-shadow:0 4px 32px rgba(0,0,0,.6)}
.tring-wrap{position:relative;width:140px;height:140px;pointer-events:all;filter:drop-shadow(0 4px 24px rgba(0,0,0,.55))}
.tring-svg{width:140px;height:140px;transform:rotate(-90deg)}
.tring-bg{fill:rgba(0,0,0,.78);stroke:rgba(255,255,255,.06);stroke-width:8}
.tring-fg{fill:none;stroke-width:8;stroke-linecap:round;stroke-dasharray:301.6;transition:stroke-dashoffset .98s linear,stroke .5s}
.tring-center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.ttim{font-family:'Barlow Condensed',sans-serif;font-size:34px;font-weight:800;font-variant-numeric:tabular-nums;line-height:1.05}
.tlbl{font-size:10px;color:var(--tx3);max-width:90px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;text-align:center}
.tskp{background:rgba(0,0,0,.72);border:1px solid var(--bdr-s);color:var(--tx2);padding:7px 22px;border-radius:24px;font-size:12px;cursor:pointer;pointer-events:all;font-family:inherit;backdrop-filter:blur(8px);transition:all .15s}
.tskp:active{color:var(--acc);border-color:var(--acc)}
/* ══ DAY PICKER ═══════════════════════════════════════════════ */
.dgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:12px 14px}
.dbtn{background:var(--surf);border:1px solid var(--bdr);border-radius:var(--r);padding:16px 14px;text-align:left;cursor:pointer;transition:all .18s;width:100%;position:relative;overflow:hidden}
.dbtn::before{content:'';position:absolute;top:0;left:0;right:0;height:3px;background:var(--day-c,var(--acc))}
.dbtn:active{border-color:var(--day-c,var(--acc));background:rgba(255,255,255,0.04);transform:scale(.98)}
.dbtn{transition:transform .12s,background .12s,border-color .12s}
.dbtn .dn{font-family:'Barlow Condensed',sans-serif;font-size:22px;font-weight:700;color:var(--tx);display:block;line-height:1.1;letter-spacing:-.01em}
.dbtn .dt{font-size:11px;color:var(--tx2);margin-top:3px;text-transform:uppercase;letter-spacing:.04em}
.mpills{display:flex;flex-wrap:wrap;gap:3px;margin-top:7px}
.mp{font-size:10px;background:var(--surf2);border:1px solid var(--bdr);border-radius:20px;padding:2px 7px;color:var(--tx3)}
/* ══ WEEK SELECTOR ════════════════════════════════════════════ */
.wsel{display:flex;gap:6px;padding:10px 14px 8px;overflow-x:auto;scrollbar-width:none}
.wsel::-webkit-scrollbar{display:none}
.wbtn{flex-shrink:0;padding:5px 14px;border-radius:24px;border:1.5px solid var(--bdr-s);background:var(--surf);color:var(--tx2);font-size:13px;font-weight:500;cursor:pointer;white-space:nowrap;transition:all .15s}
.wbtn.on{background:var(--acc);border-color:var(--acc);color:#fff}
.dlnote{margin:0 14px 8px;padding:9px 12px;background:rgba(245,158,11,.08);border:1px solid rgba(245,158,11,.25);border-radius:10px;font-size:12px;color:var(--yel);line-height:1.45}
/* ══ SESSION HEADER ═══════════════════════════════════════════ */
.seh{padding:10px 14px;display:flex;align-items:center;gap:10px;border-bottom:1px solid var(--bdr);position:sticky;top:0;background:rgba(12,12,14,0.88);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);z-index:9}
.set{font-family:'Barlow Condensed',sans-serif;font-size:20px;font-weight:700;flex:1;line-height:1.1;letter-spacing:-.01em}
.sew{font-size:11px;color:var(--tx2)}
.bbtn{background:var(--surf2);border:1.5px solid var(--bdr-s);color:var(--tx2);border-radius:10px;padding:5px 11px;font-size:12px;cursor:pointer;font-family:inherit;transition:all .15s}
.fbtn{background:var(--grn);border:none;color:#fff;border-radius:10px;padding:7px 14px;font-family:'Barlow Condensed',sans-serif;font-size:17px;font-weight:700;cursor:pointer;letter-spacing:.01em}
/* ══ MODAL / SUBSTITUTION ═════════════════════════════════════ */
.sub-btn{background:none;border:none;color:var(--tx3);cursor:pointer;padding:2px;transition:color .15s}
.sub-btn:hover{color:var(--acc)}
.modal-wrap{position:fixed;inset:0;z-index:300;display:flex;align-items:flex-end}
.modal-bd{position:absolute;inset:0;background:rgba(0,0,0,.7)}
.modal-sh{position:relative;background:var(--bg2);border-radius:20px 20px 0 0;width:100%;padding:20px 18px calc(28px + env(safe-area-inset-bottom));z-index:1;max-height:80dvh;overflow-y:auto}
.sopt{display:block;width:100%;text-align:left;padding:13px 0;border:none;background:none;color:var(--tx);font-size:16px;cursor:pointer;border-bottom:1px solid var(--bdr);font-family:inherit;transition:color .12s}
.sopt:last-child{border-bottom:none}
.sopt:active{color:var(--acc)}
.sopt.on{color:var(--acc);font-weight:600}
/* ══ HISTORY ══════════════════════════════════════════════════ */
.hs{padding:13px 16px;border-bottom:1px solid var(--bdr);cursor:pointer;transition:background .12s}
.hs:active{background:var(--surf)}
.hd{font-size:11px;color:var(--tx3)}
.hn{font-family:'Barlow Condensed',sans-serif;font-size:20px;font-weight:700;letter-spacing:-.01em}
.hst{font-size:12px;color:var(--tx2);margin-top:2px}
/* ══ EMPTY STATE ══════════════════════════════════════════════ */
.empty{text-align:center;padding:56px 28px;color:var(--tx2)}
.empty h3{font-size:20px;margin-bottom:8px;color:var(--tx);font-family:'Barlow Condensed',sans-serif;font-weight:700}
/* ══ TOOLS ════════════════════════════════════════════════════ */
.tsec{margin:0 14px 14px}
.tsec h2{font-family:'Barlow Condensed',sans-serif;font-size:22px;font-weight:700;margin-bottom:8px}
/* ══ PLATES ═══════════════════════════════════════════════════ */
.prow{display:flex;flex-wrap:wrap;gap:7px;margin-top:8px;align-items:center}
.pl{width:38px;height:38px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;flex-shrink:0}
.p20{background:#b91c1c;color:#fff}
.p15{background:#1d4ed8;color:#fff}
.p10{background:#047857;color:#fff}
.p5{background:#92400e;color:#fff}
.p25{background:var(--surf2);border:2px solid var(--bdr-s);color:var(--tx);font-size:10px}
.p125{width:30px;height:30px;background:var(--surf);border:1px solid var(--bdr);color:var(--tx3);font-size:9px}
/* ══ VOL CHART ════════════════════════════════════════════════ */
.vrow{display:flex;align-items:center;gap:9px;margin-bottom:6px}
.vn{font-size:12px;width:90px;flex-shrink:0;color:var(--tx2)}
.vbw{flex:1;background:var(--surf2);border-radius:4px;height:10px;overflow:hidden}
.vb{height:100%;background:var(--acc);border-radius:4px;transition:width .4s cubic-bezier(.4,0,.2,1)}
.vnum{font-size:12px;color:var(--tx);font-variant-numeric:tabular-nums;width:22px;text-align:right;flex-shrink:0}
/* ══ GUIDE ════════════════════════════════════════════════════ */
.tc{padding:12px 16px;border-bottom:1px solid var(--bdr)}
.tterm{font-family:'Barlow Condensed',sans-serif;font-size:20px;font-weight:700}
.tfull{font-size:11px;color:var(--tx3);margin-left:6px}
.tdef{font-size:13px;color:var(--tx2);margin-top:4px;line-height:1.55}
.fq{padding:13px 16px;border-bottom:1px solid var(--bdr)}
.fqq{font-weight:600;font-size:14px;margin-bottom:4px}
.fqa{font-size:13px;color:var(--tx2);line-height:1.55}
/* ══ FORM ═════════════════════════════════════════════════════ */
.inp{background:var(--surf2);border:1.5px solid var(--bdr-s);color:var(--tx);border-radius:10px;padding:8px 12px;font-size:14px;font-family:inherit;transition:border-color .15s}
.inp:focus{outline:none;border-color:var(--acc)}
.btn{padding:8px 16px;border-radius:10px;border:none;font-family:inherit;font-size:13px;font-weight:600;cursor:pointer;transition:opacity .15s}
.btnp{background:var(--acc);color:#fff}
.btns{background:var(--surf2);color:var(--tx);border:1.5px solid var(--bdr-s)}
.btn:active{opacity:.75}
/* ══ PROGRESS ═════════════════════════════════════════════════ */
.pbar{height:3px;background:var(--surf2);overflow:hidden}
.pbf{height:100%;background:var(--acc);transition:width .35s cubic-bezier(.4,0,.2,1)}
.bon{font-size:11px;color:var(--yel);padding:4px 14px 5px;background:rgba(245,158,11,.07);border-bottom:1px solid var(--bdr)}
/* ══ SECTION LABEL ════════════════════════════════════════════ */
.slbl{font-size:10px;text-transform:uppercase;letter-spacing:.09em;color:var(--tx3);font-weight:600;padding:12px 16px 4px}
/* ══ PLAN SCREEN ══════════════════════════════════════════════ */
.nxt{margin:12px 14px;border-radius:var(--r);border:1px solid var(--bdr);background:var(--surf);overflow:hidden;position:relative}
.nxt::before{content:'';position:absolute;top:0;left:0;right:0;height:2px;background:var(--acc)}
.nxt-top{padding:14px 16px 12px;display:flex;align-items:center;gap:14px}
.nxt-dot{width:46px;height:46px;border-radius:13px;display:flex;align-items:center;justify-content:center;font-family:'Barlow Condensed',sans-serif;font-size:14px;font-weight:700;color:#fff;flex-shrink:0;line-height:1}
.nxt-lbl{font-size:10px;text-transform:uppercase;letter-spacing:.09em;color:var(--tx3);font-weight:600}
.nxt-nm{font-family:'Barlow Condensed',sans-serif;font-size:25px;font-weight:700;line-height:1.05;margin-top:2px;letter-spacing:-.01em}
.nxt-sub{font-size:12px;color:var(--tx2);margin-top:3px}
.nxt-act{padding:0 16px 14px}
.nxt-btn{width:100%;padding:13px;border:none;border-radius:11px;font-family:'Barlow Condensed',sans-serif;font-size:20px;font-weight:700;cursor:pointer;background:var(--acc);color:#fff;letter-spacing:.02em;transition:opacity .15s}
.nxt-btn:active{opacity:.85}
.nxt-rest{background:rgba(245,158,11,.1);border:1px solid rgba(245,158,11,.28);color:var(--yel);border-radius:11px;padding:10px 14px;font-size:13px;line-height:1.45}
.nxt-btn.ghost{background:var(--surf2);color:var(--tx2);border:1.5px solid var(--bdr-s);font-size:14px;padding:9px;margin-top:8px}

.cal-m{font-family:'Barlow Condensed',sans-serif;font-size:20px;font-weight:700}

.cal-nav:active{border-color:var(--acc);color:var(--acc)}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:3px;margin:0 14px}
.cal-dow{font-size:9px;color:var(--tx3);text-align:center;font-weight:600;padding-bottom:3px}
.cal-d{aspect-ratio:1;border-radius:8px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:11px;color:var(--tx2);border:1px solid transparent;font-variant-numeric:tabular-nums}

tr.wuset td{padding:5px 8px 5px 12px;border-top:1px solid var(--bdr);vertical-align:middle;opacity:.72}

.row-flash td{animation:setFlash .6s ease forwards}

#confetti-canvas{position:fixed;inset:0;pointer-events:none;z-index:500;display:none}
/* ══ PROGRESS ROW ═════════════════════════════════════════════ */
.prog-row{padding:7px 16px;display:flex;gap:10px;align-items:center;border-bottom:1px solid var(--bdr);background:var(--bg)}
.prog-sets{font-size:12px;color:var(--tx2)}
.prog-pct{font-size:13px;color:var(--acc);font-weight:700;font-variant-numeric:tabular-nums}
.prog-vol{font-size:12px;color:var(--tx3);margin-left:auto;font-variant-numeric:tabular-nums}

.wu-item:last-child{border-bottom:none}
.wu-dot{color:var(--acc);font-size:12px;flex-shrink:0;margin-top:2px}
.wu-name{font-size:14px;color:var(--tx);font-weight:500}
.wu-meta{font-size:11px;color:var(--tx3);margin-top:2px}
.wu-video-link{color:var(--acc);text-decoration:none;font-size:11px;background:none;border:none;padding:0;cursor:pointer;font-family:inherit;font-weight:500}
/* ══ ANATOMY ══════════════════════════════════════════════════ */
.anatomy-wrap{display:flex;justify-content:center;gap:14px;padding:6px 8px 10px}
.anatomy-fig{flex:1;max-width:150px}
.anatomy-lbl{font-size:9px;text-align:center;color:var(--tx3);margin-top:4px;text-transform:uppercase;letter-spacing:.07em;font-weight:600}
.vol-legend{display:grid;grid-template-columns:1fr 1fr;gap:5px 14px;padding:6px 16px 10px}
.vol-li{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--tx2)}
.vol-dot{width:9px;height:9px;border-radius:50%;flex-shrink:0}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

let SCR = 'today';
let SESS = null;   // active session
let CFG  = {week:1, repFloor4:false};
let SUBS = {};     // "dayId_exIdx" -> name
let TIMER = {on:false, rem:0, total:0, lbl:'', tid:null};

// ─── STORAGE ────────────────────────────────────────────────
function loadStorage(){
  try{CFG={...CFG,...JSON.parse(localStorage.getItem('ppl_cfg')||'{}')};}catch(e){}
  try{SUBS=JSON.parse(localStorage.getItem('ppl_subs')||'{}');}catch(e){}
  try{const s=localStorage.getItem('ppl_sess');if(s)SESS=JSON.parse(s);}catch(e){}
}
function saveCfg(){localStorage.setItem('ppl_cfg',JSON.stringify(CFG));}
function saveSubs(){localStorage.setItem('ppl_subs',JSON.stringify(SUBS));}
function saveSess(){
  if(SESS)localStorage.setItem('ppl_sess',JSON.stringify(SESS));
  else localStorage.removeItem('ppl_sess');
}
function allSessions(){try{return JSON.parse(localStorage.getItem('ppl_hist')||'[]');}catch(e){return[];}}
function pushToHistory(s){
  const hs=allSessions();
  const i=hs.findIndex(h=>h.date===s.date&&h.dayId===s.dayId);
  if(i>=0)hs[i]=s;else hs.unshift(s);
  localStorage.setItem('ppl_hist',JSON.stringify(hs));
}
function lastSession(dayId){return allSessions().find(s=>s.dayId===dayId&&s.completed);}

// ─── HELPERS ────────────────────────────────────────────────
function effEx(dayId,idx,week){
  const base=P.days[dayId].ex[idx];
  const ov=(P.weeks[String(week)]||{})[dayId]?.[String(idx)]||{};
  return{...base,...ov};
}
function subName(dayId,idx){
  const k=dayId+'_'+idx, ex=P.days[dayId].ex[idx];
  return SUBS[k]&&SUBS[k]!==ex.n?SUBS[k]:ex.n;
}
function subVideo(dayId,idx){
  const k=dayId+'_'+idx, ex=P.days[dayId].ex[idx];
  if(!SUBS[k]||SUBS[k]===ex.n)return ex.video;
  const si=ex.sub.indexOf(SUBS[k]);
  return si>=0&&ex.subVideo?.[si]?ex.subVideo[si]:ex.video;
}
function repDisplay(ex,si){
  if(ex.type==='perset'&&ex.perSetReps)return String(ex.perSetReps[Math.min(si,ex.perSetReps.length-1)]);
  if(ex.type==='amrap')return'AMRAP';
  if(ex.type==='hold')return'30s';
  let r=String(ex.reps||'');
  if(CFG.repFloor4){
    if(/^\d+$/.test(r)&&parseInt(r)<4)r='4';
    const m=r.match(/^(\d+)-(\d+)$/);
    if(m&&parseInt(m[1])<4)r=`4-${Math.max(4,parseInt(m[2]))}`;
  }
  return r;
}
function muscName(k){return P.muscleLabels[k]||k;}
function fmtTime(s){return`${Math.floor(s/60)}:${String(s%60).padStart(2,'0')}`;}
function dkey(y,m,d){return`${y}-${String(m+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;}
function todayStr(){const d=new Date();return dkey(d.getFullYear(),d.getMonth(),d.getDate());}
function daysBetween(a,b){return Math.round((new Date(b+'T12:00:00')-new Date(a+'T12:00:00'))/86400000);}
function fmtDate(d){if(!d)return'';return new Date(d+'T12:00:00').toLocaleDateString('th-TH',{day:'numeric',month:'short',year:'numeric'});}
function progression(lastSets,ex){
  if(!lastSets||!lastSets.length)return null;
  const last=lastSets[lastSets.length-1];
  if(!last||!last.weight||last.weight<=0)return null;
  const r=String(ex.reps||'');
  const m=r.match(/^(\d+)-(\d+)$/);
  if(m&&last.reps>=parseInt(m[2]))return last.weight+2.5;
  if(/^\d+$/.test(r)&&last.reps>=parseInt(r))return last.weight+2.5;
  return null;
}

// ─── AUDIO / HAPTIC ─────────────────────────────────────────
let AC=null;
function beep(f,d,v){
  try{
    if(!AC)AC=new(window.AudioContext||window.webkitAudioContext)();
    const o=AC.createOscillator(),g=AC.createGain();
    o.connect(g);g.connect(AC.destination);
    o.frequency.value=f||880;o.type='sine';
    g.gain.setValueAtTime(v||0.25,AC.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001,AC.currentTime+(d||0.2));
    o.start(AC.currentTime);o.stop(AC.currentTime+(d||0.2));
  }catch(e){}
}
function vibrate(p){try{navigator.vibrate?.(p);}catch(e){}}

// ─── REST TIMER ──────────────────────────────────────────────
function startRest(sec,lbl){
  if(sec<=0)return;
  stopTimer();
  TIMER={on:true,rem:sec,total:sec,lbl:lbl||'',tid:null};
  TIMER.tid=setInterval(()=>{
    TIMER.rem--;
    if(TIMER.rem<=0){
      TIMER.rem=0;stopTimer();
      beep(880,.1);setTimeout(()=>beep(880,.1),200);setTimeout(()=>beep(1100,.4),420);
      vibrate([200,100,200]);
    }else if(TIMER.rem<=3)beep(660,.08,.1);
    renderTimer();
  },1000);
  renderTimer();
}
function stopTimer(){
  if(TIMER.tid)clearInterval(TIMER.tid);
  TIMER={on:false,rem:0,total:0,lbl:'',tid:null};
  renderTimer();
}
function renderTimer(){
  const el=document.getElementById('tov');
  if(!TIMER.on){el.style.display='none';return;}
  el.style.display='flex';
  const pct=TIMER.rem/TIMER.total;
  const c=pct>.5?'#22c55e':pct>.25?'#eab308':'#ef4444';
  const circ=301.6,offset=circ*(1-pct);
  const fg=el.querySelector('.tring-fg');
  if(fg){fg.style.strokeDashoffset=offset;fg.style.stroke=c;const t=el.querySelector('.ttim');if(t){t.textContent=fmtTime(TIMER.rem);t.style.color=c;}return;}
  el.innerHTML=`<div class="tring-wrap"><svg class="tring-svg" viewBox="0 0 110 110"><circle cx="55" cy="55" r="48" class="tring-bg"/><circle cx="55" cy="55" r="48" class="tring-fg" style="stroke:${c};stroke-dashoffset:${offset}"/></svg><div class="tring-center"><div class="ttim" style="color:${c}">${fmtTime(TIMER.rem)}</div><div class="tlbl">${TIMER.lbl||'พัก'}</div></div></div><button class="tskp" onclick="stopTimer()">ข้ามพัก</button>`;
}
// ─── WARMUP INIT ─────────────────────────────────────────────
function initWarmupSets(ex,workingW){
  const wuStr=String(ex.wu||'0');
  if(wuStr==='0')return[];
  const n=parseInt(wuStr.split('-')[0]);
  if(!n||isNaN(n))return[];
  const rule=P.warmupCalc.rules.find(r=>r.warmupSets===n)||P.warmupCalc.rules.find(r=>r.warmupSets===Math.max(1,Math.min(n,4)));
  if(!rule)return[];
  return rule.steps.map((step,i)=>({weight:workingW>0?Math.round(workingW*step.pct/100/2.5)*2.5:0,reps:null,done:false,isWarmup:true,pct:step.pct,repsHint:step.reps,label:'W'+(i+1)}));
}
// ─── CONFETTI ────────────────────────────────────────────────
function launchConfetti(){
  const canvas=document.getElementById('confetti-canvas');if(!canvas)return;
  canvas.style.display='block';canvas.width=innerWidth;canvas.height=innerHeight;
  const ctx=canvas.getContext('2d');
  const ps=Array.from({length:90},()=>({x:Math.random()*canvas.width,y:-10-Math.random()*80,vx:(Math.random()-.5)*4,vy:Math.random()*4+2,r:Math.random()*6+3,color:['#f97316','#22c55e','#3b82f6','#a855f7','#fbbf24','#ef4444','#fff'][Math.floor(Math.random()*7)],rot:Math.random()*360,rv:(Math.random()-.5)*8,life:1}));
  let fr;const draw=()=>{ctx.clearRect(0,0,canvas.width,canvas.height);let alive=false;ps.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.vy+=.08;p.rot+=p.rv;p.life-=.006;if(p.life<=0||p.y>canvas.height)return;alive=true;ctx.save();ctx.globalAlpha=Math.max(0,p.life);ctx.translate(p.x,p.y);ctx.rotate(p.rot*Math.PI/180);ctx.fillStyle=p.color;ctx.fillRect(-p.r,-p.r/2,p.r*2,p.r);ctx.restore();});if(alive)fr=requestAnimationFrame(draw);else{canvas.style.display='none';}};cancelAnimationFrame(fr);draw();
}

// ─── HOLD TIMER ──────────────────────────────────────────────
function startHold(ei,si){
  const k=ei+'_'+si;
  if(HOLDS[k]?.running)return;
  HOLDS[k]={rem:30,running:true,done:false};
  const tick=()=>{
    if(!HOLDS[k]||!HOLDS[k].running)return;
    HOLDS[k].rem--;
    const el=document.getElementById('hld_'+k);
    if(HOLDS[k].rem<=0){
      HOLDS[k]={rem:0,running:false,done:true};
      beep(880,.2);vibrate([150,100,150]);
      if(el)el.innerHTML='<span style="color:var(--grn);font-weight:600">✓ เสร็จ</span>';
    }else{
      if(el)el.innerHTML=`<span class="htick">${HOLDS[k].rem}s</span>`;
      setTimeout(tick,1000);
    }
  };
  setTimeout(tick,1000);
  const el=document.getElementById('hld_'+k);
  if(el)el.innerHTML=`<span class="htick">30s</span>`;
}

// ─── SESSION ─────────────────────────────────────────────────
function startSession(dayId){
  const day=P.days[dayId];
  const last=lastSession(dayId);
  let topSetWeights=[];
  const exercises=day.ex.map((baseEx,idx)=>{
    const ex=effEx(dayId,idx,CFG.week);
    const lastEx=last?.exercises?.[idx];
    const lastSets=lastEx?.sets||[];
    const lastW=lastSets[0]?.weight||0;
    let sugW=lastW;
    const prog=progression(lastSets,ex);
    if(prog!==null)sugW=prog;
    // back-off: use % of previous exercise's top set weight
    if(ex.backoffPct&&topSetWeights.length>0){
      const top=topSetWeights[topSetWeights.length-1];
      if(top>0){const calc=Math.round(top*ex.backoffPct/100/2.5)*2.5;sugW=calc;}
    }
    const sets=[];
    for(let i=0;i<ex.ws;i++)sets.push({weight:sugW,reps:null,done:false});
    if(ex.type==='dropset'){
      const dw=sugW>0?Math.round(sugW*(1-(ex.dropPct||40)/100)/2.5)*2.5:0;
      sets[0].dropWeight=dw;sets[0].dropReps=null;
    }
    topSetWeights.push(sugW);
    return{
      baseIdx:idx,
      name:subName(dayId,idx),
      suggested:(prog!==null&&lastW>0&&prog!==lastW)?prog:null,
      sets,
      warmupSets:initWarmupSets(ex,sugW)
    };
  });
  SESS={date:todayStr(),dayId,week:CFG.week,exercises,completed:false};
  HOLDS={};
  saveSess();render();
}
function finishSession(){
  if(!SESS)return;
  SESS.completed=true;
  const snap=SESS;
  pushToHistory(snap);
  launchConfetti();
  beep(880,.08);setTimeout(()=>beep(1100,.08),150);setTimeout(()=>beep(1320,.4),300);
  vibrate([100,50,100,50,300]);
  SESS=null;saveSess();stopTimer();
  renderCelebration(snap);
}

}

// ─── TODAY: WORKOUT ──────────────────────────────────────────

  const day=P.days[s.dayId];
  const total=s.exercises.reduce((a,e)=>a+e.sets.length,0);
  const done=s.exercises.reduce((a,e)=>a+e.sets.filter(x=>x.done).length,0);

  const isLeg=s.dayId==='legs'||s.dayId==='full';
  const wuItems=P.generalWarmup.items.filter(i=>!i.legDayOnly||isLeg)
    .map(i=>{const vid=WU_VIDEOS[i.name];const vl=vid?` · <button class="wu-video-link" onclick="window.open('${vid}','_blank','noopener')">▶ วิดีโอ</button>`:'';return`<div class="wu-item"><span class="wu-dot">•</span><div><div class="wu-name">${i.name}${i.optional?' <span style="font-size:10px;color:var(--tx3)">(ทางเลือก)</span>':''}</div><div class="wu-meta">${i.repsTime}${vl}</div></div></div>`;}).join('');
  const deload=P.weeks[String(s.week)]?.deload;

    <button class="bbtn" onclick="cancelSession()">✕</button>
    <div><div class="set">${day.name} · ${day.th}</div><div class="sew">W${s.week} · ${fmtDate(s.date)}</div></div>
    <button class="fbtn" onclick="finishSession()">จบ ✓</button>
  </div>
  <div class="pbar"><div class="pbf" style="width:${pct}%"></div></div>
  <div class="prog-row">
    <span class="prog-sets">${done}/${total} เซ็ต</span>

    <span class="prog-vol" id="sess-vol">— kg</span>
  </div>
  ${deload?`<div class="dlnote" style="margin-top:0">⚠️ Deload — ลดน้ำหนัก ห้ามดันถึงหมดแรง</div>`:''}
  <details style="margin:4px 12px 4px;background:var(--surf);border:1px solid var(--bdr);border-radius:var(--r)">
    <summary style="padding:8px 12px;font-size:12px;color:var(--tx2);cursor:pointer;list-style:none;user-select:none">▸ วอร์มอัพทั่วไป</summary>
    <div style="padding:6px 12px 10px">${wuItems}</div>
  </details>
  ${cards}
  <div style="padding:14px 12px 4px">
    <button class="btn btnp" style="width:100%;font-family:'Barlow Condensed',sans-serif;font-size:18px;font-weight:700;padding:11px" onclick="finishSession()">จบซ้อม ✓</button>
  </div>`;
}

function buildCard(ei){
  const s=SESS;
  const el=s.exercises[ei];
  const ex=effEx(s.dayId,el.baseIdx,s.week);
  const vid=subVideo(s.dayId,el.baseIdx);
  const badgeMap={normal:['bn','Normal'],feeder:['bf','Feeder'],dropset:['bd','Drop 10+5'],mechdrop:['bm','Mech Drop 8+8'],hold:['bh','Hold 30s'],amrap:['ba','AMRAP'],perset:['bp','Per-set']};
  const [bc,bl]=badgeMap[ex.type]||['bn',ex.type];
  const isSSfirst=ex.superset&&!el.name.includes('A2')&&el.name.includes('A1');
  const isSSsecond=ex.superset&&el.name.includes('A2');
  const cls='exc'+(isSSfirst?' ss1':isSSsecond?' ss2':'');
  const boHtml=ex.backoffPct?`<div class="bon">↓ Back-off: ${ex.backoffPct}% ของ top set (${ex.th})</div>`:'';
  const mdHtml=ex.type==='mechdrop'?`<div style="font-size:11px;color:var(--blu);padding:3px 12px 4px;border-bottom:1px solid var(--bdr)">${ex.th}</div>`:'';
  const sugHtml=el.suggested?`<div class="sug">↑ เพิ่มเป็น ${el.suggested}kg จากสัปดาห์ก่อน</div>`:'';
  const subBtn=ex.sub.length>0?`<button class="sub-btn" title="เปลี่ยนท่า" onclick="openSub(${ei})"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 1l4 4-4 4"/><path d="M3 11V9a4 4 0 0 1 4-4h14"/><path d="M7 23l-4-4 4-4"/><path d="M21 13v2a4 4 0 0 1-4 4H3"/></svg></button>`:'' ;
  const ssBadge=ex.superset?`<span class="bdg bs">${ex.superset}</span>`:'';

  // PR detection
  const lastSess=lastSession(SESS.dayId);
  const lastEx=lastSess?.exercises?.find(e=>e.baseIdx===el.baseIdx||e.name===el.name);
  const lastTopW=lastEx?.sets?.filter(s=>s.done).reduce((m,s)=>Math.max(m,s.weight||0),0)||0;

  // Warmup rows
  let wuRowsHtml='';
  if(el.warmupSets&&el.warmupSets.length){
    const wuRows=el.warmupSets.map((ws,wsi)=>`<tr class="wuset${ws.done?' wudone':''}" id="wurow_${ei}_${wsi}">
      <td class="wusn">${ws.label}</td>
      <td><div class="wc"><button class="ab" onclick="adjWuW(${ei},${wsi},-2.5)">−</button><input class="wi" type="number" id="wuw_${ei}_${wsi}" value="${ws.weight||0}" step="2.5" min="0" inputmode="decimal" oninput="setWuWeight(${ei},${wsi},this.value)" style="font-size:13px"><button class="ab" onclick="adjWuW(${ei},${wsi},2.5)">+</button></div></td>
      <td><span style="font-size:12px;color:var(--tx3)">${ws.repsHint||'—'}</span><div style="font-size:10px;color:var(--tx3);margin-top:1px">${ws.pct}%</div></td>
      <td class="sd"><button class="db${ws.done?' done':''}" onclick="markWuDone(${ei},${wsi})"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg></button></td>
    </tr>`).join('');
    wuRowsHtml=`<tr class="wu-sep"><td colspan="4">วอร์มอัพ ${el.warmupSets.length} เซ็ต</td></tr>${wuRows}<tr class="wu-sep"><td colspan="4">เซ็ตจริง</td></tr>`;
  }

  let tableHtml='';
  if(ex.type==='hold'){
    const rows=el.sets.map((set,si)=>{
      const k=ei+'_'+si, hd=HOLDS[k];
      let hcon=hd?.done?'<span style="color:var(--grn);font-weight:600">✓ เสร็จ</span>':hd?.running?`<span class="htick">${hd.rem}s</span>`:`<button class="hbtn" onclick="startHold(${ei},${si})">▶ 30s</button>`;
      return`<tr class="${set.done?'dc':''}"><td class="sn">${si+1}</td><td colspan="2" id="hld_${k}" style="padding:7px 12px">${hcon}</td><td class="sd">${doneBtn(ei,si,set.done)}</td></tr>`;
    }).join('');
    tableHtml=`<table class="st"><thead><tr><th>#</th><th colspan="2">เป้าหมาย</th><th></th></tr></thead><tbody>${wuRowsHtml}${rows}</tbody></table>`;
  } else if(ex.type==='dropset'){
    const set=el.sets[0],rt=repDisplay(ex,0),dw=set.dropWeight??0,isPR=lastTopW>0&&set.weight>lastTopW&&set.done;
    tableHtml=`<table class="st"><thead><tr><th>#</th><th>น้ำหนัก (kg)</th><th>ครั้ง</th><th></th></tr></thead><tbody>${wuRowsHtml}
      <tr class="${set.done?'dc':''}" id="srow_${ei}_0"><td class="sn">1${isPR?'<span class="pr-badge" style="display:block;margin-top:1px">PR</span>':''}</td><td>${weightCell(ei,0,set.weight,false)}</td><td><input class="ri" type="number" value="${set.reps??''}" placeholder="${rt}" min="0" inputmode="numeric" oninput="setReps(${ei},0,this.value)"><div class="rt">เป้า ${rt}</div></td><td class="sd">${doneBtn(ei,0,set.done)}</td></tr>
      <tr style="background:rgba(248,81,73,.05)"><td class="sn" style="color:var(--red)">↓</td><td>${weightCell(ei,0,dw,true)}</td><td><input class="ri" type="number" value="${set.dropReps??''}" placeholder="+5" min="0" inputmode="numeric" oninput="SESS.exercises[${ei}].sets[0].dropReps=parseInt(this.value)||0;saveSess()"><div class="rt">Drop +5</div></td><td></td></tr>
    </tbody></table>`;
  } else {
    const rows=el.sets.map((set,si)=>{
      const rt=repDisplay(ex,si);
      const frpe=ex.type==='feeder'&&ex.feederRPE?`<span class="frpe">RPE ${ex.feederRPE[si]}</span>`:`<span style="font-size:10px;color:var(--tx3)">RPE ${ex.rpe}</span>`;
      const isPR=lastTopW>0&&set.weight>lastTopW&&set.done;
      return`<tr class="${set.done?'dc':''}" id="srow_${ei}_${si}"><td class="sn">${si+1}${isPR?'<span class="pr-badge" style="display:block;margin-top:1px">PR</span>':''}</td><td>${weightCell(ei,si,set.weight,false)}</td><td><input class="ri" type="number" value="${set.reps??''}" placeholder="${rt}" min="0" inputmode="numeric" oninput="setReps(${ei},${si},this.value)"><div class="rt">เป้า ${rt}</div>${frpe}</td><td class="sd">${doneBtn(ei,si,set.done)}</td></tr>`;
    }).join('');
    tableHtml=`<table class="st"><thead><tr><th>#</th><th>น้ำหนัก (kg)</th><th>ครั้ง / RPE</th><th></th></tr></thead><tbody>${wuRowsHtml}${rows}</tbody></table>`;
  }

  return`<div class="${cls}" id="exc_${ei}">
    <div class="exh">
      <div class="exn">
        <div style="display:flex;gap:5px;flex-wrap:wrap;margin-bottom:4px">${ssBadge}<span class="bdg ${bc}">${bl}</span></div>
        <a class="exnm" href="${vid||'#'}" target="_blank" ${!vid?'onclick="return false"':''}>${el.name}</a>
        ${!ex.backoffPct&&ex.type!=='mechdrop'?`<div class="exmeta">${ex.th}</div>`:''}
      </div>
      <div style="display:flex;gap:6px;align-items:center;flex-shrink:0">${subBtn}</div>
    </div>
    ${boHtml}${mdHtml}${sugHtml}${tableHtml}
  </div>`;
}

function weightCell(ei,si,val,isDrop){
  const id=(isDrop?'dw':'w')+'_'+ei+'_'+si;
  const oc=isDrop?`SESS.exercises[${ei}].sets[${si}].dropWeight=Math.max(0,parseFloat(this.value)||0);saveSess()`:`setWeight(${ei},${si},this.value)`;
  return`<div class="wc"><button class="ab" onclick="adjW(${ei},${si},-2.5,${isDrop})">−</button><input class="wi" type="number" id="${id}" value="${val||0}" step="2.5" min="0" inputmode="decimal" oninput="${oc}"><button class="ab" onclick="adjW(${ei},${si},2.5,${isDrop})">+</button></div>`;
}
function doneBtn(ei,si,done){
  return`<button class="db${done?' done':''}" onclick="markDone(${ei},${si})"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg></button>`;
}

// ─── SET ACTIONS ─────────────────────────────────────────────
function setWuWeight(ei,wsi,v){if(!SESS||!SESS.exercises[ei].warmupSets)return;SESS.exercises[ei].warmupSets[wsi].weight=Math.max(0,parseFloat(v)||0);saveSess();}
function adjWuW(ei,wsi,d){if(!SESS||!SESS.exercises[ei].warmupSets)return;const ws=SESS.exercises[ei].warmupSets[wsi];ws.weight=Math.max(0,Math.round(((ws.weight||0)+d)/2.5)*2.5);const el=document.getElementById('wuw_'+ei+'_'+wsi);if(el)el.value=ws.weight;saveSess();}
function markWuDone(ei,wsi){if(!SESS||!SESS.exercises[ei].warmupSets)return;const ws=SESS.exercises[ei].warmupSets[wsi];ws.done=!ws.done;saveSess();vibrate(ws.done?[30]:[15]);const card=document.getElementById('exc_'+ei);if(card){const n=document.createElement('div');n.innerHTML=buildCard(ei);card.replaceWith(n.firstChild);}}
function setWeight(ei,si,v){if(!SESS)return;SESS.exercises[ei].sets[si].weight=Math.max(0,parseFloat(v)||0);saveSess();}
function adjW(ei,si,d,isDrop){
  if(!SESS)return;
  const set=SESS.exercises[ei].sets[si];
  if(isDrop){
    set.dropWeight=Math.max(0,Math.round(((set.dropWeight||0)+d)/2.5)*2.5);
    const el=document.getElementById('dw_'+ei+'_'+si);
    if(el)el.value=set.dropWeight;
  }else{
    set.weight=Math.max(0,Math.round(((set.weight||0)+d)/2.5)*2.5);
    const el=document.getElementById('w_'+ei+'_'+si);
    if(el)el.value=set.weight;
  }
  saveSess();
}
function setReps(ei,si,v){if(!SESS)return;SESS.exercises[ei].sets[si].reps=parseInt(v)||0;saveSess();}
function markDone(ei,si){
  if(!SESS)return;
  const set=SESS.exercises[ei].sets[si];
  set.done=!set.done;
  saveSess();
  vibrate(set.done?[40,20,80]:[20]);
  if(set.done){
    beep(660,.06,.12);
    const ex=effEx(SESS.dayId,SESS.exercises[ei].baseIdx,SESS.week);
    if(ex.rest>0)startRest(ex.rest,SESS.exercises[ei].name);
  }
  const card=document.getElementById('exc_'+ei);
  if(card){
    const n=document.createElement('div');n.innerHTML=buildCard(ei);
    const nc=n.firstChild;card.replaceWith(nc);
    if(set.done){const row=nc.querySelector('#srow_'+ei+'_'+si);if(row)row.classList.add('row-flash');}
  }
  const total=SESS.exercises.reduce((a,e)=>a+e.sets.length,0);
  const done=SESS.exercises.reduce((a,e)=>a+e.sets.filter(x=>x.done).length,0);
  const pct=total?Math.round(done/total*100):0;
  const pb=document.querySelector('.pbf');if(pb)pb.style.width=pct+'%';
  const ps=document.querySelector('.prog-sets');if(ps)ps.textContent=done+'/'+total+' เซ็ต';
  const pp=document.querySelector('.prog-pct');if(pp)pp.textContent=pct+'%';
  const vol=SESS.exercises.reduce((a,e)=>a+(e.sets?.reduce((b,x)=>b+(x.done?(x.weight||0)*(x.reps||1):0),0)||0),0);
  const vv=document.getElementById('sess-vol');if(vv)vv.textContent=vol>0?vol.toFixed(0)+' kg vol':'— kg';
  if(set.done){
    setTimeout(()=>{
      let found=null;
      for(let e=ei;e<SESS.exercises.length&&!found;e++){
        const ex2=SESS.exercises[e];
        for(let s=(e===ei?si+1:0);s<ex2.sets.length;s++){if(!ex2.sets[s].done){found='srow_'+e+'_'+s;break;}}
      }
      if(found){const el=document.getElementById(found);el?.scrollIntoView({behavior:'smooth',block:'center'});}
    },350);
  }
}

// ─── PLAN ────────────────────────────────────────────────────
const DAYC={legs:'var(--dl)',push:'var(--dp)',pull:'var(--du)',full:'var(--df)'};
const DAYS_SHORT={legs:'Legs',push:'Push',pull:'Pull',full:'Full'};
const CYCLE=[{d:'legs'},{d:'push'},{d:'pull'},{r:1},{d:'full'},{r:1},{r:2}];
function gapAfter(dayId){return(dayId==='pull'||dayId==='full')?2:1;}

function nextUp(){
  const order=P.schedule.order;
  const hist=allSessions().filter(s=>s.completed).sort((a,b)=>b.date.localeCompare(a.date));
  if(!hist.length)return{dayId:order[0],last:null,since:null,gap:0,ready:true,week:CFG.week};
  const last=hist[0];
  const li=order.indexOf(last.dayId);
  const dayId=order[(li+1)%order.length];
  const week=li===order.length-1?Math.min(6,(last.week||1)+1):(last.week||1);
  const since=daysBetween(last.date,todayStr());
  const gap=gapAfter(last.dayId);
  return{dayId,last,since,gap,ready:since>=gap,week};
}

function renderPlan(){
  const nx=nextUp(),order=P.schedule.order;
  const day=P.days[nx.dayId];
  const hist=allSessions().filter(s=>s.completed);
  if(!CALM){const d=new Date();CALM={y:d.getFullYear(),m:d.getMonth()};}

  let statusHtml;
  if(!nx.last){
    statusHtml=`<button class="nxt-btn" onclick="planStart('${nx.dayId}',${nx.week})">เริ่มซ้อมวันแรก</button>`;
  }else if(nx.since===0){
    statusHtml=`<div class="nxt-rest">✓ ซ้อม ${P.days[nx.last.dayId].name} ไปแล้ววันนี้ — พักได้เลย<br>ถัดไป: <strong>${day.name}</strong></div><button class="nxt-btn ghost" onclick="planStart('${nx.dayId}',${nx.week})">ซ้อม ${day.name} เลย</button>`;
  }else if(!nx.ready){
    const left=nx.gap-nx.since;
    statusHtml=`<div class="nxt-rest">😴 <strong>วันนี้พัก</strong> — เหลืออีก ${left} วัน (${nx.since}/${nx.gap})</div><button class="nxt-btn ghost" onclick="planStart('${nx.dayId}',${nx.week})">ข้ามพัก ซ้อมเลย</button>`;
  }else{
    const late=nx.since>nx.gap+2?`<div style="font-size:12px;color:var(--yel);margin-bottom:7px">ห่างจากครั้งล่าสุด ${nx.since} วันแล้ว</div>`:'';
    statusHtml=`${late}<button class="nxt-btn" onclick="planStart('${nx.dayId}',${nx.week})">เริ่มซ้อม ${day.name}</button>`;
  }
  const nxCard=`<div class="nxt"><div class="nxt-top"><div class="nxt-dot" style="background:${DAYC[nx.dayId]}">${DAYS_SHORT[nx.dayId]}</div><div style="flex:1;min-width:0"><div class="nxt-lbl">${nx.ready||!nx.last?'ถัดไป':'พักอยู่'}</div><div class="nxt-nm">${day.name}</div><div class="nxt-sub">${day.th} · สัปดาห์ ${nx.week}${nx.last?' · ล่าสุด '+fmtDate(nx.last.date):''}</div></div></div><div class="nxt-act">${statusHtml}</div></div>`;

  const curIdx=(()=>{if(!nx.last)return 0;const li=CYCLE.findIndex(c=>c.d===nx.last.dayId);if(nx.ready)return CYCLE.findIndex(c=>c.d===nx.dayId);return Math.min(li+nx.since,CYCLE.length-1);})();
  const cycHtml=CYCLE.map((c,i)=>{const on=i===curIdx?' now':'';if(c.r)return`<div class="cyc-i rest${on}"><div class="cyc-b" style="background:var(--bdr)"></div><div class="cyc-t">Rest</div></div>`;return`<div class="cyc-i${on}"><div class="cyc-b" style="background:${DAYC[c.d]}"></div><div class="cyc-t">${DAYS_SHORT[c.d]}</div></div>`;}).join('');

  const doneMap={};hist.forEach(s=>{doneMap[(s.week||1)+'_'+s.dayId]=s;});
  let pgHtml=`<div class="pg-h"></div>`+order.map(id=>`<div class="pg-h" style="color:${DAYC[id]}">${DAYS_SHORT[id]}</div>`).join('');
  for(let w=1;w<=6;w++){
    pgHtml+=`<div class="pg-w">W${w}</div>`;
    order.forEach(id=>{const s=doneMap[w+'_'+id];const cur=(w===nx.week&&id===nx.dayId&&nx.ready)?' cur':'';pgHtml+=s?`<div class="pg-c on${cur}" style="background:${DAYC[id]}" onclick="showSessDetail('${s.date}','${id}')" title="${fmtDate(s.date)}">✓</div>`:`<div class="pg-c${cur}" onclick="planStart('${id}',${w})">${w===6?'☾':'·'}</div>`;});
  }

  const doneCount=hist.length;
  const streak=(()=>{const dates=[...new Set(hist.map(s=>s.date))].sort().reverse();if(!dates.length)return 0;let n=1;for(let i=1;i<dates.length;i++){if(daysBetween(dates[i],dates[i-1])<=3)n++;else break;}return n;})();

  return`<div class="ph"><h1>แผนการซ้อม</h1><p>Phase 1 · Base Hypertrophy · 6 สัปดาห์</p></div>
  ${nxCard}
  <div class="slbl">รอบการซ้อม</div>
  <div class="cyc">${cycHtml}</div>
  <div style="padding:4px 14px 0;font-size:11px;color:var(--tx3);line-height:1.5">${P.schedule.restRule_th}</div>
  <div class="slbl">ความคืบหน้า Phase 1</div>
  <div class="stats">
    <div class="stat"><div class="stat-n" style="color:var(--acc)">${doneCount}<span style="font-size:13px;color:var(--tx3)">/24</span></div><div class="stat-l">ซ้อมแล้ว</div></div>
    <div class="stat"><div class="stat-n">${Math.round(doneCount/24*100)}%</div><div class="stat-l">ของ Phase</div></div>
    <div class="stat"><div class="stat-n" style="color:${streak>1?'var(--grn)':'var(--tx)'}">${streak}</div><div class="stat-l">ต่อเนื่อง</div></div>
  </div>
  <div class="pg" style="margin-top:9px">${pgHtml}</div>
  <div style="padding:4px 14px 0;font-size:11px;color:var(--tx3)">กดช่องว่างเพื่อเริ่มซ้อมวันนั้น · ☾ = deload</div>
  <div class="slbl">ปฏิทิน</div>
  ${renderCal()}
  <div class="lg">${order.map(id=>`<div class="lg-i"><div class="lg-d" style="background:${DAYC[id]}"></div>${P.days[id].name}</div>`).join('')}</div>
  <div style="height:20px"></div>`;
}

function renderCal(){
  const {y,m}=CALM;
  const byDate={};
  allSessions().filter(s=>s.completed).forEach(s=>{(byDate[s.date]=byDate[s.date]||[]).push(s);});
  const first=new Date(y,m,1);
  const startDow=(first.getDay()+6)%7;
  const dim=new Date(y,m+1,0).getDate();
  const today=todayStr();
  const mLabel=first.toLocaleDateString('th-TH',{month:'long',year:'numeric'});
  let cells=['จ','อ','พ','พฤ','ศ','ส','อา'].map(d=>`<div class="cal-dow">${d}</div>`).join('');
  for(let i=0;i<startDow;i++)cells+=`<div class="cal-d pad"></div>`;
  for(let d=1;d<=dim;d++){
    const key=dkey(y,m,d);const ss=byDate[key]||[];
    const dots=ss.map(s=>`<div class="cal-dot" style="background:${DAYC[s.dayId]||'var(--tx3)'}"></div>`).join('');
    const cls=`cal-d${ss.length?' has':''}${key===today?' today':''}`;
    const click=ss.length?` onclick="showSessDetail('${ss[0].date}','${ss[0].dayId}')"`:'';
    cells+=`<div class="${cls}"${click}><span>${d}</span><div class="cal-dots">${dots}</div></div>`;
  }
  return`<div class="cal-h"><button class="cal-nav" onclick="calMove(-1)">‹</button><div class="cal-m">${mLabel}</div><button class="cal-nav" onclick="calMove(1)">›</button></div><div class="cal">${cells}</div>`;
}
function calMove(d){const nm=CALM.m+d;CALM={y:CALM.y+Math.floor(nm/12),m:((nm%12)+12)%12};render();}
function planStart(dayId,week){
  if(SESS&&!confirm('มีการซ้อมค้างอยู่ — เริ่มใหม่จะทับของเดิม?'))return;
  if(week){CFG.week=week;saveCfg();}
  goNav('today');startSession(dayId);
}

// ─── HISTORY ─────────────────────────────────────────────────
function renderHistory(){
  const sessions=allSessions().filter(s=>s.completed);
  if(!sessions.length)return`<div class="ph"><h1>ประวัติ</h1></div><div class="empty"><h3>ยังไม่มีประวัติ</h3><p>เริ่มซ้อมเลย!</p></div>`;
  const expRow=`<div style="display:flex;gap:8px;padding:10px 12px">
    <button class="btn btns" onclick="exportData()">↑ Export JSON</button>
    <label class="btn btns" style="cursor:pointer">↓ Import JSON<input type="file" accept=".json" style="display:none" onchange="handleImport(event)"></label>
  </div>`;
  const rows=sessions.map(s=>{
    const day=P.days[s.dayId];
    const totalSets=s.exercises?.reduce((a,e)=>a+(e.sets?.length||0),0)||0;
    const doneVol=s.exercises?.reduce((a,e)=>a+(e.sets?.reduce((b,x)=>b+(x.done?(x.weight||0)*(x.reps||0):0),0)||0),0)||0;
    return`<div class="hs" onclick="showSessDetail('${s.date}','${s.dayId}')">
      <div class="hd">${fmtDate(s.date)} · W${s.week}</div>
      <div class="hn">${day?.name||s.dayId} · ${day?.th||''}</div>
      <div class="hst">${totalSets} เซ็ต · ${doneVol.toFixed(0)} kg volume</div>
    </div>`;
  }).join('');
  return`<div class="ph"><h1>ประวัติ</h1><p>${sessions.length} session</p></div>${expRow}${rows}`;
}
function showSessDetail(date,dayId){
  const s=allSessions().find(x=>x.date===date&&x.dayId===dayId);
  if(!s)return;
  const day=P.days[dayId];
  const rows=s.exercises?.map(ex=>{
    const sets=ex.sets?.filter(x=>x.done).map(x=>`${x.weight}×${x.reps||'?'}`).join(', ')||'—';
    return`<div style="padding:8px 14px;border-bottom:1px solid var(--bdr)"><div style="font-family:'Barlow Condensed',sans-serif;font-size:16px;font-weight:700">${ex.name}</div><div style="font-size:12px;color:var(--tx2)">${sets}</div></div>`;
  }).join('')||'';
  document.getElementById('modal').innerHTML=`<div class="modal-wrap">
    <div class="modal-bd" onclick="closeModal()"></div>
    <div class="modal-sh" style="max-height:80dvh;overflow-y:auto">
      <div style="font-family:'Barlow Condensed',sans-serif;font-size:20px;font-weight:700;margin-bottom:10px">${day?.name} · ${fmtDate(date)}</div>
      ${rows}
      <button class="sopt" style="color:var(--tx3);margin-top:8px" onclick="closeModal()">ปิด</button>
    </div>
  </div>`;
}
function exportData(){
  const data={sessions:allSessions(),cfg:CFG,subs:SUBS};
  const b=new Blob([JSON.stringify(data,null,2)],{type:'application/json'});
  const u=URL.createObjectURL(b);
  const a=document.createElement('a');a.href=u;a.download=`ppl-backup-${todayStr()}.json`;a.click();URL.revokeObjectURL(u);
}
function handleImport(e){
  const f=e.target.files[0];if(!f)return;
  const r=new FileReader();
  r.onload=ev=>{try{const d=JSON.parse(ev.target.result);if(d.sessions)localStorage.setItem('ppl_hist',JSON.stringify(d.sessions));if(d.cfg){CFG={...CFG,...d.cfg};saveCfg();}if(d.subs){SUBS=d.subs;saveSubs();}render();alert('นำเข้าสำเร็จ');}catch(err){alert('ไฟล์ไม่ถูกต้อง');}};
  r.readAsText(f);
}

  </div>

    <h2 style="font-family:'Barlow Condensed',sans-serif;font-size:19px;font-weight:700;margin-bottom:8px">เครื่องคิดวอร์ม</h2>

function calcPlates(){
  const t=parseFloat(document.getElementById('pt')?.value)||0;
  const res=document.getElementById('pr');if(!res)return;
  if(t<=20){res.innerHTML='<span style="color:var(--tx3);font-size:13px">ใส่แค่บาร์ (20 kg)</span>';return;}
  const per=(t-20)/2;
  const sizes=[20,15,10,5,2.5,1.25];
  const cls={20:'pl p20',15:'pl p15',10:'pl p10',5:'pl p5',2.5:'pl p25',1.25:'pl p125'};
  let rem=per,html='';
  sizes.forEach(p=>{
    const n=Math.floor(rem/p+0.001);
    if(n>0){rem=Math.round((rem-n*p)*1000)/1000;for(let i=0;i<n;i++)html+=`<div class="${cls[p]}">${p}</div>`;}
  });
  if(rem>0.01)html+=`<span style="color:var(--red);font-size:12px">ไม่ลงตัว</span>`;
  html+=`<span style="font-size:11px;color:var(--tx3);align-self:center;margin-left:4px">ต่อด้าน</span>`;
  res.innerHTML=html;
}

function calcWarmup(){
  const w=parseFloat(document.getElementById('ww')?.value)||0;
  const n=parseInt(document.getElementById('ws')?.value)||3;
  const res=document.getElementById('wr');if(!res)return;
  if(w<=0){res.innerHTML='';return;}
  const rule=P.warmupCalc.rules.find(r=>r.warmupSets===n);
  if(!rule)return;
  const rows=rule.steps.map((step,i)=>{
    const wkg=Math.round(w*step.pct/100/2.5)*2.5;
    return`<tr><td style="padding:5px 8px 5px 0;color:var(--tx2);font-size:13px">เซ็ต ${i+1}</td><td style="padding:5px 8px;font-size:15px;font-weight:600;font-variant-numeric:tabular-nums">${wkg} kg</td><td style="padding:5px 0;font-size:11px;color:var(--tx3)">${step.pct}% · ${step.reps}</td></tr>`;
  }).join('');
  res.innerHTML=`<table style="border-collapse:collapse">${rows}</table><div style="font-size:11px;color:var(--tx3);margin-top:5px">${P.warmupCalc.note_th}</div>`;
}

// ─── GUIDE ───────────────────────────────────────────────────
function renderGuide(){
  const terms=P.keyTerms.map(t=>`<div class="tc"><div style="display:flex;align-items:baseline;gap:6px"><span class="tterm">${t.term}</span>${t.full?`<span class="tfull">${t.full}</span>`:''}</div><div class="tdef">${t.th}</div></div>`).join('');
  const faqs=P.faq.map(f=>`<div class="fq"><div class="fqq">${f.q_th}</div><div class="fqa">${f.a_th}</div></div>`).join('');
  const prog=P.progression.rules_th.map(r=>`<div style="display:flex;gap:7px;padding:6px 0;border-bottom:1px solid var(--bdr)"><span style="color:var(--acc);flex-shrink:0">•</span><span style="font-size:13px;color:var(--tx2);line-height:1.5">${r}</span></div>`).join('');
  return`<div class="ph"><h1>คู่มือ</h1><p>PPL 4x · Jeff Nippard · Phase 1 W1-6</p></div>
  <div style="padding:8px 14px 4px;font-size:13px;color:var(--tx2);line-height:1.5">${P.schedule.restRule_th}</div>

  <div class="slbl">Progressive Overload</div>
  <div style="padding:0 14px 10px">${prog}</div>

  <div class="slbl">FAQ</div>
  ${faqs}

  <div class="slbl">คำศัพท์</div>
  ${terms}
  <div style="height:20px"></div>`;
}

// ─── INIT ────────────────────────────────────────────────────
loadStorage();
render();
</script>
</body>
</html>
