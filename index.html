<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0d1117">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>PPL 4x</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Inter:wght@400;500;600&display=swap">
<style>
:root{
  --bg:#0d1117;--bg2:#161b22;--surf:#21262d;--surf2:#2d333b;
  --bdr:#30363d;--acc:#f97316;--acc-g:rgba(249,115,22,.15);--acc-d:#431b07;
  --tx:#e6edf3;--tx2:#8b949e;--tx3:#6e7681;
  --grn:#3fb950;--grn-d:rgba(63,185,80,.12);
  --red:#f85149;--yel:#d29922;--blu:#388bfd;
  --nav:60px;--r:6px;
}
@media(prefers-color-scheme:light){:root:not([data-theme=dark]){
  --bg:#f0f4f8;--bg2:#fff;--surf:#fff;--surf2:#f6f8fa;
  --bdr:#d0d7de;--acc:#e8620a;--acc-g:rgba(232,98,10,.1);--acc-d:#fef3ec;
  --tx:#1f2328;--tx2:#636c76;--tx3:#818b98;
  --grn:#1a7f37;--grn-d:rgba(26,127,55,.1);
  --red:#cf222e;--yel:#9a6700;--blu:#0969da;
}}
:root[data-theme=dark]{
  --bg:#0d1117;--bg2:#161b22;--surf:#21262d;--surf2:#2d333b;
  --bdr:#30363d;--acc:#f97316;--acc-g:rgba(249,115,22,.15);--acc-d:#431b07;
  --tx:#e6edf3;--tx2:#8b949e;--tx3:#6e7681;
  --grn:#3fb950;--grn-d:rgba(63,185,80,.12);
  --red:#f85149;--yel:#d29922;--blu:#388bfd;
}
:root[data-theme=light]{
  --bg:#f0f4f8;--bg2:#fff;--surf:#fff;--surf2:#f6f8fa;
  --bdr:#d0d7de;--acc:#e8620a;--acc-g:rgba(232,98,10,.1);--acc-d:#fef3ec;
  --tx:#1f2328;--tx2:#636c76;--tx3:#818b98;
  --grn:#1a7f37;--grn-d:rgba(26,127,55,.1);
  --red:#cf222e;--yel:#9a6700;--blu:#0969da;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:var(--bg);color:var(--tx);font-family:'Inter',system-ui,sans-serif;font-size:15px;line-height:1.5}
body{overflow:hidden}
#app{height:100dvh;display:flex;flex-direction:column}
#main{flex:1;overflow-y:auto;overflow-x:hidden;padding-bottom:calc(var(--nav) + env(safe-area-inset-bottom) + 8px)}
#nav{height:var(--nav);border-top:1px solid var(--bdr);background:var(--bg2);display:flex;position:fixed;bottom:0;left:0;right:0;z-index:100;padding-bottom:env(safe-area-inset-bottom)}
.nb{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;background:none;border:none;color:var(--tx3);cursor:pointer;font-family:inherit;font-size:10px;font-weight:500;letter-spacing:.04em;text-transform:uppercase;transition:color .15s}
.nb.on{color:var(--acc)}
.nb svg{width:20px;height:20px}
.screen{display:none;min-height:100%}
.screen.on{display:block}
/* type */
.bc{font-family:'Barlow Condensed',sans-serif}
/* header */
.ph{padding:14px 14px 10px;border-bottom:1px solid var(--bdr);background:var(--bg);position:sticky;top:0;z-index:10}
.ph h1{font-family:'Barlow Condensed',sans-serif;font-size:24px;font-weight:700;text-wrap:balance}
.ph p{font-size:12px;color:var(--tx2);margin-top:1px}
/* cards */
.card{background:var(--surf);border:1px solid var(--bdr);border-radius:var(--r);margin:8px 12px;overflow:hidden}
/* badge */
.bdg{display:inline-block;font-size:10px;font-weight:600;letter-spacing:.05em;padding:2px 6px;border-radius:3px;text-transform:uppercase}
.bn{background:var(--surf2);color:var(--tx2)}
.bf{background:var(--acc-d);color:var(--acc)}
.bd{background:rgba(248,81,73,.15);color:var(--red)}
.bm{background:rgba(56,139,253,.15);color:var(--blu)}
.bh{background:rgba(210,153,34,.15);color:var(--yel)}
.ba{background:var(--grn-d);color:var(--grn)}
.bp{background:rgba(56,139,253,.1);color:var(--blu)}
.bs{background:var(--acc-d);color:var(--acc)}
/* ex card */
.exc{background:var(--surf);border:1px solid var(--bdr);border-radius:var(--r);margin:6px 12px;overflow:hidden}
.exc.ss1{border-bottom-left-radius:0;border-bottom-right-radius:0;border-bottom:none;margin-bottom:0}
.exc.ss2{border-top-left-radius:0;border-top-right-radius:0;margin-top:0;border-top:2px dashed var(--acc)}
/* ex header */
.exh{padding:10px 12px 8px;display:flex;align-items:flex-start;gap:8px}
.exn{flex:1;min-width:0}
.exnm{font-family:'Barlow Condensed',sans-serif;font-size:21px;font-weight:700;line-height:1.1;color:var(--tx);text-decoration:none;display:block;word-break:break-word}
.exnm:hover{color:var(--acc)}
.exmeta{font-size:12px;color:var(--tx2);margin-top:3px;line-height:1.4}
/* set table */
.st{width:100%;border-collapse:collapse}
.st th{font-size:10px;color:var(--tx3);font-weight:600;text-align:left;padding:3px 6px 3px 12px;text-transform:uppercase;letter-spacing:.05em;border-top:1px solid var(--bdr);background:var(--bg)}
.st td{padding:5px 6px 5px 12px;border-top:1px solid var(--bdr);vertical-align:middle}
.sn{font-size:12px;color:var(--tx3);font-weight:500;width:26px}
.sd{width:38px;text-align:center}
/* weight input */
.wc{display:flex;align-items:center;gap:3px}
.wi{width:68px;background:var(--surf2);border:1px solid var(--bdr);color:var(--tx);font-family:'Inter',sans-serif;font-size:15px;font-weight:600;font-variant-numeric:tabular-nums;text-align:center;padding:5px 3px;border-radius:4px;-moz-appearance:textfield}
.wi::-webkit-outer-spin-button,.wi::-webkit-inner-spin-button{-webkit-appearance:none}
.wi:focus{outline:none;border-color:var(--acc)}
.ab{width:28px;height:30px;border:1px solid var(--bdr);background:var(--surf2);color:var(--tx2);cursor:pointer;font-size:16px;border-radius:4px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.ab:active{background:var(--surf);color:var(--acc)}
/* reps */
.ri{width:50px;background:var(--surf2);border:1px solid var(--bdr);color:var(--tx);font-family:'Inter',sans-serif;font-size:14px;font-weight:600;font-variant-numeric:tabular-nums;text-align:center;padding:5px 3px;border-radius:4px;-moz-appearance:textfield}
.ri::-webkit-outer-spin-button,.ri::-webkit-inner-spin-button{-webkit-appearance:none}
.ri:focus{outline:none;border-color:var(--acc)}
.rt{font-size:10px;color:var(--tx3);margin-top:1px}
/* done btn */
.db{width:30px;height:30px;border-radius:50%;border:2px solid var(--bdr);background:transparent;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .15s;flex-shrink:0}
.db:hover{border-color:var(--grn)}
.db.done{background:var(--grn);border-color:var(--grn)}
.db svg{width:14px;height:14px;color:transparent;transition:color .1s}
.db.done svg{color:#fff}
tr.dc td{opacity:.55}
/* warmup bar */
.wubar{font-size:11px;color:var(--tx2);padding:4px 12px 3px;background:var(--bg);border-bottom:1px solid var(--bdr)}
.wubar strong{font-size:10px;text-transform:uppercase;letter-spacing:.05em;color:var(--tx3)}
/* suggestion */
.sug{font-size:11px;color:var(--acc);background:var(--acc-g);border:1px solid rgba(249,115,22,.25);border-radius:3px;padding:2px 6px;display:inline-block;margin:3px 12px 5px}
/* feeder rpe */
.frpe{font-size:10px;color:var(--acc);background:var(--acc-d);border-radius:3px;padding:1px 5px;white-space:nowrap}
/* hold */
.hbtn{padding:6px 14px;background:var(--acc-d);border:1px solid var(--acc);color:var(--acc);border-radius:4px;font-family:'Barlow Condensed',sans-serif;font-size:16px;font-weight:600;cursor:pointer}
.htick{font-variant-numeric:tabular-nums;font-size:20px;font-weight:700;font-family:'Barlow Condensed',sans-serif;color:var(--acc)}
/* timer overlay */
#tov{position:fixed;top:0;left:0;right:0;z-index:200;display:flex;align-items:flex-start;justify-content:center;padding:10px;pointer-events:none}
.tpill{background:var(--bg2);border:1px solid var(--acc);border-radius:32px;padding:8px 16px;display:flex;align-items:center;gap:12px;pointer-events:all;box-shadow:0 4px 24px rgba(0,0,0,.5)}
.ttim{font-family:'Barlow Condensed',sans-serif;font-size:26px;font-weight:700;color:var(--acc);font-variant-numeric:tabular-nums;min-width:52px}
.tlbl{font-size:11px;color:var(--tx2);max-width:120px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tskp{background:var(--surf2);border:1px solid var(--bdr);color:var(--tx2);padding:4px 10px;border-radius:16px;font-size:12px;cursor:pointer}
/* day picker */
.dgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:10px 12px}
.dbtn{background:var(--surf);border:1px solid var(--bdr);border-radius:var(--r);padding:14px 12px;text-align:left;cursor:pointer;transition:all .15s;width:100%}
.dbtn:active{border-color:var(--acc);background:var(--acc-g)}
.dbtn .dn{font-family:'Barlow Condensed',sans-serif;font-size:20px;font-weight:700;color:var(--tx);display:block}
.dbtn .dt{font-size:12px;color:var(--tx2)}
.mpills{display:flex;flex-wrap:wrap;gap:3px;margin-top:5px}
.mp{font-size:10px;background:var(--surf2);border:1px solid var(--bdr);border-radius:3px;padding:1px 5px;color:var(--tx3)}
/* week sel */
.wsel{display:flex;gap:6px;padding:8px 12px 6px;overflow-x:auto;scrollbar-width:none}
.wsel::-webkit-scrollbar{display:none}
.wbtn{flex-shrink:0;padding:5px 12px;border-radius:20px;border:1px solid var(--bdr);background:var(--surf);color:var(--tx2);font-size:13px;font-weight:500;cursor:pointer;white-space:nowrap}
.wbtn.on{background:var(--acc);border-color:var(--acc);color:#fff}
.dlnote{margin:0 12px 6px;padding:7px 11px;background:rgba(210,153,34,.1);border:1px solid rgba(210,153,34,.3);border-radius:var(--r);font-size:12px;color:var(--yel);line-height:1.4}
/* session header */
.seh{padding:10px 12px;display:flex;align-items:center;gap:8px;border-bottom:1px solid var(--bdr);position:sticky;top:0;background:var(--bg);z-index:9}
.set{font-family:'Barlow Condensed',sans-serif;font-size:19px;font-weight:700;flex:1;line-height:1.1}
.sew{font-size:11px;color:var(--tx2)}
.bbtn{background:none;border:1px solid var(--bdr);color:var(--tx2);border-radius:4px;padding:4px 9px;font-size:12px;cursor:pointer}
.fbtn{background:var(--grn);border:none;color:#fff;border-radius:4px;padding:6px 13px;font-family:'Barlow Condensed',sans-serif;font-size:16px;font-weight:700;cursor:pointer}
/* sub picker */
.sub-btn{background:none;border:none;color:var(--tx3);cursor:pointer;padding:2px}
.sub-btn:hover{color:var(--acc)}
.modal-wrap{position:fixed;inset:0;z-index:300;display:flex;align-items:flex-end}
.modal-bd{position:absolute;inset:0;background:rgba(0,0,0,.65)}
.modal-sh{position:relative;background:var(--bg2);border-radius:16px 16px 0 0;width:100%;padding:18px 16px calc(24px + env(safe-area-inset-bottom));z-index:1;max-height:80dvh;overflow-y:auto}
.sopt{display:block;width:100%;text-align:left;padding:11px 0;border:none;background:none;color:var(--tx);font-size:16px;cursor:pointer;border-bottom:1px solid var(--bdr);font-family:inherit}
.sopt:last-child{border-bottom:none}
.sopt:active{color:var(--acc)}
.sopt.on{color:var(--acc);font-weight:600}
/* history */
.hs{padding:11px 14px;border-bottom:1px solid var(--bdr);cursor:pointer}
.hs:active{background:var(--surf2)}
.hd{font-size:11px;color:var(--tx3)}
.hn{font-family:'Barlow Condensed',sans-serif;font-size:18px;font-weight:700}
.hst{font-size:12px;color:var(--tx2);margin-top:1px}
/* empty */
.empty{text-align:center;padding:48px 24px;color:var(--tx2)}
.empty h3{font-size:18px;margin-bottom:6px;color:var(--tx);font-family:'Barlow Condensed',sans-serif}
/* tools */
.tsec{margin:0 12px 14px}
.tsec h2{font-family:'Barlow Condensed',sans-serif;font-size:20px;font-weight:700;margin-bottom:8px}
/* plates */
.prow{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px;align-items:center}
.pl{width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;flex-shrink:0}
.p20{background:#b91c1c;color:#fff}
.p15{background:#1d4ed8;color:#fff}
.p10{background:#047857;color:#fff}
.p5{background:#92400e;color:#fff}
.p25{background:var(--surf2);border:2px solid var(--bdr);color:var(--tx);font-size:10px}
.p125{width:28px;height:28px;background:var(--surf);border:1px solid var(--bdr);color:var(--tx3);font-size:9px}
/* vol chart */
.vrow{display:flex;align-items:center;gap:8px;margin-bottom:5px}
.vn{font-size:12px;width:90px;flex-shrink:0;color:var(--tx2)}
.vbw{flex:1;background:var(--surf2);border-radius:2px;height:9px;overflow:hidden}
.vb{height:100%;background:var(--acc);border-radius:2px;transition:width .3s}
.vnum{font-size:12px;color:var(--tx);font-variant-numeric:tabular-nums;width:22px;text-align:right;flex-shrink:0}
/* guide */
.tc{padding:10px 14px;border-bottom:1px solid var(--bdr)}
.tterm{font-family:'Barlow Condensed',sans-serif;font-size:18px;font-weight:700}
.tfull{font-size:11px;color:var(--tx3);margin-left:6px}
.tdef{font-size:13px;color:var(--tx2);margin-top:3px;line-height:1.5}
.fq{padding:11px 14px;border-bottom:1px solid var(--bdr)}
.fqq{font-weight:600;font-size:14px;margin-bottom:3px}
.fqa{font-size:13px;color:var(--tx2);line-height:1.5}
/* form */
.inp{background:var(--surf2);border:1px solid var(--bdr);color:var(--tx);border-radius:4px;padding:7px 10px;font-size:14px;font-family:inherit}
.inp:focus{outline:none;border-color:var(--acc)}
.btn{padding:7px 14px;border-radius:4px;border:none;font-family:inherit;font-size:13px;font-weight:600;cursor:pointer}
.btnp{background:var(--acc);color:#fff}
.btns{background:var(--surf2);color:var(--tx);border:1px solid var(--bdr)}
.btn:active{opacity:.8}
/* progress bar */
.pbar{height:3px;background:var(--surf2);overflow:hidden}
.pbf{height:100%;background:var(--acc);transition:width .3s}
/* back-off note */
.bon{font-size:11px;color:var(--yel);padding:3px 12px 4px;background:rgba(210,153,34,.08);border-bottom:1px solid var(--bdr)}
/* sect label */
.slbl{font-size:10px;text-transform:uppercase;letter-spacing:.08em;color:var(--tx3);font-weight:600;padding:10px 14px 3px}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<div id="app">
  <main id="main"></main>
  <nav id="nav">
    <button class="nb on" id="nb-today" onclick="goNav('today')">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="7" width="4" height="10" rx="1"/><rect x="18" y="7" width="4" height="10" rx="1"/><path d="M6 9h12M6 15h12"/></svg>
      ซ้อมวันนี้
    </button>
    <button class="nb" id="nb-history" onclick="goNav('history')">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
      ประวัติ
    </button>
    <button class="nb" id="nb-tools" onclick="goNav('tools')">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z"/></svg>
      เครื่องมือ
    </button>
    <button class="nb" id="nb-guide" onclick="goNav('guide')">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg>
      คู่มือ
    </button>
  </nav>
</div>
<div id="tov" style="display:none"></div>
<div id="modal"></div>

<script>

// ─── STATE ──────────────────────────────────────────────────
let SCR = 'today';
let SESS = null;   // active session
let CFG  = {week:1, repFloor4:false};
let SUBS = {};     // "dayId_exIdx" -> name
let TIMER = {on:false, rem:0, total:0, lbl:'', tid:null};
let HOLDS = {};    // "exIdx_si" -> {rem, done, tid}

// ─── STORAGE ────────────────────────────────────────────────
function loadStorage(){
  try{CFG={...CFG,...JSON.parse(localStorage.getItem('ppl_cfg')||'{}')};}catch(e){}
  try{SUBS=JSON.parse(localStorage.getItem('ppl_subs')||'{}');}catch(e){}
  try{const s=localStorage.getItem('ppl_sess');if(s)SESS=JSON.parse(s);}catch(e){}
}
function saveCfg(){localStorage.setItem('ppl_cfg',JSON.stringify(CFG));}
function saveSubs(){localStorage.setItem('ppl_subs',JSON.stringify(SUBS));}
function saveSess(){
  if(SESS)localStorage.setItem('ppl_sess',JSON.stringify(SESS));
  else localStorage.removeItem('ppl_sess');
}
function allSessions(){try{return JSON.parse(localStorage.getItem('ppl_hist')||'[]');}catch(e){return[];}}
function pushToHistory(s){
  const hs=allSessions();
  const i=hs.findIndex(h=>h.date===s.date&&h.dayId===s.dayId);
  if(i>=0)hs[i]=s;else hs.unshift(s);
  localStorage.setItem('ppl_hist',JSON.stringify(hs));
}
function lastSession(dayId){return allSessions().find(s=>s.dayId===dayId&&s.completed);}

// ─── HELPERS ────────────────────────────────────────────────
function effEx(dayId,idx,week){
  const base=P.days[dayId].ex[idx];
  const ov=(P.weeks[String(week)]||{})[dayId]?.[String(idx)]||{};
  return{...base,...ov};
}
function subName(dayId,idx){
  const k=dayId+'_'+idx, ex=P.days[dayId].ex[idx];
  return SUBS[k]&&SUBS[k]!==ex.n?SUBS[k]:ex.n;
}
function subVideo(dayId,idx){
  const k=dayId+'_'+idx, ex=P.days[dayId].ex[idx];
  if(!SUBS[k]||SUBS[k]===ex.n)return ex.video;
  const si=ex.sub.indexOf(SUBS[k]);
  return si>=0&&ex.subVideo?.[si]?ex.subVideo[si]:ex.video;
}
function repDisplay(ex,si){
  if(ex.type==='perset'&&ex.perSetReps)return String(ex.perSetReps[Math.min(si,ex.perSetReps.length-1)]);
  if(ex.type==='amrap')return'AMRAP';
  if(ex.type==='hold')return'30s';
  let r=String(ex.reps||'');
  if(CFG.repFloor4){
    if(/^\d+$/.test(r)&&parseInt(r)<4)r='4';
    const m=r.match(/^(\d+)-(\d+)$/);
    if(m&&parseInt(m[1])<4)r=`4-${Math.max(4,parseInt(m[2]))}`;
  }
  return r;
}
function muscName(k){return P.muscleLabels[k]||k;}
function fmtTime(s){return`${Math.floor(s/60)}:${String(s%60).padStart(2,'0')}`;}
function todayStr(){return new Date().toISOString().slice(0,10);}
function fmtDate(d){if(!d)return'';return new Date(d+'T12:00:00').toLocaleDateString('th-TH',{day:'numeric',month:'short',year:'numeric'});}
function progression(lastSets,ex){
  if(!lastSets||!lastSets.length)return null;
  const last=lastSets[lastSets.length-1];
  if(!last||!last.weight||last.weight<=0)return null;
  const r=String(ex.reps||'');
  const m=r.match(/^(\d+)-(\d+)$/);
  if(m&&last.reps>=parseInt(m[2]))return last.weight+2.5;
  if(/^\d+$/.test(r)&&last.reps>=parseInt(r))return last.weight+2.5;
  return null;
}

// ─── AUDIO / HAPTIC ─────────────────────────────────────────
let AC=null;
function beep(f,d,v){
  try{
    if(!AC)AC=new(window.AudioContext||window.webkitAudioContext)();
    const o=AC.createOscillator(),g=AC.createGain();
    o.connect(g);g.connect(AC.destination);
    o.frequency.value=f||880;o.type='sine';
    g.gain.setValueAtTime(v||0.25,AC.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001,AC.currentTime+(d||0.2));
    o.start(AC.currentTime);o.stop(AC.currentTime+(d||0.2));
  }catch(e){}
}
function vibrate(p){try{navigator.vibrate?.(p);}catch(e){}}

// ─── REST TIMER ──────────────────────────────────────────────
function startRest(sec,lbl){
  if(sec<=0)return;
  stopTimer();
  TIMER={on:true,rem:sec,total:sec,lbl:lbl||'',tid:null};
  TIMER.tid=setInterval(()=>{
    TIMER.rem--;
    if(TIMER.rem<=0){
      TIMER.rem=0;stopTimer();
      beep(880,.1);setTimeout(()=>beep(880,.1),200);setTimeout(()=>beep(1100,.4),420);
      vibrate([200,100,200]);
    }else if(TIMER.rem<=3)beep(660,.08,.1);
    renderTimer();
  },1000);
  renderTimer();
}
function stopTimer(){
  if(TIMER.tid)clearInterval(TIMER.tid);
  TIMER={on:false,rem:0,total:0,lbl:'',tid:null};
  renderTimer();
}
function renderTimer(){
  const el=document.getElementById('tov');
  if(!TIMER.on){el.style.display='none';return;}
  el.style.display='flex';
  const pct=TIMER.rem/TIMER.total;
  const c=pct>.5?'var(--grn)':pct>.25?'var(--yel)':'var(--red)';
  el.innerHTML=`<div class="tpill"><div><div class="ttim" style="color:${c}">${fmtTime(TIMER.rem)}</div><div class="tlbl">พัก${TIMER.lbl?': '+TIMER.lbl:''}</div></div><button class="tskp" onclick="stopTimer()">ข้าม</button></div>`;
}

// ─── HOLD TIMER ──────────────────────────────────────────────
function startHold(ei,si){
  const k=ei+'_'+si;
  if(HOLDS[k]?.running)return;
  HOLDS[k]={rem:30,running:true,done:false};
  const tick=()=>{
    if(!HOLDS[k]||!HOLDS[k].running)return;
    HOLDS[k].rem--;
    const el=document.getElementById('hld_'+k);
    if(HOLDS[k].rem<=0){
      HOLDS[k]={rem:0,running:false,done:true};
      beep(880,.2);vibrate([150,100,150]);
      if(el)el.innerHTML='<span style="color:var(--grn);font-weight:600">✓ เสร็จ</span>';
    }else{
      if(el)el.innerHTML=`<span class="htick">${HOLDS[k].rem}s</span>`;
      setTimeout(tick,1000);
    }
  };
  setTimeout(tick,1000);
  const el=document.getElementById('hld_'+k);
  if(el)el.innerHTML=`<span class="htick">30s</span>`;
}

// ─── SESSION ─────────────────────────────────────────────────
function startSession(dayId){
  const day=P.days[dayId];
  const last=lastSession(dayId);
  let topSetWeights=[];
  const exercises=day.ex.map((baseEx,idx)=>{
    const ex=effEx(dayId,idx,CFG.week);
    const lastEx=last?.exercises?.[idx];
    const lastSets=lastEx?.sets||[];
    const lastW=lastSets[0]?.weight||0;
    let sugW=lastW;
    const prog=progression(lastSets,ex);
    if(prog!==null)sugW=prog;
    // back-off: use % of previous exercise's top set weight
    if(ex.backoffPct&&topSetWeights.length>0){
      const top=topSetWeights[topSetWeights.length-1];
      if(top>0){const calc=Math.round(top*ex.backoffPct/100/2.5)*2.5;sugW=calc;}
    }
    const sets=[];
    for(let i=0;i<ex.ws;i++)sets.push({weight:sugW,reps:null,done:false});
    if(ex.type==='dropset'){
      const dw=sugW>0?Math.round(sugW*(1-(ex.dropPct||40)/100)/2.5)*2.5:0;
      sets[0].dropWeight=dw;sets[0].dropReps=null;
    }
    topSetWeights.push(sugW);
    return{
      baseIdx:idx,
      name:subName(dayId,idx),
      suggested:(prog!==null&&lastW>0&&prog!==lastW)?prog:null,
      sets
    };
  });
  SESS={date:todayStr(),dayId,week:CFG.week,exercises,completed:false};
  HOLDS={};
  saveSess();render();
}
function finishSession(){
  if(!SESS)return;
  SESS.completed=true;
  pushToHistory(SESS);
  SESS=null;saveSess();stopTimer();render();
}
function cancelSession(){
  if(!confirm('ยกเลิกการซ้อมวันนี้?\n(ข้อมูลที่บันทึกไว้แล้วจะหายไป)'))return;
  SESS=null;saveSess();stopTimer();render();
}

// ─── NAV ─────────────────────────────────────────────────────
function goNav(s){
  SCR=s;
  document.querySelectorAll('.nb').forEach(b=>b.classList.remove('on'));
  document.getElementById('nb-'+s)?.classList.add('on');
  render();
}

// ─── RENDER ──────────────────────────────────────────────────
function render(){
  const m=document.getElementById('main');
  if(SCR==='today')m.innerHTML=SESS?renderWorkout():renderDayPicker();
  else if(SCR==='history')m.innerHTML=renderHistory();
  else if(SCR==='tools')m.innerHTML=renderTools();
  else if(SCR==='guide')m.innerHTML=renderGuide();
  renderTimer();
}

// ─── TODAY: WORKOUT ──────────────────────────────────────────
function renderWorkout(){
  const s=SESS;
  const day=P.days[s.dayId];
  const total=s.exercises.reduce((a,e)=>a+e.sets.length,0);
  const done=s.exercises.reduce((a,e)=>a+e.sets.filter(x=>x.done).length,0);
  const pct=total?Math.round(done/total*100):0;
  const isLeg=s.dayId==='legs'||s.dayId==='full';
  const wuItems=P.generalWarmup.items.filter(i=>!i.legDayOnly||isLeg)
    .map(i=>`<div style="display:flex;gap:6px"><span style="color:var(--acc);font-size:11px;margin-top:2px">•</span><span style="font-size:13px;color:var(--tx2)">${i.name} <span style="color:var(--tx3)">(${i.repsTime})</span></span></div>`).join('');
  const deload=P.weeks[String(s.week)]?.deload;
  const cards=s.exercises.map((_,i)=>buildCard(i)).join('');
  return`<div class="seh">
    <button class="bbtn" onclick="cancelSession()">✕</button>
    <div><div class="set">${day.name} · ${day.th}</div><div class="sew">W${s.week} · ${fmtDate(s.date)}</div></div>

  <div style="padding:5px 14px;display:flex;gap:8px;align-items:center">
    <span style="font-size:12px;color:var(--tx2)">${done}/${total} เซ็ต</span>
    <span style="font-size:12px;color:var(--acc);font-weight:600">${pct}%</span>
  </div>
  ${deload?`<div class="dlnote" style="margin-top:0">⚠️ Deload — ลดน้ำหนัก ห้ามดันถึงหมดแรง</div>`:''}
  <details style="margin:4px 12px 4px;background:var(--surf);border:1px solid var(--bdr);border-radius:var(--r)">
    <summary style="padding:8px 12px;font-size:12px;color:var(--tx2);cursor:pointer;list-style:none;user-select:none">▸ วอร์มอัพทั่วไป</summary>
    <div style="padding:6px 12px 10px;display:flex;flex-direction:column;gap:4px">${wuItems}</div>
  </details>
  ${cards}
  <div style="padding:14px 12px 4px">
    <button class="btn btnp" style="width:100%;font-family:'Barlow Condensed',sans-serif;font-size:18px;font-weight:700;padding:11px" onclick="finishSession()">จบซ้อม ✓</button>
  </div>`;
}

function buildCard(ei){
  const s=SESS;
  const el=s.exercises[ei];
  const ex=effEx(s.dayId,el.baseIdx,s.week);
  const vid=subVideo(s.dayId,el.baseIdx);
  const badgeMap={normal:['bn','Normal'],feeder:['bf','Feeder'],dropset:['bd','Drop 10+5'],mechdrop:['bm','Mech Drop 8+8'],hold:['bh','Hold 30s'],amrap:['ba','AMRAP'],perset:['bp','Per-set']};
  const [bc,bl]=badgeMap[ex.type]||['bn',ex.type];
  const isSSfirst=ex.superset&&!el.name.includes('A2')&&el.name.includes('A1');
  const isSSsecond=ex.superset&&el.name.includes('A2');
  const cls='exc'+(isSSfirst?' ss1':isSSsecond?' ss2':'');
  const wuHtml=ex.wu!=='0'?`<div class="wubar"><strong>วอร์ม</strong> ${ex.wu} เซ็ต · RPE ${ex.rpe}</div>`:'';
  const boHtml=ex.backoffPct?`<div class="bon">↓ Back-off: ${ex.backoffPct}% ของ top set (${ex.th})</div>`:'';
  const mdHtml=ex.type==='mechdrop'?`<div style="font-size:11px;color:var(--blu);padding:3px 12px 4px;border-bottom:1px solid var(--bdr)">${ex.th}</div>`:'';
  const sugHtml=el.suggested?`<div class="sug">↑ เพิ่มเป็น ${el.suggested}kg จากสัปดาห์ก่อน</div>`:'';
  const subBtn=ex.sub.length>0?`<button class="sub-btn" title="เปลี่ยนท่า" onclick="openSub(${ei})"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 1l4 4-4 4"/><path d="M3 11V9a4 4 0 0 1 4-4h14"/><path d="M7 23l-4-4 4-4"/><path d="M21 13v2a4 4 0 0 1-4 4H3"/></svg></button>`:'' ;
  const ssBadge=ex.superset?`<span class="bdg bs">${ex.superset}</span>`:'';

  let tableHtml='';
  if(ex.type==='hold'){
    const rows=el.sets.map((set,si)=>{
      const k=ei+'_'+si, hd=HOLDS[k];
      let hcon=hd?.done?'<span style="color:var(--grn);font-weight:600">✓ เสร็จ</span>':hd?.running?`<span class="htick">${hd.rem}s</span>`:`<button class="hbtn" onclick="startHold(${ei},${si})">▶ 30s</button>`;
      return`<tr class="${set.done?'dc':''}"><td class="sn">${si+1}</td><td colspan="2" id="hld_${k}" style="padding:7px 12px">${hcon}</td><td class="sd">${doneBtn(ei,si,set.done)}</td></tr>`;
    }).join('');
    tableHtml=`<table class="st"><thead><tr><th>#</th><th colspan="2">เป้าหมาย</th><th></th></tr></thead><tbody>${rows}</tbody></table>`;
  } else if(ex.type==='dropset'){
    const set=el.sets[0],rt=repDisplay(ex,0),dw=set.dropWeight??0;
    tableHtml=`<table class="st">
      <thead><tr><th>#</th><th>น้ำหนัก (kg)</th><th>ครั้ง</th><th></th></tr></thead>
      <tbody>
        <tr class="${set.done?'dc':''}">
          <td class="sn">1</td>
          <td>${weightCell(ei,0,set.weight,false)}</td>
          <td><input class="ri" type="number" value="${set.reps??''}" placeholder="${rt}" min="0" inputmode="numeric" oninput="setReps(${ei},0,this.value)"><div class="rt">เป้า ${rt}</div></td>
          <td class="sd">${doneBtn(ei,0,set.done)}</td>
        </tr>
        <tr style="background:rgba(248,81,73,.05)">
          <td class="sn" style="color:var(--red)">↓</td>
          <td>${weightCell(ei,0,dw,true)}</td>
          <td><input class="ri" type="number" value="${set.dropReps??''}" placeholder="+5" min="0" inputmode="numeric" oninput="SESS.exercises[${ei}].sets[0].dropReps=parseInt(this.value)||0;saveSess()"><div class="rt">Drop +5</div></td>
          <td></td>
        </tr>
      </tbody></table>`;
  } else {
    const rows=el.sets.map((set,si)=>{
      const rt=repDisplay(ex,si);
      const frpe=ex.type==='feeder'&&ex.feederRPE?`<span class="frpe">RPE ${ex.feederRPE[si]}</span>`:`<span style="font-size:10px;color:var(--tx3)">RPE ${ex.rpe}</span>`;
      return`<tr class="${set.done?'dc':''}">
        <td class="sn">${si+1}</td>
        <td>${weightCell(ei,si,set.weight,false)}</td>
        <td><input class="ri" type="number" value="${set.reps??''}" placeholder="${rt}" min="0" inputmode="numeric" oninput="setReps(${ei},${si},this.value)"><div class="rt">เป้า ${rt}</div>${frpe}</td>
        <td class="sd">${doneBtn(ei,si,set.done)}</td>
      </tr>`;
    }).join('');
    tableHtml=`<table class="st"><thead><tr><th>#</th><th>น้ำหนัก (kg)</th><th>ครั้ง / RPE</th><th></th></tr></thead><tbody>${rows}</tbody></table>`;
  }

  return`<div class="${cls}" id="exc_${ei}">
    <div class="exh">
      <div class="exn">
        <div style="display:flex;gap:5px;flex-wrap:wrap;margin-bottom:4px">${ssBadge}<span class="bdg ${bc}">${bl}</span></div>
        <a class="exnm" href="${vid||'#'}" target="_blank" ${!vid?'onclick="return false"':''}>${el.name}</a>
        ${!ex.backoffPct&&ex.type!=='mechdrop'?`<div class="exmeta">${ex.th}</div>`:''}
      </div>
      <div style="display:flex;gap:6px;align-items:center;flex-shrink:0">${subBtn}</div>
    </div>
    ${wuHtml}${boHtml}${mdHtml}${sugHtml}${tableHtml}
  </div>`;
}

function weightCell(ei,si,val,isDrop){
  const id=(isDrop?'dw':'w')+'_'+ei+'_'+si;
  const oc=isDrop
    ?`SESS.exercises[${ei}].sets[${si}].dropWeight=Math.max(0,parseFloat(this.value)||0);saveSess()`
    :`setWeight(${ei},${si},this.value)`;
  return`<div class="wc">
    <button class="ab" onclick="adjW(${ei},${si},-2.5,${isDrop})">−</button>
    <input class="wi" type="number" id="${id}" value="${val||0}" step="2.5" min="0" inputmode="decimal" oninput="${oc}">
    <button class="ab" onclick="adjW(${ei},${si},2.5,${isDrop})">+</button>
  </div>`;
}
function doneBtn(ei,si,done){
  return`<button class="db${done?' done':''}" onclick="markDone(${ei},${si})"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg></button>`;
}

// ─── SET ACTIONS ─────────────────────────────────────────────
function setWeight(ei,si,v){if(!SESS)return;SESS.exercises[ei].sets[si].weight=Math.max(0,parseFloat(v)||0);saveSess();}
function adjW(ei,si,d,isDrop){
  if(!SESS)return;
  const set=SESS.exercises[ei].sets[si];
  if(isDrop){
    set.dropWeight=Math.max(0,Math.round(((set.dropWeight||0)+d)/2.5)*2.5);
    const el=document.getElementById('dw_'+ei+'_'+si);
    if(el)el.value=set.dropWeight;
  }else{
    set.weight=Math.max(0,Math.round(((set.weight||0)+d)/2.5)*2.5);
    const el=document.getElementById('w_'+ei+'_'+si);
    if(el)el.value=set.weight;
  }
  saveSess();
}
function setReps(ei,si,v){if(!SESS)return;SESS.exercises[ei].sets[si].reps=parseInt(v)||0;saveSess();}
function markDone(ei,si){
  if(!SESS)return;
  const set=SESS.exercises[ei].sets[si];
  set.done=!set.done;
  saveSess();
  if(set.done){
    const ex=effEx(SESS.dayId,SESS.exercises[ei].baseIdx,SESS.week);
    if(ex.rest>0)startRest(ex.rest,SESS.exercises[ei].name);
  }
  // re-render just this card
  const card=document.getElementById('exc_'+ei);
  if(card){const tmp=document.createElement('div');tmp.innerHTML=buildCard(ei);card.replaceWith(tmp.firstChild);}
  // update progress bar inline
  const total=SESS.exercises.reduce((a,e)=>a+e.sets.length,0);
  const done=SESS.exercises.reduce((a,e)=>a+e.sets.filter(x=>x.done).length,0);
  const pct=total?Math.round(done/total*100):0;
  const pb=document.querySelector('.pbf');if(pb)pb.style.width=pct+'%';
  const ps=document.querySelector('.seh+.pbar+div span:first-child');if(ps)ps.textContent=done+'/'+total+' เซ็ต';
  const pp=document.querySelector('.seh+.pbar+div span:last-child');if(pp)pp.textContent=pct+'%';
}

      <div style="font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--tx3);font-weight:600;margin-bottom:12px">เปลี่ยนท่า — ${ex.n}</div>
      ${items}
      <button class="sopt" style="color:var(--tx3);margin-top:4px" onclick="closeModal()">ยกเลิก</button>
    </div>

function setSub(ei,name){

function closeModal(){document.getElementById('modal').innerHTML='';}

// ─── HISTORY ─────────────────────────────────────────────────
function renderHistory(){
  const sessions=allSessions().filter(s=>s.completed);
  if(!sessions.length)return`<div class="ph"><h1>ประวัติ</h1></div><div class="empty"><h3>ยังไม่มีประวัติ</h3><p>เริ่มซ้อมเลย!</p></div>`;
  const expRow=`<div style="display:flex;gap:8px;padding:10px 12px">
    <button class="btn btns" onclick="exportData()">↑ Export JSON</button>
    <label class="btn btns" style="cursor:pointer">↓ Import JSON<input type="file" accept=".json" style="display:none" onchange="handleImport(event)"></label>
  </div>`;
  const rows=sessions.map(s=>{
    const day=P.days[s.dayId];
    const totalSets=s.exercises?.reduce((a,e)=>a+(e.sets?.length||0),0)||0;
    const doneVol=s.exercises?.reduce((a,e)=>a+(e.sets?.reduce((b,x)=>b+(x.done?(x.weight||0)*(x.reps||0):0),0)||0),0)||0;
    return`<div class="hs" onclick="showSessDetail('${s.date}','${s.dayId}')">
      <div class="hd">${fmtDate(s.date)} · W${s.week}</div>
      <div class="hn">${day?.name||s.dayId} · ${day?.th||''}</div>
      <div class="hst">${totalSets} เซ็ต · ${doneVol.toFixed(0)} kg volume</div>
    </div>`;
  }).join('');
  return`<div class="ph"><h1>ประวัติ</h1><p>${sessions.length} session</p></div>${expRow}${rows}`;
}
function showSessDetail(date,dayId){
  const s=allSessions().find(x=>x.date===date&&x.dayId===dayId);
  if(!s)return;
  const day=P.days[dayId];
  const rows=s.exercises?.map(ex=>{
    const sets=ex.sets?.filter(x=>x.done).map(x=>`${x.weight}×${x.reps||'?'}`).join(', ')||'—';
    return`<div style="padding:8px 14px;border-bottom:1px solid var(--bdr)"><div style="font-family:'Barlow Condensed',sans-serif;font-size:16px;font-weight:700">${ex.name}</div><div style="font-size:12px;color:var(--tx2)">${sets}</div></div>`;
  }).join('')||'';
  document.getElementById('modal').innerHTML=`<div class="modal-wrap">
    <div class="modal-bd" onclick="closeModal()"></div>
    <div class="modal-sh" style="max-height:80dvh;overflow-y:auto">
      <div style="font-family:'Barlow Condensed',sans-serif;font-size:20px;font-weight:700;margin-bottom:10px">${day?.name} · ${fmtDate(date)}</div>
      ${rows}
      <button class="sopt" style="color:var(--tx3);margin-top:8px" onclick="closeModal()">ปิด</button>
    </div>
  </div>`;
}
function exportData(){
  const data={sessions:allSessions(),cfg:CFG,subs:SUBS};
  const b=new Blob([JSON.stringify(data,null,2)],{type:'application/json'});
  const u=URL.createObjectURL(b);
  const a=document.createElement('a');a.href=u;a.download=`ppl-backup-${todayStr()}.json`;a.click();URL.revokeObjectURL(u);
}
function handleImport(e){
  const f=e.target.files[0];if(!f)return;
  const r=new FileReader();
  r.onload=ev=>{try{const d=JSON.parse(ev.target.result);if(d.sessions)localStorage.setItem('ppl_hist',JSON.stringify(d.sessions));if(d.cfg){CFG={...CFG,...d.cfg};saveCfg();}if(d.subs){SUBS=d.subs;saveSubs();}render();alert('นำเข้าสำเร็จ');}catch(err){alert('ไฟล์ไม่ถูกต้อง');}};
  r.readAsText(f);
}

// ─── TOOLS ───────────────────────────────────────────────────
function renderTools(){
  // weekly volume
  const now=new Date();const dow=now.getDay();
  const diff=now.getDate()-dow+(dow===0?-6:1);
  const wkStart=new Date(now.setDate(diff)).toISOString().slice(0,10);
  const wkSess=allSessions().filter(s=>s.completed&&s.date>=wkStart);
  const volMap={};
  wkSess.forEach(s=>{
    s.exercises?.forEach((ex,xi)=>{
      const dayEx=P.days[s.dayId]?.ex[ex.baseIdx!==undefined?ex.baseIdx:xi];
      (dayEx?.m||[]).forEach(m=>{
        volMap[m]=(volMap[m]||0)+(ex.sets?.filter(x=>x.done).length||0);
      });
    });
  });
  const maxVol=Math.max(...Object.values(volMap),1,8);
  const volHtml=Object.entries(P.muscleLabels).map(([k,lbl])=>{
    const v=volMap[k]||0;
    const pct=v/maxVol*100;
    const c=v===0?'var(--bdr)':v>=10?'var(--grn)':v>=6?'var(--acc)':'var(--yel)';
    return`<div class="vrow"><div class="vn">${lbl}</div><div class="vbw"><div class="vb" style="width:${pct}%;background:${c}"></div></div><div class="vnum">${v}</div></div>`;
  }).join('');

  return`<div class="ph"><h1>เครื่องมือ</h1></div>
  <div style="padding:10px 12px 4px">
    <h2 style="font-family:'Barlow Condensed',sans-serif;font-size:19px;font-weight:700;margin-bottom:8px">Volume สัปดาห์นี้ (เซ็ต)</h2>
    ${volHtml}
    <div style="margin-top:4px;font-size:11px;color:var(--tx3)">สีเขียว ≥10 เซ็ต · สีส้ม 6-9 · สีเหลือง 1-5 · ขาว = 0</div>
  </div>

  <div style="margin:0 12px;border-top:1px solid var(--bdr);padding-top:12px">
    <h2 style="font-family:'Barlow Condensed',sans-serif;font-size:19px;font-weight:700;margin-bottom:8px">เครื่องคิดแผ่น (บาร์ 20kg)</h2>
    <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap">
      <input class="inp" type="number" id="pt" placeholder="น้ำหนักเป้า (kg)" style="width:180px" inputmode="decimal" oninput="calcPlates()">
    </div>
    <div id="pr" class="prow" style="min-height:44px;margin-top:8px"></div>
  </div>

  <div style="margin:0 12px;border-top:1px solid var(--bdr);padding-top:12px">
    <h2 style="font-family:'Barlow Condensed',sans-serif;font-size:19px;font-weight:700;margin-bottom:8px">เครื่องคิดวอร์ม</h2>
    <div style="display:flex;gap:8px;flex-wrap:wrap">
      <input class="inp" type="number" id="ww" placeholder="น้ำหนักเซ็ตจริง (kg)" style="width:200px" inputmode="decimal" oninput="calcWarmup()">
      <select class="inp" id="ws" style="width:130px" onchange="calcWarmup()">
        <option value="1">1 เซ็ตวอร์ม</option>
        <option value="2">2 เซ็ตวอร์ม</option>
        <option value="3" selected>3 เซ็ตวอร์ม</option>
        <option value="4">4 เซ็ตวอร์ม</option>
      </select>
    </div>
    <div id="wr" style="margin-top:8px"></div>
  </div>

  <div style="margin:0 12px;border-top:1px solid var(--bdr);padding-top:12px">
    <h2 style="font-family:'Barlow Condensed',sans-serif;font-size:19px;font-weight:700;margin-bottom:8px">การตั้งค่า</h2>
    <label style="display:flex;align-items:center;gap:10px;cursor:pointer;padding:8px 0;border-bottom:1px solid var(--bdr)">
      <input type="checkbox" ${CFG.repFloor4?'checked':''} onchange="CFG.repFloor4=this.checked;saveCfg()" style="width:18px;height:18px;accent-color:var(--acc)">
      <div>
        <div style="font-size:14px;font-weight:500">repFloor4</div>
        <div style="font-size:12px;color:var(--tx2)">ถ้า reps น้อยกว่า 4 ให้ขึ้นเป็น 4 แทน</div>
      </div>
    </label>
    <div style="padding:8px 0;font-size:13px;color:var(--tx2)">สัปดาห์ปัจจุบัน: <strong style="color:var(--acc)">W${CFG.week}</strong></div>
  </div>
  <div style="height:20px"></div>`;
}

function calcPlates(){
  const t=parseFloat(document.getElementById('pt')?.value)||0;
  const res=document.getElementById('pr');if(!res)return;
  if(t<=20){res.innerHTML='<span style="color:var(--tx3);font-size:13px">ใส่แค่บาร์ (20 kg)</span>';return;}
  const per=(t-20)/2;
  const sizes=[20,15,10,5,2.5,1.25];
  const cls={20:'pl p20',15:'pl p15',10:'pl p10',5:'pl p5',2.5:'pl p25',1.25:'pl p125'};
  let rem=per,html='';
  sizes.forEach(p=>{
    const n=Math.floor(rem/p+0.001);
    if(n>0){rem=Math.round((rem-n*p)*1000)/1000;for(let i=0;i<n;i++)html+=`<div class="${cls[p]}">${p}</div>`;}
  });
  if(rem>0.01)html+=`<span style="color:var(--red);font-size:12px">ไม่ลงตัว</span>`;
  html+=`<span style="font-size:11px;color:var(--tx3);align-self:center;margin-left:4px">ต่อด้าน</span>`;
  res.innerHTML=html;
}

function calcWarmup(){
  const w=parseFloat(document.getElementById('ww')?.value)||0;
  const n=parseInt(document.getElementById('ws')?.value)||3;
  const res=document.getElementById('wr');if(!res)return;
  if(w<=0){res.innerHTML='';return;}
  const rule=P.warmupCalc.rules.find(r=>r.warmupSets===n);
  if(!rule)return;
  const rows=rule.steps.map((step,i)=>{
    const wkg=Math.round(w*step.pct/100/2.5)*2.5;
    return`<tr><td style="padding:5px 8px 5px 0;color:var(--tx2);font-size:13px">เซ็ต ${i+1}</td><td style="padding:5px 8px;font-size:15px;font-weight:600;font-variant-numeric:tabular-nums">${wkg} kg</td><td style="padding:5px 0;font-size:11px;color:var(--tx3)">${step.pct}% · ${step.reps}</td></tr>`;
  }).join('');
  res.innerHTML=`<table style="border-collapse:collapse">${rows}</table><div style="font-size:11px;color:var(--tx3);margin-top:5px">${P.warmupCalc.note_th}</div>`;
}

// ─── GUIDE ───────────────────────────────────────────────────
function renderGuide(){
  const terms=P.keyTerms.map(t=>`<div class="tc"><div style="display:flex;align-items:baseline;gap:6px"><span class="tterm">${t.term}</span>${t.full?`<span class="tfull">${t.full}</span>`:''}</div><div class="tdef">${t.th}</div></div>`).join('');
  const faqs=P.faq.map(f=>`<div class="fq"><div class="fqq">${f.q_th}</div><div class="fqa">${f.a_th}</div></div>`).join('');
  const prog=P.progression.rules_th.map(r=>`<div style="display:flex;gap:7px;padding:6px 0;border-bottom:1px solid var(--bdr)"><span style="color:var(--acc);flex-shrink:0">•</span><span style="font-size:13px;color:var(--tx2);line-height:1.5">${r}</span></div>`).join('');
  return`<div class="ph"><h1>คู่มือ</h1><p>PPL 4x · Jeff Nippard · Phase 1 W1-6</p></div>
  <div style="padding:8px 14px 4px;font-size:13px;color:var(--tx2);line-height:1.5">${P.schedule.restRule_th}</div>

  <div class="slbl">Progressive Overload</div>
  <div style="padding:0 14px 10px">${prog}</div>

  <div class="slbl">FAQ</div>
  ${faqs}

  <div class="slbl">คำศัพท์</div>
  ${terms}
  <div style="height:20px"></div>`;
}

// ─── INIT ────────────────────────────────────────────────────
loadStorage();
render();
</script>
